# B-182 (PAD-435): keep access tokens out of the logs, as the host nginx does
# (infra/nginx/conf.d/levapp-log-redaction.conf). This file is included at http level
# (conf.d/default.conf), so the map and the format below are http-level too.
map $request_uri $levapp_log_request_uri {
  default $request_uri;
  "~*^(?<levapp_log_path>[^?]*)\?(.*&)?(access_)?token=" "${levapp_log_path}?[redacted]";
}

log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $levapp_log_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80;
  access_log /var/log/nginx/access.log redacted;
  server_name _;
  resolver 127.0.0.11 ipv6=off valid=10s;

  # SSE (R-009: the token rides in the query string). The same proxying as /api/ below; its own
  # location only so an upstream error, which writes the request line at level error, is kept
  # out of error.log (B-182).
  location /api/app/events {
    error_log /var/log/nginx/error.log crit;
    set $backend_upstream padelapp;
    proxy_pass http://$backend_upstream:80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $backend_upstream padelapp;
    proxy_pass http://$backend_upstream:80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  root /usr/share/nginx/html;
  index index.html;

  # Universal Links (PAD-184). The file ships in apps/web/public/.well-known/ and
  # is copied verbatim into dist/ by Vite, so it is already under `root`.
  #
  # Two things Apple is strict about, and neither is the default here:
  #   - Content-Type MUST be application/json. The file has no extension, so
  #     nginx's mime map does not match it and it would otherwise be served as
  #     text/plain. `types { }` empties the map for this location so that
  #     `default_type` actually wins.
  #   - No redirect, no auth. `location =` keeps this exact path off the SPA
  #     `try_files … /index.html` fallback below, which would otherwise answer a
  #     missing file with the HTML shell and a 200 — the failure mode that looks
  #     like it works until a device refuses to register the domain.
  # Short cache: iOS refetches the file when the app is installed/updated, and a
  # long TTL at the CDN/host layer makes a path change take days to take effect.
  location = /.well-known/apple-app-site-association {
    types { }
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
  }

  # Brand assets that transactional mail loads (auth.email-verification rule 7,
  # PAD-251 / B-043). Off the SPA fallback below: a missing file used to come
  # back as index.html with a 200, which every status-only check calls healthy
  # and every mail client renders as a broken image. Now it is an honest 404.
  location /brand/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
