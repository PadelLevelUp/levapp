server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 ipv6=off valid=10s;

  location /api/ {
    set $backend_upstream padelapp;
    proxy_pass http://$backend_upstream:80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  root /usr/share/nginx/html;
  index index.html;

  # Universal Links (PAD-184). The file ships in apps/web/public/.well-known/ and
  # is copied verbatim into dist/ by Vite, so it is already under `root`.
  #
  # Two things Apple is strict about, and neither is the default here:
  #   - Content-Type MUST be application/json. The file has no extension, so
  #     nginx's mime map does not match it and it would otherwise be served as
  #     text/plain. `types { }` empties the map for this location so that
  #     `default_type` actually wins.
  #   - No redirect, no auth. `location =` keeps this exact path off the SPA
  #     `try_files … /index.html` fallback below, which would otherwise answer a
  #     missing file with the HTML shell and a 200 — the failure mode that looks
  #     like it works until a device refuses to register the domain.
  # Short cache: iOS refetches the file when the app is installed/updated, and a
  # long TTL at the CDN/host layer makes a path change take days to take effect.
  location = /.well-known/apple-app-site-association {
    types { }
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
