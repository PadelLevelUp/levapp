<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Poppins;font-weight:700;src:url(poppins-latin-700-normal.woff2)}
@font-face{font-family:Jakarta;font-weight:500;src:url(plus-jakarta-sans-latin-500-normal.woff2)}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:linear-gradient(150deg,#16294A 0%,#0B1524 100%);font-family:Jakarta,sans-serif;color:#F2F6FC;position:relative}
.court{position:absolute;right:-60px;top:40px;width:420px;height:420px;border:3px solid rgba(74,155,255,.28);border-radius:18px;transform:rotate(-8deg)}
.court:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid rgba(74,155,255,.28)}
.court:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px solid rgba(74,155,255,.28)}
.wrap{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:620px}
img{width:240px;height:auto;margin-bottom:34px}
h1{font-family:Poppins;font-weight:700;font-size:46px;line-height:1.12;margin:0 0 18px;letter-spacing:-.5px}
p{font-size:22px;margin:0;color:#A9BCD6}
</style></head><body><div class="court"></div><div class="wrap"><img src="lockup.svg" alt=""><h1>Mais turmas cheias.<br>Menos mensagens para gerir.</h1><p>Para treinadores e alunos de padel.</p></div></body></html>
