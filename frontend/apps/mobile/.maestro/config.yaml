# Maestro workspace config. Run with:  maestro test .maestro
# Flows are named after their files (no `name:` field) so the execution
# order below is the numbered order. Maestro does NOT guarantee order for a
# bare folder run — this list does. Order matters: 03 creates the class 05
# deletes, and 04 sets the presence 14 asserts. 15 renames "E2E Academy
# Class" and reverts it within itself, so its exact position isn't load
# bearing, but it's still listed for a deterministic full-suite run.
flows:
  - "flows/*"

# PAD-314 close-out: probes of KNOWN-OPEN defects run on demand, not in whole-suite
# runs — a suite that is red for a known reason teaches people to stop reading it.
# Their flow files carry this tag and say which defect and when to remove it. The
# Android lane passes its own --exclude-tags (CLI flags take precedence over this
# file), so scripts/ci-android-maestro.sh excludes the same tag.
excludeTags:
  - open-defect-probe

executionOrder:
  continueOnFailure: true
  flowsOrder:
    - 01-login
    - 02-coach-dashboard
    - 03-class-management
    - 04-attendance
    - 05-class-deletion
    - 06-add-player
    - 07-player-notes
    # 57 (PAD-337 on the record form, PAD-374) resets E2E Student's evaluations through the
    # API before it starts, DOES write (one "+" is one saved input) and clears what it wrote,
    # asserting both on the server; it sits early, beside the other player-detail flow.
    - 57-evaluation-untouched-categories
    # 78 (PAD-374) resets E2E Student's evaluations through the API before it starts and deletes
    # what it writes, so its position is not load bearing; it must not run between 57's steps.
    - 78-player-evaluations
    # 58 (PAD-325) reads only: opens a class id no seed creates.
    - 58-class-gone-way-back
    - 09-direct-messages
    - 10-exercise-crud
    - 11-exercise-groups
    - 12-settings-language
    - 13-student-availability
    - 14-student-calendar
    - 15-class-edit
    - 16-class-notify-remind
    - 17-message-reactions
    - 18-settings-sections
    - 19-message-reply
    - 20-add-player-invite
    # 21 creates and deletes its own "Maestro Test Event", so its position is
    # not load bearing — listed for a deterministic full-suite run.
    - 21-event-detail
    # 22 only reads (it never writes a presence), so it is order-independent;
    # it does read better after 04 has marked the seeded student present.
    - 22-student-attendance-history
    # 31 reads only (switches the calendar to Semana and opens the seeded class).
    - 31-week-view
    # 32 reads only (switches the calendar to Mês and opens the seeded class).
    - 32-month-view
    # 28 changes the seeded coach's password and puts it back within itself,
    # 29 registers and rejects its own coach, so its position is not load bearing.
    - 29-coach-rejection
    # 33 creates its own minor and guardian, so its position is not load bearing.
    # (29 is PAD-233's; 31-32 belong to the calendar work — numbers kept by the coordinator.)
    - 33-parental-consent
    # 34 (PAD-274) deletes only the placeholder and category it creates, so
    # its position is not load bearing.
    - 34-player-removal
    # PAD-314 / B-089: the regression guard for the Android dialog layer — a
    # dialog's cancel closes the dialog. Same screen and seeded player as 34,
    # so it sits here. It is NOT on the run-by-script exemption list on
    # purpose: a guard nobody runs proves nothing.
    - 49-dialog-cancel-closes
    # PAD-314 / B-089: the two RATE probes. They are loops, not assertions
    # about one run — 51 walks the post-verification transition ten times, 52
    # raises the class-form dialog twenty times, and each reports how often its
    # face of the defect appears. Listed here rather than exempted so they run
    # with everything else; a probe nobody runs measures nothing.
    - 51-verify-transition-rate
    - 52-dialog-overlay-rate
    # 35 (PAD-286) reads only: swipes the Mês day sheet up and down. (34 is PAD-274's.)
    - 35-day-sheet-polish
    # 40 flips the approval gate and restores it within itself (PAD-279/PAD-238), so its
    # position is not load bearing.
    - 40-admin-coach-approval-switch
    # 41 creates its own exercise (PAD-289), so its position is not load bearing.
    - 41-tactical-board-ball-paths
    # 59 (PAD-309) never saves its exercise, so its position is not load bearing.
    - 59-tactical-board-movement-legs
    # 60 (PAD-310) never saves its exercise, so its position is not load bearing.
    - 60-tactical-board-speed
    # PAD-300: the five flows below arrived with prefixes already taken (19, 22,
    # 23, 28, 29) and were renumbered 43–47 (coordinator, 2026-09-11); each one
    # creates and cleans up its own fixtures, so their positions are not load
    # bearing. 23-student-dashboard reads only. 42 is PAD-259's (batch 5).
    - 23-student-dashboard
    # 24–27 (PAD-212/213/214/215) were never listed; each creates its own
    # fixtures (27 needs the fresh seed's e2e-student-3), positions not load bearing.
    - 24-join-by-link
    - 25-claim-request
    - 26-message-by-username
    - 27-unknown-sender-block
    # 42 (PAD-282/PAD-288) books, accepts, cancels and deletes its own class, so
    # its position is not load bearing. Not yet run.
    - 42-cancel-requested-class
    - 43-tutorials-understand-invites
    - 44-signup
    - 45-club-join-request
    - 46-tactical-board
    # 47-push-tap-routing is deliberately NOT listed: it needs a simctl push
    # delivered by scripts/push-tap-flow.sh mid-flow (see README).
    # 48 books, cancels and removes its own class through the API (PAD-288), so its
    # position is not load bearing.
    - 48-early-cancellation
    # 50 books, cancels, comes back and removes its own class through the API
    # (PAD-315), so its position is not load bearing.
    - 50-come-back
    # 53 creates, marks and deletes its own one-off class (PAD-335); the delete
    # is the subject, so it leaves nothing behind and its position is not load
    # bearing.
    - 53-delete-after-attendance
    # 54 opens Settings and reads the build line (PAD-351); read-only.
    - 54-settings-build-info
    # 61 walks the PAD-356 two-card tab; it creates and removes its own block.
    - 61-availability-two-cards
    # 62 walks the student's class-request wizard, private path (PAD-357); it
    # withdraws the student's open requests before and after.
    - 62-class-request-wizard
    # 65 and 66 create their own academy class through the API and remove it in
    # onFlowComplete (PAD-358): 65 requests an open class, 66 joins and leaves a full
    # class's waiting list.
    - 65-academy-class-request
    - 66-academy-class-waitlist
    # 67 creates its own academy class and join request through the API (PAD-358).
    - 67-coach-sees-join-note
    # 69 sets and clears the coach's working hours (PAD-357); it resets them first.
    - 69-coach-working-hours
    # 85 saves an invalid working-hours day and stores nothing (PAD-357); it resets
    # the coach's hours first, and is ios-only (it drives the iOS hour wheel). 86
    # sends a weekly class request and withdraws it, with the same API cleanup as 62.
    # 87 saves the day "add window" makes (PAD-361) and clears the hours before and after.
    - 85-working-hours-invalid-day
    - 86-class-request-wizard-weekly
    - 87-working-hours-add-window
    # 92 turns the iOS minute wheel and saves (PAD-369): the stored time is on the
    # 15-minute grid. ios-only; it clears the coach's hours before and after.
    - 92-working-hours-minute-grid
    # 93 makes a weekly personal event through the API, deletes ONE occurrence in the
    # UI and reads the server's calendar (PAD-371); it removes its blocks before and after.
    - 93-event-single-occurrence-delete
    # 94 makes a weekly personal event through the API, switches repeat off in the UI
    # and reads the server's calendar (PAD-377); it removes its block before and after.
    - 94-event-made-one-off
    # 95 adds a category, types its name, switches the language pt and back, and
    # asserts the unsaved row survives (PAD-392); it writes only the coach's language
    # and restores it in onFlowComplete.
    - 95-settings-language-change-keeps-edits
    # 28-password-recovery stays LAST (PAD-300 pins it in
    # src/lib/maestro-flow-numbers.test.ts): a mid-flow failure cannot lock the
    # other flows out, and it ends signed out through the recovery link.
    - 28-password-recovery
