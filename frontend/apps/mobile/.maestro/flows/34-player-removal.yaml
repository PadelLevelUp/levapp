# Mirrors: apps/web/e2e/players/player-removal.spec.ts and
# apps/web/e2e/settings/evaluation-category-delete.spec.ts (PAD-274, B-057).
# - E2E Student has an account: the button says Disconnect, the confirmation
#   lists the coach's notes and evaluations and no attendance, and Cancel
#   leaves the student alone.
# - A placeholder this flow creates says Delete, lists its attendance too, and
#   is deleted.
# - A competency this flow adds in "Gerir competências" (PAD-373) asks for its typed
#   name before it is deleted; the confirm stays disabled until the name matches.
# Self-contained: it deletes only what it creates, so its position in the
# suite is not load bearing.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml

# ── 1. A student with an account: Disconnect, never Delete ──
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 15000
- tapOn:
    id: "players-search"
- inputText: "E2E Student"
- extendedWaitUntil:
    visible:
      id: "player-card-1"
    timeout: 20000
- tapOn:
    id: "player-card-1"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "player-remove"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "player-remove-mode-disconnect"
- tapOn:
    id: "player-remove"
- extendedWaitUntil:
    visible:
      text: "Your notes: .*"
    timeout: 15000
- assertNotVisible:
    text: "Attendance records: .*"
- tapOn:
    id: "player-remove-cancel"
# B-089 / PAD-323 — OBSERVED on the Android emulator: after this tap the dialog
# is still drawn, and a hardware back press is not consumed by it; back reaches
# the navigator and pops the whole screen, taking the "dialog" with it. A dialog
# that is open registers a back handler, so nothing live was there to consume
# the press. HYPOTHESIS, not yet established: what remains is a ghost — the
# dialog gone from the React tree, its Android views left behind.
#
# The order below is the test that settles it, and the branch taken shows in the
# run log. The screen's own back button is tapped FIRST: if the ghost's overlay
# does not swallow touches, that tap reaches the live screen underneath, the
# screen pops, and the dialog's text goes with it — which would make this the
# same defect as PAD-314 (Fabric leaving views behind) rather than a second one.
# Only if the dialog's text is still there afterwards does hardware back run, as
# the way out of a screen whose controls are covered.
#
# On iOS the cancel tap closes the dialog and only the first branch runs. Do not
# "simplify" this into a single tap until PAD-323 is fixed and its regression
# test is green.
- extendedWaitUntil:
    notVisible:
      text: "Your notes: .*"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "player-back"
    commands:
      - tapOn:
          id: "player-back"
- runFlow:
    when:
      visible:
        text: "Your notes: .*"
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      text: "Your notes: .*"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: "player-back"
    commands:
      - tapOn:
          id: "player-back"

# ── 2. A placeholder this flow creates: Delete ──
- extendedWaitUntil:
    visible:
      id: "players-add"
    timeout: 15000
- tapOn:
    id: "players-add"
- extendedWaitUntil:
    visible:
      id: "player-name"
    timeout: 15000
- tapOn:
    id: "player-name"
- inputText: "Maestro Removal Placeholder"
# Dismiss the keyboard before scrolling for the save button, as section 3 does
# (keyboard-occlusion trap, PAD-198). With it up, the swipe below and every
# scrollUntilVisible attempt left the form unscrolled on the Android lane, and
# player-save never entered the tree. Enter, not hideKeyboard, which is a back
# key on Android and pops the screen when no keyboard is up.
- pressKey: Enter
- swipe:
    start: "50%, 45%"
    end: "50%, 20%"
- scrollUntilVisible:
    element:
      id: "player-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "player-save"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 20000
- tapOn:
    id: "players-search"
- eraseText: 30
- inputText: "Maestro Removal"
- extendedWaitUntil:
    visible:
      text: ".*Maestro Removal Placeholder.*"
    timeout: 20000
- tapOn:
    text: ".*Maestro Removal Placeholder.*"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "player-remove"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "player-remove-mode-delete"
- tapOn:
    id: "player-remove"
- extendedWaitUntil:
    visible:
      text: "Attendance records: 0"
    timeout: 15000
- tapOn:
    id: "player-remove-confirm"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      text: ".*Maestro Removal Placeholder.*"
    timeout: 20000

# ── 3. A competency added in "Gerir competências" asks for its typed name (PAD-373) ──
# The manager replaced the Settings category editor: there is no Save — adding applies at
# once — and it is a pushed screen. The row's test id carries the server's id, so the flow
# asks the server for it rather than matching the row by rendered copy.
- runScript: ../scripts/competency-manager-setup.js
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-preferences"
- scrollUntilVisible:
    element:
      id: "settings-competencies-open"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-competencies-open"
- extendedWaitUntil:
    visible:
      id: "competency-manager"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "competency-add-name"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: "competency-add-name"
- inputText: "Maestro Cat"
# Enter submits the field (onSubmitEditing) and dismisses the keyboard in one step; the
# Add button is not tapped, because with the keyboard up the tap would land on it (PAD-198).
- pressKey: Enter
- runScript:
    file: ../scripts/competency-id-by-name.js
    env:
      NAME: "Maestro Cat"
- scrollUntilVisible:
    element:
      id: "competency-delete-id-${output.competencyId}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: "competency-delete-id-${output.competencyId}"
- extendedWaitUntil:
    visible:
      id: "competency-delete-impact"
    timeout: 15000
- assertVisible:
    id: "competency-delete-confirm"
    enabled: false
- tapOn:
    id: "competency-delete-name"
- inputText: "Maestro"
- assertVisible:
    id: "competency-delete-confirm"
    enabled: false
- inputText: " Cat"
# hideKeyboard fails on iOS here ("Couldn't hide the keyboard"); Enter blurs the
# single-line input and dismisses it instead.
- pressKey: Enter
- assertVisible:
    id: "competency-delete-confirm"
    enabled: true
- tapOn:
    id: "competency-delete-confirm"
- extendedWaitUntil:
    notVisible:
      id: "competency-row-id-${output.competencyId}"
    timeout: 15000
# The server agrees: nothing of this flow's is left.
- evalScript: "${output.left = json(http.get(output.api + '/api/app/evaluation_competencies', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).competencies.filter(function (c) { return c.name === 'Maestro Cat' }).length}"
- assertTrue: "${output.left == 0}"
