# Mirrors: apps/web/e2e/messaging/message-by-username.spec.ts (PAD-214,
# messaging.direct-by-username)
# - student opens Messages → New conversation
# - the connected-people search is on top, the "Message by username" field below it (every role, PAD-225)
# - an unknown username shows the inline error
# - e2e-student-2's username opens a conversation; a message is sent
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-student.yaml
- tapOn:
    id: "tab-messages"
- tapOn:
    id: "messages-new"
- extendedWaitUntil:
    visible:
      id: "new-conversation-search"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "message-by-username"
    direction: DOWN

# ── Unknown username → inline error ──
- tapOn:
    id: "message-by-username-input"
- inputText: "no-such-user-214"
- tapOn:
    id: "message-by-username-submit"
- extendedWaitUntil:
    visible:
      id: "message-by-username-error"
    timeout: 15000

# ── Real username → conversation opens ──
- tapOn:
    id: "message-by-username-input"
- eraseText
- inputText: "e2e-student-2"
- tapOn:
    id: "message-by-username-submit"
- extendedWaitUntil:
    visible:
      id: "message-input"
    timeout: 20000
- tapOn:
    id: "message-input"
- inputText: "Maestro username message"
- tapOn:
    id: "message-send"
- extendedWaitUntil:
    visible:
      text: "Maestro username message"
    timeout: 15000
