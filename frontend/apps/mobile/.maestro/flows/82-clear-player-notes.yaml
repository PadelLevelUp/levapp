# PAD-388 / players.edit rule 4 (B-136 step 3) — a coach can DELETE a note about a
# player on iOS, not only overwrite it. The screen used to drop an emptied box from
# the body, so the server never saw a clear; it now sends null. (Flow number 82 is
# reserved to Session-C by the Coordinator, 2026-09-21.)
# Mirrors apps/web/e2e/player-management/clear-player-notes.spec.ts.
# By test id and by the server's own answers — never rendered copy. E2E Student is
# SEEDED with the note "E2E test player" (07-player-notes reads it): the flow REPLACES
# it, then empties the box, and onFlowComplete puts the seeded note back through the
# API whether the flow passed or failed (R-040), so a red run does not change the seed.
appId: com.padellevelup.app
onFlowComplete:
  - runScript: ../scripts/restore-e2e-student-note.js
---
- runScript: ../scripts/coach-token.js

- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 15000
- tapOn:
    id: "players-search"
- inputText: "E2E Student"
- extendedWaitUntil:
    visible:
      id: "player-card-1"
    timeout: 20000
- tapOn:
    id: "player-card-1"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000

# ── 1. Write a note through the edit card ──
- scrollUntilVisible:
    element:
      id: "player-info-edit"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "player-info-edit"
- scrollUntilVisible:
    element:
      id: "player-notes"
    direction: DOWN
    timeout: 30000
# PAD-710 (Android lane): a tap in the middle of the box puts the cursor mid-text, and eraseText
# only deletes what is before it: step 2 left "\ned" and the server saved "ed" (run 43947141933).
# On Android, tap the box's bottom-right corner, which puts the cursor after the last character.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "player-notes"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "player-notes"
          point: "95%, 85%"
# The box holds the SEEDED note: erase it first, or inputText appends (Session-D, first run).
- eraseText: 60
- inputText: "Maestro note to be deleted"
# Enter blurs the field and closes the keyboard (hideKeyboard fails on iOS here).
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "player-info-save"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: "player-info-save"
- extendedWaitUntil:
    notVisible:
      id: "player-info-save"
    timeout: 15000
- evalScript: "${output.noteAfterWrite = json(http.get(output.api + '/api/app/coach_players', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).filter(function (p) { return p.name === 'E2E Student' })[0].notes}"
- assertTrue: "${output.noteAfterWrite == 'Maestro note to be deleted'}"

# ── 2. Empty the box and save: the server holds NO note ──
- scrollUntilVisible:
    element:
      id: "player-info-edit"
    direction: UP
    timeout: 30000
- tapOn:
    id: "player-info-edit"
- scrollUntilVisible:
    element:
      id: "player-notes"
    direction: DOWN
    timeout: 30000
# PAD-710 (Android lane): a tap in the middle of the box puts the cursor mid-text, and eraseText
# only deletes what is before it: step 2 left "\ned" and the server saved "ed" (run 43947141933).
# On Android, tap the box's bottom-right corner, which puts the cursor after the last character.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "player-notes"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "player-notes"
          point: "95%, 85%"
- eraseText: 60
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "player-info-save"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: "player-info-save"
- extendedWaitUntil:
    notVisible:
      id: "player-info-save"
    timeout: 15000
- evalScript: "${output.noteAfterClear = json(http.get(output.api + '/api/app/coach_players', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).filter(function (p) { return p.name === 'E2E Student' })[0].notes}"
- assertTrue: "${output.noteAfterClear === null}"
