# PAD-289 — training.tactical-board rules 9, 23, 24: the Bola tool appends
# paths; two paths are numbered on the court; the list under the step strip
# reorders and removes them; undo brings a removed path back; the first path
# keeps the un-suffixed ids the wave-1 flow (28) relies on.
#
# Uses Exercícios de cesto so every tap lands on an element id (Maestro cannot
# aim a tap inside an element): each feed starts at the feeder, so tapping A1
# and then A2 gives two numbered paths (rule 23). The web mirror (US-70) draws
# the same thing in Situações de jogo with percent taps.
#
# Mirrors: apps/web/e2e/exercise-management/tactical-board.spec.ts (US-70)
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-training"
- extendedWaitUntil:
    visible:
      id: "screen-training"
    timeout: 15000
- tapOn:
    id: "exercise-add"
- extendedWaitUntil:
    visible:
      id: "exercise-name"
    timeout: 15000
- tapOn:
    id: "exercise-name"
- inputText: "Maestro Two Paths"
# iOS trap: a swipe that starts under the keyboard hits the keyboard. Enter blurs the
# single-line Input and dismisses it (hideKeyboard fails on this app, flow 34).
- pressKey: Enter
- swipe:
    start: "50%, 45%"
    end: "50%, 20%"
- scrollUntilVisible:
    element:
      id: "exercise-diagram-toggle"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "exercise-diagram-toggle"
- extendedWaitUntil:
    visible:
      id: "tactical-board"
    timeout: 15000
# A fresh board switches to basket mode without a prompt (rule 3).
# PAD-710 (Android lane): the board's toolbar and its court do not fit on the phone together and Android exposes only on-screen elements; scrollUntilVisible swipes from the centre (the court) and the court eats the gesture, so the Android steps scroll by swiping the page margin (subflows/board-show-*.yaml).
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-toolbar.yaml
    env:
      TARGET: "board-tab-basket"
- tapOn:
    id: "board-tab-basket"
# After the tab switch the court sits below the fold on a phone (F's run, 2026-09-11).
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "piece-feeder"
- scrollUntilVisible:
    element:
      id: "piece-feeder"
    direction: DOWN
    timeout: 15000
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "piece-feeder"
- assertVisible:
    id: "piece-feeder"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-toolbar.yaml
    env:
      TARGET: "board-tool-ball"
- tapOn:
    id: "board-tool-ball"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-toolbar.yaml
    env:
      TARGET: "board-hint-ball"
- assertVisible:
    id: "board-hint-ball"

# ── First feed: feeder → A1 ──
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "piece-a1"
- tapOn:
    id: "piece-a1"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "ball-path-flat"
- assertVisible:
    id: "ball-path-flat"
- assertNotVisible:
    id: "ball-number-0"

# ── Second feed is appended: feeder → A2; both are numbered ──
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "piece-a2"
- tapOn:
    id: "piece-a2"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "ball-path-1-flat"
- assertVisible:
    id: "ball-path-1-flat"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "ball-number-0"
- assertVisible:
    id: "ball-number-0"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "ball-number-1"
- assertVisible:
    id: "ball-number-1"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-toolbar.yaml
    env:
      TARGET: "board-ball-1"
- assertVisible:
    id: "board-ball-1"

# ── Toggle only the second path, then move it up ──
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "ball-style-handle-1"
- tapOn:
    id: "ball-style-handle-1"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "ball-path-1-lob"
- assertVisible:
    id: "ball-path-1-lob"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "ball-path-flat"
- assertVisible:
    id: "ball-path-flat"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-toolbar.yaml
    env:
      TARGET: "board-ball-1-up"
- tapOn:
    id: "board-ball-1-up"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "ball-path-lob"
- assertVisible:
    id: "ball-path-lob"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "ball-path-1-flat"
- assertVisible:
    id: "ball-path-1-flat"

# ── Remove path 2; undo brings it back ──
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-toolbar.yaml
    env:
      TARGET: "board-ball-1-remove"
- tapOn:
    id: "board-ball-1-remove"
- assertNotVisible:
    id: "ball-path-1-flat"
- assertNotVisible:
    id: "ball-number-0"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-toolbar.yaml
    env:
      TARGET: "board-undo"
- tapOn:
    id: "board-undo"
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "ball-path-1-flat"
- assertVisible:
    id: "ball-path-1-flat"

# ── Save; the card's thumbnail shows the second path too (rule 13) ──
- runFlow:
    when:
      platform: Android
    file: ../subflows/board-show-court.yaml
    env:
      TARGET: "exercise-save"
- scrollUntilVisible:
    element:
      id: "exercise-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "exercise-save"
- extendedWaitUntil:
    visible:
      id: "exercise-add"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: ".*Maestro Two Paths.*"
    timeout: 15000
- assertVisible:
    id: "thumb-ball-path-1-flat"
