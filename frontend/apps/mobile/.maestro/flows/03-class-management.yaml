# Mirrors: apps/web/e2e/schedule-calendar/class-management.spec.ts
# - the seeded Monday class is visible on the calendar
# - create "Maestro Test Class" on the seeded Monday (default type/times) and
#   it appears in the day list
# ORDER DEPENDENCY: flow 05-class-deletion deletes the class created here.
appId: com.levelup.mobile
---
- runFlow: ../subflows/login-coach.yaml
# Navigates to the seeded Monday and asserts "E2E Academy Class" is there.
- runFlow: ../subflows/goto-seeded-monday.yaml

# ── Create a new class on the selected (seeded) Monday ──
- tapOn:
    id: "calendar-add-class"
- extendedWaitUntil:
    visible:
      id: "class-name"
    timeout: 15000
# Date is pre-populated with the selected day; type/times/max keep defaults.
- tapOn:
    id: "class-name"
- inputText: "Maestro Test Class"
# Dismiss the keyboard (keyboardDismissMode="on-drag") so it can't cover the
# save button — Maestro taps element coordinates even when the keyboard
# overlaps them.
- swipe:
    start: "50%, 45%"
    end: "50%, 20%"
- scrollUntilVisible:
    element:
      id: "class-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "class-save"

# ── Back on the calendar the new class appears in the Monday list ──
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Maestro Test Class"
    timeout: 20000
- assertVisible: "E2E Academy Class"
