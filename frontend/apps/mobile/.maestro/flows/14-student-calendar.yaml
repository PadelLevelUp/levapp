# Mobile-specific student journey (closest web specs:
# schedule-calendar/daily-schedule.spec.ts student view +
# schedule-calendar/class-detail-privacy.spec.ts)
# - student sees the seeded class on their calendar
# - opens the detail and sees their own attendance status badge
# NOTE (PAD-313): the badge is ONE state word. After flow 04 the coach recorded
# this student present — and saving attendance sets `validated`, so the state is
# the coach's record — giving "Attended" in suite order; on a freshly seeded DB,
# run standalone, the unanswered presence reads "Signed up". The assertion
# accepts either so the flow stays order-independent — and "You're going" too,
# because a student who answered a reminder in an earlier flow legitimately
# stays at intent: nothing here may assert that a class shows only a record
# (H's caution, 2026-09-12).
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-student.yaml
- runFlow: ../subflows/goto-seeded-monday.yaml

# ── Open the seeded class detail ──
- tapOn: "E2E Academy Class"
- extendedWaitUntil:
    visible:
      id: "class-detail"
    timeout: 20000

# ── Student sees their own attendance status ──
- scrollUntilVisible:
    element:
      text: "Your attendance"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "attendance-state"
- assertVisible: "Attended|Signed up|You're going"
# Students never get coach controls.
- assertNotVisible:
    id: "attendance-confirm"
- assertNotVisible:
    id: "class-delete"
