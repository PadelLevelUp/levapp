# PAD-433 / notifications.config rule 14, 14a — the restrictions on iOS. A coach opens
# Settings → Notifications → Restrictions, sees the saved values and the excluded
# student BY NAME (B-168), presses + on "max simultaneous" once, presses the footer Save (`settings-notifications-save`), leaves Settings and
# comes back: the new value is read back from the server, on screen and through the API.
#
# Setup (scripts/restrictions-setup.js) turns the engine on, sets maxSimultaneous to 3 and
# excludes one of the coach's students; teardown restores the coach's own config (R-040).
# Assertions are by testID and server values only, never rendered copy (the account
# language). Backend: -e API_BASE=http://localhost:<port>, else :5001. Flow number 105
# was reserved for PAD-433 by the coordinator.
appId: com.padellevelup.app
onFlowStart:
  - runScript: ../scripts/restrictions-setup.js
onFlowComplete:
  - runScript: ../scripts/restrictions-teardown.js
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-notifications"
- extendedWaitUntil:
    visible:
      id: "settings-restrictions-header"
    timeout: 15000
- tapOn:
    id: "settings-restrictions-header"

# ── The saved state, as the server holds it ──
- scrollUntilVisible:
    element:
      id: "restriction-maxSimultaneous-inc"
    direction: DOWN
- assertVisible:
    id: "restriction-maxSimultaneous-value"
    text: "3"
- scrollUntilVisible:
    element:
      id: "restriction-excluded-chip-${output.pid}"
    direction: DOWN
- assertVisible:
    id: "restriction-excluded-chip-${output.pid}"
    text: "${output.pname}"

# ── One press of + ──
# PAD-710 (Android lane): on Android the plain UP scroll stops at a 10 px sliver under the header
# (nightly 10 Nov, run 42802792484) or never counts + as fully visible (run 43517077504), so it is
# iOS-only; Android brings the value row down from under the header instead. A centred
# scrollUntilVisible swipes from mid-screen, where the excluded-players search box sits, and in
# #990's shard 3 (run 43957066246) 16 s of it never moved the page; swipe on the page's left margin.
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: "restriction-maxSimultaneous-inc"
          direction: UP
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 6
          while:
            notVisible:
              id: "restriction-maxSimultaneous-value"
          commands:
            # Finger down on the left margin: the page scrolls up.
            - swipe:
                start: "4%, 40%"
                end: "4%, 60%"
                duration: 600
      # One more short pull, so the row is not left as a sliver under the header.
      - swipe:
          start: "4%, 40%"
          end: "4%, 50%"
          duration: 600
      - waitForAnimationToEnd
- tapOn:
    id: "restriction-maxSimultaneous-inc"
- assertVisible:
    id: "restriction-maxSimultaneous-value"
    text: "4"

# ── PAD-506 (settings.explicit-save): the + is held; the footer Save sends it ──
- scrollUntilVisible:
    element:
      id: "settings-notifications-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-notifications-save"
- extendedWaitUntil:
    visible:
      id: "b506-never-present"
    timeout: 2000
    optional: true

# ── Leave Settings and come back ──
- scrollUntilVisible:
    element:
      id: "settings-back"
    direction: UP
- tapOn:
    id: "settings-back"
- extendedWaitUntil:
    visible:
      id: "settings-nav-notifications"
    timeout: 10000
- tapOn:
    id: "settings-nav-notifications"
- extendedWaitUntil:
    visible:
      id: "settings-restrictions-header"
    timeout: 15000
- tapOn:
    id: "settings-restrictions-header"
- scrollUntilVisible:
    element:
      id: "restriction-maxSimultaneous-value"
    direction: DOWN
# PAD-710 (Android lane): same sliver trap on the read-back (run 42802792484); centre the value.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: "restriction-maxSimultaneous-value"
          direction: DOWN
          timeout: 15000
          centerElement: true
- assertVisible:
    id: "restriction-maxSimultaneous-value"
    text: "4"

# ── And the server holds it ──
- evalScript: "${output.after = json(http.get(output.api + '/api/app/notify/config', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).restrictions.maxSimultaneous.value}"
- assertTrue: "${output.after == 4}"
