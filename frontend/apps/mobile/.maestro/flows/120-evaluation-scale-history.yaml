# confirmed — Session-E, iPhone 17 Pro simulator, feature/pad-423-clients @ e18275ec7 + this flow, 2026-09-25 23:23:36Z: 0 failed; red with a backend that labels every rating with its competency's current scale
# PAD-423 / evaluations.scale rules 3 and 6 on iOS: each score keeps the scale it was given on.
# Competency A is rated 4 while the coach is on 1-5; the coach moves to 1-10; competency B
# (created after the move, so on 1-10) is rated 7 in the same record. The history card then
# shows A as four stars (its 4/5) beside B as the number 7/10: a scale change rewrote nothing.
# Seeded through the API (the web E2E and flow 119 drive the UI side); this flow proves the
# card draws each rating from its own scale.
#
# By test id and by the server's own answers, never rendered copy. onFlowComplete removes the
# record and both competencies and puts the coach back on 1-5 (R-040), pass or fail.
appId: com.padellevelup.app
onFlowComplete:
  - runScript: ../scripts/evaluation-scale-teardown.js
---
- runScript: ../scripts/evaluation-scale-setup.js
# A (on 1-5) rated 4.
- evalScript: "${output.putA = http.put(output.api + '/api/app/evaluation_record', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ playerId: Number(output.evalPlayerId), ratings: { [output.competencyId]: 4 } }) }).ok}"
- assertTrue: "${output.putA == true}"
# The coach moves to 1-10; B is created on it and rated 7 in the same (today's) record.
- evalScript: "${output.toTen = http.put(output.api + '/api/app/evaluation_scale', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ scaleMax: 10 }) }).ok}"
- assertTrue: "${output.toTen == true}"
- evalScript: "${output.competencyBId = String(json(http.post(output.api + '/api/app/evaluation_competency', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ name: 'Maestro Scale B ' + Date.now() }) }).body).id)}"
- evalScript: "${output.putB = http.put(output.api + '/api/app/evaluation_record', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ playerId: Number(output.evalPlayerId), ratings: { [output.competencyBId]: 7 } }) }).ok}"
- assertTrue: "${output.putB == true}"
# The server's own answer: A still 4 on 1-5, B 7 on 1-10, in one record.
- evalScript: "${output.ratings = json(http.get(output.api + '/api/app/player/' + output.evalPlayerId + '/evaluations', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).records[0].ratings}"
- assertTrue: "${output.ratings.filter(function (r) { return String(r.categoryId) === output.competencyId && r.score === 4 && r.scaleMax === 5; }).length === 1}"
- assertTrue: "${output.ratings.filter(function (r) { return String(r.categoryId) === output.competencyBId && r.score === 7 && r.scaleMax === 10; }).length === 1}"

- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 15000
- tapOn:
    id: "players-search"
- eraseText: 40
- inputText: "E2E Student"
- extendedWaitUntil:
    visible:
      id: "player-card-1"
    timeout: 20000
- tapOn:
    id: "player-card-1"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "player-evaluations-open"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "player-evaluations-open"
- extendedWaitUntil:
    visible:
      id: "player-evaluations"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "evaluation-history-card-.*"
    direction: DOWN
    timeout: 20000

# A: stars with its 4 (its own 1-5), never a number. B: the number 7 on 1-10, never stars.
- assertVisible:
    id: "evaluation-stars-${output.competencyId}-4"
- assertNotVisible:
    id: "evaluation-stepper-${output.competencyId}-value-4"
- assertVisible:
    id: "evaluation-stepper-${output.competencyBId}-value-7"
- assertNotVisible:
    id: "evaluation-stars-${output.competencyBId}-7"
