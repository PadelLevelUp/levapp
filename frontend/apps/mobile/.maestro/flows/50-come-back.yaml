# PAD-315 — attendance.confirm rule 26: a student who said they are not coming
# can say they can come after all, and gets their spot back while it is free.
#
# Why this flow exists when the logic already has unit tests: the affordance is
# a BUTTON a student has to find and press on a phone. Unit tests cannot tell us
# it is reachable — that it renders on the right state, in the right place, and
# that pressing it changes what the screen offers.
#
# The refusal (`spot_filled`) is deliberately NOT here: forcing it means filling
# the class from another account between two taps, which is a race to win rather
# than an assertion. It is pinned by unit tests in @levelup/config.
#
# Setup and teardown through the API exactly like 42-cancel-requested-class
# (the request form is flow 13's subject): book the first free block eight to
# fourteen days out, accept as the coach, cancel in the student UI, remove.
# Order: not load bearing. Backend: -e API_BASE=http://localhost:<port>, else :5001.
#
# Mirrors: apps/web/e2e/attendance/pad315-come-back.spec.ts
appId: com.padellevelup.app
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.fmt = function (d) { var m = d.getMonth() + 1, day = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' + m : '' + m) + '-' + (day < 10 ? '0' + day : '' + day); }}"
- evalScript: "${output.from = output.fmt(new Date(Date.now() + 8 * 86400000))}"
- evalScript: "${output.to = output.fmt(new Date(Date.now() + 14 * 86400000))}"
- evalScript: "${output.student = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-student', password: 'E2eStudent123!' }) }).body).accessToken}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.coachId = String(json(http.get(output.api + '/api/app/class-requests/coaches', { headers: { 'Authorization': 'Bearer ' + output.student } }).body)[0].id)}"
- evalScript: "${output.slot = json(http.get(output.api + '/api/app/class-requests/free-blocks?coachId=' + output.coachId + '&from=' + output.from + '&to=' + output.to, { headers: { 'Authorization': 'Bearer ' + output.student } }).body)[0]}"
- evalScript: "${output.day = output.slot.date}"
- evalScript: "${output.endTime = (function (t) { var h = parseInt(t.split(':')[0], 10) + 1; return (h < 10 ? '0' + h : '' + h) + ':' + t.split(':')[1]; })(output.slot.startTime)}"
- evalScript: "${output.requestId = json(http.post(output.api + '/api/app/class-requests', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.student }, body: JSON.stringify({ coachId: output.coachId, date: output.day, startTime: output.slot.startTime, endTime: output.endTime }) }).body).id}"
- evalScript: "${output.accepted = http.post(output.api + '/api/app/class-requests/' + output.requestId + '/accept', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: '{}' }).ok}"
- assertTrue: "${output.accepted == true}"

# ── Student opens the class and says they are not coming ──
- runFlow: ../subflows/login-student.yaml
- tapOn:
    id: "tab-calendar"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 15000
# The calendar remembers its MODE and its WEEK between runs, and that state lives
# in the app rather than the database — F saw it survive a fresh seed twice. In
# Dia mode `calendar-next-week` moves the SELECTED DAY by a week, so four blind
# taps land on one weekday that is not the class's ("0 classes" on a Monday while
# the class sits on another weekday inside the skipped weeks).
#
# So: reset the week in Semana (where `calendar-today` lives), switch to Dia,
# then walk forward with a GUARDED repeat that stops as soon as the class's own
# day cell is on the strip. Testids verified on staging: ViewModeControl emits
# `calendar-view-{day,week,month}` and all three modes are enabled; WeekNav emits
# `calendar-today`; DayStrip emits `calendar-day-{yyyy-MM-dd}`.
- tapOn:
    id: "calendar-view-week"
- extendedWaitUntil:
    visible:
      id: "calendar-today"
    timeout: 10000
- tapOn:
    id: "calendar-today"
- waitForAnimationToEnd
- tapOn:
    id: "calendar-view-day"
- extendedWaitUntil:
    visible:
      id: "calendar-next-week"
    timeout: 10000
# The class is booked 8-14 days out, so at most three weeks forward from today.
- repeat:
    times: 3
    while:
      notVisible:
        id: "calendar-day-${output.day}"
    commands:
      - tapOn:
          id: "calendar-next-week"
      - waitForAnimationToEnd
- tapOn:
    id: "calendar-day-${output.day}"
- extendedWaitUntil:
    visible:
      text: "E2E Student"
    timeout: 15000
- tapOn: "E2E Student"
- extendedWaitUntil:
    visible:
      id: "class-detail"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "class-cancel-attendance"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "class-cancel-attendance"
- extendedWaitUntil:
    visible:
      id: "class-cancel-attendance-confirm"
    timeout: 10000
- tapOn:
    id: "class-cancel-attendance-confirm"
# PAD-313 rule 25: the student's own state is ONE word on their own row; the
# "not attending / justified absence" panel and its timestamp line are gone (the
# time now sits on the coach's row, where we know who cancelled).
- extendedWaitUntil:
    visible:
      id: "attendance-state"
    timeout: 20000
# Ids, never rendered text: the seeded users are English (seed.py, PAD-40) and
# the language switch is async, so a wrong-language assertion PASSES whenever it
# runs before the switch lands — a flake, which is worse than a red. What the
# state actually became is pinned through the API at the end
# (`attendanceState === 'coming'`), which no rendering can flatter.

# ── Rule 26: the way back is offered on that state ──
- extendedWaitUntil:
    visible:
      id: "class-come-back"
    timeout: 15000
- tapOn:
    id: "class-come-back"

# The proof that the server re-seated them, without asserting rendered text: the
# way back is gone and the decline action is back, which only happens when the
# state left `not_coming` (rule 25 offers exactly one of the two at a time).
- extendedWaitUntil:
    visible:
      id: "class-cancel-attendance"
    timeout: 20000
- assertNotVisible:
    id: "class-come-back"

# ── The server agrees, then clean up ──
# Class detail is a root-stack screen: leave it before logout.yaml looks for
# `header-account` (the trap flow 42 and flow 48 both hit).
- tapOn:
    id: "class-detail-back"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 15000
- runFlow: ../subflows/logout.yaml
- evalScript: "${output.events = json(http.get(output.api + '/api/app/calendar?from=' + output.day + 'T00:00:00&to=' + output.day + 'T23:59:59', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body)}"
- evalScript: "${output.instance = output.events.filter(function (e) { return e.type === 'class' && e.title === 'E2E Student'; })[0]}"
- evalScript: "${output.presences = json(http.get(output.api + '/api/app/lesson_instance/' + output.instance.originalId + '/presences', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body)}"
- assertTrue: "${output.presences.length === 1 && output.presences[0].attendanceState === 'coming' && output.presences[0].cancelledByStudent === false}"
- evalScript: "${output.removed = (function (evs) { var n = 0; for (var i = 0; i < evs.length; i++) { var e = evs[i]; if (e.type === 'class' && e.title === 'E2E Student') { http.post(output.api + '/api/app/remove_class', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ event: e, scope: 'single' }) }); n++; } } return n; })(output.events)}"
- assertTrue: "${output.removed >= 1}"
