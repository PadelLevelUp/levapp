# Mirrors: apps/web/e2e/availability/student-blockers.spec.ts
# - student adds a one-time blocker → card appears
# - deletes it with confirmation → gone
# Notes:
# - No title is typed: iOS autocorrect mangles free text ("blocker" →
#   "block…") and an extra focused field invites keyboard-tap collisions.
#   The card then shows the default "Unavailable" title and the time range.
# - Phase 7 (mobile-web-parity plan): date/start-time/end-time now use the
#   native DatePickerInput/TimePickerInput pickers instead of free-text
#   fields. Driving an iOS UIDatePicker spinner to a SPECIFIC value via
#   Maestro (swiping a wheel a precise number of rows) is fragile —
#   row-height/offset varies by device and OS version and isn't something
#   Maestro exposes a stable API for. Per the plan's documented fallback,
#   this flow instead confirms each picker's own default (tap field → tap
#   the ${testID}-confirm button) and asserts against THAT value rather than
#   the previous hardcoded "tomorrow 10:00–11:00": today (date picker's
#   default when the field is blank) and 18:00–20:00 (BlockerForm's
#   hardcoded initial startTime/endTime state for a new blocker). Verified
#   the backend blocker list has no date/time filtering
#   (list_student_blockers returns everything for the user, unfiltered), so
#   "today" is safe regardless of what time of day this suite runs at.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-student.yaml
- tapOn:
    id: "tab-availability"
- extendedWaitUntil:
    visible:
      id: "availability-add"
    timeout: 15000

# ── Create a one-time blocker on today's date, default 18:00–20:00 ──
- tapOn:
    id: "availability-add"
- extendedWaitUntil:
    visible:
      id: "blocker-title"
    timeout: 15000
- runScript: ../scripts/seeded-monday.js

# Date — tap the field to open the iOS spinner dialog, confirm its default
# (today, since the field starts blank), assert the pressable now shows it.
- scrollUntilVisible:
    element:
      id: "blocker-date"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "blocker-date"
# Android opens its own dialog (DateTimePickerAndroid) with an OK button; iOS shows
# the app's spinner modal with the -confirm button (PAD-304).
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "OK"
          timeout: 10000
      - tapOn: "OK"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "blocker-date-confirm"
          timeout: 10000
      - tapOn:
          id: "blocker-date-confirm"
- assertVisible:
    id: "blocker-date"
    text: ${output.today}

# Start time — confirm the picker's own default (18:00, BlockerForm's
# initial state for a new blocker).
- scrollUntilVisible:
    element:
      id: "blocker-start-time"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "blocker-start-time"
# Android opens its own dialog (DateTimePickerAndroid) with an OK button; iOS shows
# the app's spinner modal with the -confirm button (PAD-304).
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "OK"
          timeout: 10000
      - tapOn: "OK"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "blocker-start-time-confirm"
          timeout: 10000
      - tapOn:
          id: "blocker-start-time-confirm"
- assertVisible:
    id: "blocker-start-time"
    text: "18:00"

# End time — same, default 20:00.
- scrollUntilVisible:
    element:
      id: "blocker-end-time"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "blocker-end-time"
# Android opens its own dialog (DateTimePickerAndroid) with an OK button; iOS shows
# the app's spinner modal with the -confirm button (PAD-304).
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "OK"
          timeout: 10000
      - tapOn: "OK"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "blocker-end-time-confirm"
          timeout: 10000
      - tapOn:
          id: "blocker-end-time-confirm"
- assertVisible:
    id: "blocker-end-time"
    text: "20:00"

# Save
- scrollUntilVisible:
    element:
      id: "blocker-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "blocker-save"

# The card shows the default title and the chosen time range.
- extendedWaitUntil:
    visible:
      text: ".*18:00.*20:00.*"
    timeout: 20000

# ── Delete it with confirmation ──
- tapOn: "Delete blocker"
- extendedWaitUntil:
    visible:
      id: "blocker-delete-confirm"
    timeout: 10000
- tapOn:
    id: "blocker-delete-confirm"
- extendedWaitUntil:
    visible:
      text: "No blockers yet"
    timeout: 15000
