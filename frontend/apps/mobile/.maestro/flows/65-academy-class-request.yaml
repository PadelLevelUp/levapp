# PAD-358 — classes.academy-class-booking rules 5, 7, 10: from the "Marcar aula"
# wizard's academy step, a student asks to join an OPEN academy class with a note,
# and the row then shows the "requested" status instead of the action.
#
# Mirrors: apps/web/e2e/class-requests/pad358-academy-class-booking.spec.ts (first
# test, open half). Flow 66 covers the full class and its waiting list; flow 67 the
# coach reading the note.
#
# Setup and teardown through the API (R-040), per Session C's fixture contract:
# - as e2e-coach: remember openSpotsVisible, turn it on, add "E2E Wizard Open Class"
#   (academy, two days out, 18:00-19:00, 4 spots, no players);
# - onFlowComplete (runs on failure too; the class is removed in two passes): delete the join request
#   (editor model classjoinrequest, NOT classrequest), remove the class, restore
#   openSpotsVisible.
#
# The row is found by the class title, which is fixture data this flow created, not
# app copy; state is read from the id (academy-class-row-open,
# academy-class-status-requested). The seeded student has one coach, so the wizard
# opens on the kind step.
# Flow number 65 is from Session C's range for PAD-358.
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.jr = output.jr || null}"
  - evalScript: "${output.jrDeleted = output.jr ? http.delete(output.api + '/api/editor/classjoinrequest/' + output.jr, { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).ok : true}"
  - evalScript: "${output.events = json(http.get(output.api + '/api/app/calendar?from=' + output.day + 'T00:00:00&to=' + output.day + 'T23:59:59', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body)}"
  - evalScript: "${output.removed = (function (evs) { var n = 0; for (var i = 0; i < evs.length; i++) { var e = evs[i]; if (e.type === 'class' && e.title === output.title) { http.post(output.api + '/api/app/remove_class', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ event: e, scope: 'single' }) }); n++; } } return n; })(output.events)}"
  # Second pass: removing a materialised instance leaves its Lesson re-projecting.
  - evalScript: "${output.events2 = json(http.get(output.api + '/api/app/calendar?from=' + output.day + 'T00:00:00&to=' + output.day + 'T23:59:59', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body)}"
  - evalScript: "${output.removed2 = (function (evs) { var n = 0; for (var i = 0; i < evs.length; i++) { var e = evs[i]; if (e.type === 'class' && e.title === output.title) { http.post(output.api + '/api/app/remove_class', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ event: e, scope: 'single' }) }); n++; } } return n; })(output.events2)}"
  - evalScript: "${output.restored = http.post(output.api + '/api/app/notify/config', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ openSpotsVisible: output.wasVisible }) }).ok}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.fmt = function (d) { var m = d.getMonth() + 1, day = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' + m : '' + m) + '-' + (day < 10 ? '0' + day : '' + day); }}"
- evalScript: "${output.student = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-student', password: 'E2eStudent123!' }) }).body).accessToken}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.wasVisible = json(http.get(output.api + '/api/app/notify/config', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).openSpotsVisible === true}"
- evalScript: "${output.toggled = http.post(output.api + '/api/app/notify/config', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ openSpotsVisible: true }) }).ok}"
- assertTrue: "${output.toggled == true}"
- evalScript: "${output.day = output.fmt(new Date(Date.now() + 2 * 86400000))}"
- evalScript: "${output.title = 'E2E Wizard Open Class'}"
- evalScript: "${output.added = http.post(output.api + '/api/app/add_class', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ name: output.title, classType: 'academy', date: output.day, startTime: '18:00', endTime: '19:00', maxPlayers: 4, playerIds: [], isRecurring: false, notificationsEnabled: false }) }).ok}"
- assertTrue: "${output.added == true}"

# ── The wizard's academy step ──
- runFlow: ../subflows/login-student.yaml
- tapOn:
    id: "tab-availability"
- scrollUntilVisible:
    element:
      id: "class-request-book"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "class-request-book"
- extendedWaitUntil:
    visible:
      id: "class-request-wizard-kind"
    timeout: 15000
- tapOn:
    id: "wizard-kind-academy"
- extendedWaitUntil:
    visible:
      id: "academy-class-list"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "${output.title}"
    direction: DOWN
    timeout: 30000
# iOS exposes the row's children beside it, not inside it, so a row is matched
# by the element nearest below the class title.
- assertVisible:
    id: "academy-class-row-open"

# ── Request with a note ──
- tapOn:
    id: "academy-class-request"
    below:
      text: "${output.title}"
- extendedWaitUntil:
    visible:
      id: "academy-class-note"
    timeout: 10000
- tapOn:
    id: "academy-class-note"
- inputText: "Maestro 65"
# Close the keyboard first: it covers Send, and a tap there types into the note.
# Tapping the class title (plain text) blurs the field.
- tapOn:
    text: "${output.title}"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "academy-class-send"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "academy-class-send"
- scrollUntilVisible:
    element:
      id: "academy-class-status-requested"
    direction: DOWN
    timeout: 30000

# ── The server agrees: a pending request with the note ──
- evalScript: "${output.coachId = String(json(http.get(output.api + '/api/app/class-requests/coaches', { headers: { 'Authorization': 'Bearer ' + output.student } }).body)[0].id)}"
- evalScript: "${output.cls = json(http.get(output.api + '/api/app/academy-classes?coachId=' + output.coachId, { headers: { 'Authorization': 'Bearer ' + output.student } }).body).classes.filter(function (c) { return c.title === output.title; })[0]}"
- evalScript: "${output.jr = output.cls && output.cls.myJoinRequest ? output.cls.myJoinRequest.id : null}"
- assertTrue: "${output.cls.myJoinRequest.status == 'pending'}"
