# PAD-314 / B-089, symptom 3 — "overlay without content", as a RATE.
#
# The observation: on the class form the screen went uniformly dim (a dialog
# overlay is drawn) while the accessibility tree captured at that instant held
# the form and no dialog at all — no overlay node, no buttons — and the save
# was blocked because the confirmation it waits for never appeared.
#
# One run tells you nothing about an intermittent fault, so this flow raises
# the same dialog twenty times and asserts its CONTENT each time. What it
# produces is a number: "the overlay came up empty N times in 20". A rate is
# something a fix can be measured against; "sometimes" is not.
#
# HOW TO READ IT — and this caveat belongs with any number quoted from it:
# twenty closes of THIS dialog on THIS screen say nothing about the other two
# faces of B-089. Symptom 1 lives on the verification screen (flow 51) and the
# ghost lives on the player screen (flow 49). Whoever quotes a rate from one
# of the three must say which one; the next person will otherwise reach for
# whichever number is nearest to hand.
#
# Run it against the PRE-fix build as well as the post-fix build. Without a
# pre-fix rate you cannot tell "the fix cleared it" from "this face was always
# rarer than one run reveals", and that distinction is the whole question.
#
# Nothing is created: the overlap dialog is CANCELLED every iteration, so the
# seeded data is unchanged and the flow can run anywhere in the order.
# NOW A GUARD IN THE SUITE (PAD-314, face B fixed). It was a probe tagged
# `open-defect-probe` while face B was open. It failed on iteration 1 with the
# dialog content mounted but at opacity 0 (run 35114681841), and passed 60 of
# 60 without the Android entering animation (run 35114685284). The tag is gone,
# so whole-suite runs on both platforms include it.
#
# Leaving the form taps `class-new-back` rather than Maestro's `- back`. `back`
# is the Android hardware key and does nothing on iOS, so the flow could never
# pass on the simulator; the screen's own back control works on both.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- runFlow: ../subflows/goto-seeded-monday.yaml
- repeat:
    times: 60
    commands:
      - tapOn:
          id: "calendar-add-class"
      - extendedWaitUntil:
          visible:
            id: "class-name"
          timeout: 15000
      - tapOn:
          id: "class-name"
      - inputText: "Overlay Rate Probe"
      - swipe:
          start: "50%, 45%"
          end: "50%, 20%"
      - scrollUntilVisible:
          element:
            id: "class-save"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "class-save"
      # The seeded Monday already holds a class, so this always overlaps. The
      # assertion is on the dialog's CONTENT, not on the dim: an overlay drawn
      # without its buttons is exactly the failure being counted.
      - extendedWaitUntil:
          visible:
            id: "overlap-cancel"
          timeout: 10000
      - assertVisible:
          id: "overlap-confirm"
      - tapOn:
          id: "overlap-cancel"
      # Back to the form, which must still be usable — and out again, leaving
      # no class behind.
      - extendedWaitUntil:
          visible:
            id: "class-name"
          timeout: 10000
      - tapOn:
          id: "class-new-back"
      - extendedWaitUntil:
          visible:
            id: "screen-calendar"
          timeout: 15000
