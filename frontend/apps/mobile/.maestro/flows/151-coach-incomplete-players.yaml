# Mirrors: apps/web/e2e/dashboard/profile-completeness.spec.ts, coach half (PAD-486,
# dashboard.profile-completeness rule 3). A student who joined by link (no level, no side) is
# listed on the coach's dashboard; a tap opens that player. By test id, never rendered copy.
appId: com.padellevelup.app
onFlowStart:
  - runScript: ../scripts/pad486-setup.js
onFlowComplete:
  - runScript: ../scripts/pad486-teardown.js
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-dashboard"
- scrollUntilVisible:
    element:
      id: "dashboard-incomplete-players"
    direction: DOWN
    timeout: 20000
# PAD-710 (Android lane): the card scroll stops at a clipped card, its rows are below the fold (nightlies 9-11 Nov, run 42606331416); scroll to the first row.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: "dashboard-incomplete-player-.*"
          direction: DOWN
          timeout: 20000
          centerElement: true
- tapOn:
    id: "dashboard-incomplete-player-.*"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
