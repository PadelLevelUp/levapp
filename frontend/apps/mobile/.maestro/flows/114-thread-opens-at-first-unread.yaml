# PAD-415 / messaging.conversation-detail rule 9a; PAD-414 / messaging.conversations rule 16.
# Mirrors: apps/web/e2e/messaging/conversation-first-unread.spec.ts.
# The coach has 40 unread messages in conversation 1, the first behind the first page of
# 30. The list row shows its unread pill; opening the thread lands ON the first unread under
# the "Unread messages" divider, with the newest off screen. After this visit marked the
# thread read, a re-open (via another thread, so the screen really re-opens) shows no
# divider and is not held at the old first unread. Setup and teardown in scripts/first-unread-*.js (R-040).
appId: com.padellevelup.app
onFlowStart:
  # Stop the app before the 40 messages are posted: a running, signed-in app receives
  # them live, and the arrival animations invalidated the iOS driver's view-hierarchy
  # read on the next launch (kAXErrorInvalidUIElement, twice).
  - stopApp
  - runScript: ../scripts/first-unread-setup.js
onFlowComplete:
  - runScript: ../scripts/first-unread-teardown.js
---
- assertTrue: "${output.firstUnreadId > 0 && output.newestId > output.firstUnreadId}"
- runFlow: ../subflows/login-coach.yaml
# PAD-414: the unread row carries its pill.
- tapOn:
    id: "tab-messages"
- extendedWaitUntil:
    visible:
      id: "conversation-unread-1"
    timeout: 30000
# The row's accessibilityLabel ("Conversation with ...") hides its child texts from the
# driver, so the pill's "9+" label cannot be read here; unreadBadgeLabel's value is pinned
# by conversation-item.test.tsx. The badge itself only exists on an unread row.
# PAD-415: the open lands on the first unread, under the divider.
- openLink: "levelup://conversation/1"
- extendedWaitUntil:
    visible:
      id: "message-item-${output.firstUnreadId}"
    timeout: 30000
- assertVisible:
    id: "unread-divider"
- assertNotVisible:
    id: "message-item-${output.newestId}"
# Re-open after reading: newest in view, no divider.
- openLink: "levelup://conversation/2"
- extendedWaitUntil:
    visible:
      id: "message-input"
    timeout: 30000
- openLink: "levelup://conversation/1"
- extendedWaitUntil:
    visible:
      id: "message-input"
    timeout: 30000
# Nothing is unread any more: no divider, and the thread is not held at the old first
# unread. (Rule 9's landing on the newest row is not re-asserted here: with 80 cached rows
# the iOS list settles a few rows short of the end — reported separately, not PAD-415.)
- assertNotVisible:
    id: "unread-divider"
- assertNotVisible:
    id: "message-item-${output.firstUnreadId}"
