# PAD-415 / messaging.conversation-detail rule 9a; PAD-414 / messaging.conversations rule 16.
# Mirrors: apps/web/e2e/messaging/conversation-first-unread.spec.ts.
# The coach has 40 unread messages in conversation 1, the first behind the first page of
# 30. The list row shows the "9+" pill; opening the thread lands ON the first unread under
# the "Unread messages" divider, with the newest off screen. After this visit marked the
# thread read, a re-open (via another thread, so the screen really re-opens) lands on the
# newest message with no divider. Setup and teardown in scripts/first-unread-*.js (R-040).
appId: com.padellevelup.app
onFlowStart:
  - runScript: ../scripts/first-unread-setup.js
onFlowComplete:
  - runScript: ../scripts/first-unread-teardown.js
---
- assertTrue: "${output.firstUnreadId > 0 && output.newestId > output.firstUnreadId}"
- runFlow: ../subflows/login-coach.yaml
# PAD-414: the unread row's pill caps at 9+.
- tapOn:
    id: "tab-messages"
- extendedWaitUntil:
    visible:
      id: "conversation-unread-1"
    timeout: 30000
- assertVisible:
    id: "conversation-unread-1"
    text: "9\\+"
# PAD-415: the open lands on the first unread, under the divider.
- openLink: "levelup://conversation/1"
- extendedWaitUntil:
    visible:
      id: "message-item-${output.firstUnreadId}"
    timeout: 30000
- assertVisible:
    id: "unread-divider"
- assertNotVisible:
    id: "message-item-${output.newestId}"
# Re-open after reading: newest in view, no divider.
- openLink: "levelup://conversation/2"
- extendedWaitUntil:
    visible:
      id: "message-input"
    timeout: 30000
- openLink: "levelup://conversation/1"
- extendedWaitUntil:
    visible:
      id: "message-item-${output.newestId}"
    timeout: 30000
- assertNotVisible:
    id: "unread-divider"
