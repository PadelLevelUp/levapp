# Mirrors: apps/web/e2e/messaging/direct-messages.spec.ts (+ the role badge
# from messaging/participant-role-header.spec.ts)
# - coach sees the unread badge on the seeded conversation (id 1)
# - opens it: header shows the participant role badge (chat-header-role)
# - sends "Maestro message" → bubble appears
# - long-presses it to open the context menu → Edit → text updates
# - long-presses it again → Delete → confirm → "deleted" placeholder shows
# NOTE: conversation id 1 is deterministic on a freshly reset database
# (seed.py creates exactly one conversation). Opening it marks it read, so
# the unread-badge assertion happens first.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-messages"
- extendedWaitUntil:
    visible:
      id: "conversation-item-1"
    timeout: 20000
# Unread badge from the seeded student reply.
- assertVisible:
    id: "conversation-unread-1"

# ── Open the conversation: role badge in header, seeded messages ──
- tapOn:
    id: "conversation-item-1"
- extendedWaitUntil:
    visible:
      id: "chat-header-role"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "Thanks coach!"
    timeout: 15000

# ── Send ──
- tapOn:
    id: "message-input"
- inputText: "Maestro message"
- tapOn:
    id: "message-send"
- extendedWaitUntil:
    visible:
      text: "Maestro message"
    timeout: 15000

# ── Edit (long-press own bubble → context menu → Edit → retype) ──
# The keyboard is still open after sending; the first tap on the list only
# dismisses it (keyboardShouldPersistTaps is "never") and never reaches the
# bubble — so dismiss it first with a tap on an empty list area.
- tapOn:
    point: "50%, 45%"
    retryTapIfNoChange: false
- waitForAnimationToEnd
- longPressOn:
    text: "Maestro message"
# NOTE: the menu container's own testID (message-context-menu) does not
# surface in the iOS a11y tree (portal-rendered View) — wait on an inner
# menu item instead.
- extendedWaitUntil:
    visible:
      id: "message-edit"
    timeout: 10000
- tapOn:
    id: "message-edit"
- extendedWaitUntil:
    visible:
      id: "message-edit-input"
    timeout: 10000
- tapOn:
    id: "message-edit-input"
- eraseText: 40
- inputText: "Maestro message edited"
- tapOn:
    id: "message-edit-save"
- extendedWaitUntil:
    visible:
      text: "Maestro message edited"
    timeout: 15000

# ── Delete (long-press bubble → context menu → Delete → confirm → placeholder) ──
# Same keyboard-dismiss guard (the edit composer reopened the keyboard).
- tapOn:
    point: "50%, 45%"
    retryTapIfNoChange: false
- waitForAnimationToEnd
- longPressOn:
    text: "Maestro message edited"
- extendedWaitUntil:
    visible:
      id: "message-delete"
    timeout: 10000
- tapOn:
    id: "message-delete"
- extendedWaitUntil:
    visible:
      id: "message-delete-confirm"
    timeout: 10000
- tapOn:
    id: "message-delete-confirm"
- extendedWaitUntil:
    visible:
      text: "Message deleted|Deleted message"
    timeout: 15000
- assertNotVisible: "Maestro message edited"
