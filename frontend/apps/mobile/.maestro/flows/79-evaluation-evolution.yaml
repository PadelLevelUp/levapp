# PAD-375 / evaluations.evolution — "Evolução" on iOS.
# Mirrors apps/web/e2e/evaluation-tools/evaluation-evolution.spec.ts. (Flow number 79
# reserved for this slice by the Coordinator, 2026-09-21.)
#
# The seed gives "E2E Student Two" five past-dated Forehand evaluations (a legacy 1-10
# category), filed in records. The setup script asks the server what it computes for
# them and turns that into test ids; the flow asserts the screen shows exactly those —
# the first competency with data selected, the chart on the competency's own scale with
# one point per month, the means and the delta as sent — and that a point's value is
# reachable by a tap, since there is no hover on a phone. Reads only: it writes nothing.
appId: com.padellevelup.app
---
- runScript: ../scripts/evolution-setup.js
- assertTrue: "${output.evoRecords > 1}"

- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 15000
- tapOn:
    id: "players-search"
- inputText: "E2E Student Two"
# The card is matched by ID, as 07 and 57 do (player-card-2 is "E2E Student Two" on the
# seed). NOT by name: once typed, the search field itself holds the text "E2E Student Two"
# and is the first match, so the tap lands on the input and nothing opens (first simulator
# run, Session-D, 2026-09-21). The card's label "Open player …" is rendered copy — not that either.
- extendedWaitUntil:
    visible:
      id: "player-card-2"
    timeout: 20000
- tapOn:
    id: "player-card-2"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
# PAD-834 (players.profile rule 10): Evolução is read in the profile's Avaliações block, from the
# second record on (the seed gives this player several). Each figure is scrolled to on its own:
# on Android the scroll view starts below the fixed action row, and the section counts as "100%
# visible" by its clipped bounds while its pill row is still above the viewport (PR #996's
# Android lane: section at y 417-1122, action row ending at 395, pill absent from the screen).

# ── The first competency with data is selected; the figures are the server's ──
- scrollUntilVisible:
    element:
      id: "${output.evoPill}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible:
    id: "${output.evoPill}"
- scrollUntilVisible:
    element:
      id: "${output.evoChart}"
    direction: DOWN
    timeout: 15000
    centerElement: true
- scrollUntilVisible:
    element:
      id: "${output.evoM1}"
    direction: DOWN
    timeout: 15000
    centerElement: true
- assertVisible:
    id: "${output.evoM12}"
- scrollUntilVisible:
    element:
      id: "${output.evoDelta}"
    direction: DOWN
    timeout: 15000
    centerElement: true

# ── No hover on a phone: a point's value is one tap away ──
- scrollUntilVisible:
    element:
      id: "evolution-point-0"
    direction: UP
    timeout: 15000
    centerElement: true
- tapOn:
    id: "evolution-point-0"
- extendedWaitUntil:
    visible:
      id: "evolution-point-caption-0"
    timeout: 5000

# ── The seeded history is there too, behind "Histórico (N)" ──
- scrollUntilVisible:
    element:
      id: "player-evaluations-open"
    direction: UP
    timeout: 20000
    # Centred: scrolled up only until "visible", the button sits under the header and the tap lands there.
    centerElement: true
- tapOn:
    id: "player-evaluations-open"
- extendedWaitUntil:
    visible:
      id: "player-evaluations"
    timeout: 15000
# (Whether a card offers "edit" is the server's `editable`; flow 78 covers it on its own rows. Not
# asserted here: another flow rating this player today must not be able to turn this one red.)
- scrollUntilVisible:
    element:
      id: "evaluation-history-card-.*"
    direction: DOWN
    timeout: 20000

- tapOn:
    id: "player-evaluations-back"
