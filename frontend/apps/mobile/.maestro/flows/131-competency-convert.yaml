# PAD-480 / evaluations.competencies rule 18 — on iOS a coach converts a legacy category named like a
# default into that default category from "Definir categorias de avaliação", and the dialog moves the
# default's stray sub-category under it. The server holds both changes.
#
# Mirrors: apps/web/e2e/evaluation-tools/pad480-convert-competency.spec.ts. Builds its own rows through
# the API: a legacy "Tática " (trailing space, as prod stores them) through the legacy upsert, then
# Transição, which the server leaves at the top level because the legacy row holds the default's name.
# `onFlowComplete` deletes both (the converted row takes Transição with it, rule 9), so the shared coach
# is left as it was (R-040).
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.cleanA = (typeof output.legacyId === 'undefined') ? false : http.request(output.api + '/api/app/evaluation_competency/' + output.legacyId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + output.coachTok } }).ok}"
  - evalScript: "${output.cleanB = (typeof output.strayId === 'undefined') ? false : http.request(output.api + '/api/app/evaluation_competency/' + output.strayId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + output.coachTok } }).ok}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.seeded = http.post(output.api + '/api/app/add_evaluation_categories', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify([{ name: 'Tática ', scaleMin: 1, scaleMax: 5 }]) }).ok}"
- evalScript: "${output.legacyId = json(http.get(output.api + '/api/app/evaluation_competencies', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).competencies.filter(function (c) { return c.name === 'Tática ' && c.group === null; })[0].id}"
- evalScript: "${output.strayId = json(http.post(output.api + '/api/app/evaluation_competency', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ catalogueKey: 'transition' }) }).body).id}"
- assertTrue: "${typeof output.legacyId === 'number' && typeof output.strayId === 'number'}"

- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-preferences"
- scrollUntilVisible:
    element:
      id: "settings-competencies-open"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-competencies-open"
- extendedWaitUntil:
    visible:
      id: "competency-manager"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "competency-convert-id-${output.legacyId}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: "competency-convert-id-${output.legacyId}"
- extendedWaitUntil:
    visible:
      id: "competency-convert-dialog"
    timeout: 10000
- assertVisible:
    id: "competency-convert-old-app"
- assertVisible:
    id: "competency-convert-move"
- tapOn:
    id: "competency-convert-confirm"
- extendedWaitUntil:
    notVisible:
      id: "competency-convert-dialog"
    timeout: 15000

# The server holds the conversion and the move (read until both land, up to ~10 s).
- retry:
    maxRetries: 5
    commands:
      - extendedWaitUntil:
          visible:
            id: "pad480-never-present"
          timeout: 2000
          optional: true
      - evalScript: "${output.rows = json(http.get(output.api + '/api/app/evaluation_competencies', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).competencies}"
      - evalScript: "${output.key = output.rows.filter(function (c) { return c.id === output.legacyId; })[0].key}"
      - evalScript: "${output.parent = output.rows.filter(function (c) { return c.id === output.strayId; })[0].parentId}"
      - assertTrue: "${output.key == 'tactics' && output.parent == output.legacyId}"
