# New flow: coach exercises the Remind and Notify actions on the seeded
# class (Phase 2 class-detail parity).
# - Remind is fired for real: it only nudges already-invited/unconfirmed
#   participants and is idempotent — safe to run repeatedly.
# - Notify is opened far enough to confirm the picker renders (groups +
#   search), then cancelled WITHOUT sending: a real send would create
#   notification rows other flows don't account for, so this stays read-only
#   per the assignment.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- runFlow: ../subflows/goto-seeded-monday.yaml
- tapOn: "E2E Academy Class"

# ── Remind ──
- scrollUntilVisible:
    element:
      id: "class-remind"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "class-remind"
- extendedWaitUntil:
    visible:
      text: ".*Reminders sent.*"
    timeout: 15000

# ── Notify: open the picker, confirm it renders, cancel without sending ──
- scrollUntilVisible:
    element:
      id: "class-notify"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "class-notify"
- extendedWaitUntil:
    visible:
      id: "class-notify-search"
    timeout: 15000
# By id: the accessibilityLabel text "Cancel notify" does not match on Android (PAD-304).
- tapOn:
    id: "class-notify-cancel"
# OPEN (PAD-304): on the Android emulator this tap lands on the button — Maestro
# resolves it in the hierarchy, taps its centre and reports it completed — and
# the dialog is still open ten seconds later, while the confirm button of the
# same dialog primitive responds in flow 03 on the same run. The mechanism is
# not named yet, so rather than assert a state we cannot reach, the dialog's
# own close control is the fallback: the flow still proves the dialog closes,
# and the branch taken in the log says which control did it.
- runFlow:
    when:
      visible:
        id: "class-notify-search"
    commands:
      - tapOn:
          id: "dialog-close"
- extendedWaitUntil:
    notVisible:
      id: "class-notify-search"
    timeout: 10000
