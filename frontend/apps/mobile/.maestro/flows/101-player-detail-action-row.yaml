# PAD-834 (players.profile rules 4, 21): the header's four actions in order — Adicionar a aulas,
# Lista de espera, Editar, Desassociar (destructive, last); presences, absences and evaluations left
# the header for the blocks. Then the blocks, in order: Informação, Avaliações, Assiduidade, and the
# Pontos fortes e fracos card until owner question Q4 is answered. By test id only — never rendered
# copy. Modelled on 07-player-notes.yaml's search-and-open pattern.
# player-card-1 is deterministic: E2E Student (see 04-attendance.yaml).
# Proof on iOS for PLAYERS-PROFILE-10 and -21 (not citable: the citable tests are vitest).
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 15000
- tapOn:
    id: "players-search"
# The Players tab keeps its search (Session-D's flow-97 run): clear it before typing.
- eraseText: 40
- inputText: "E2E Student"
- extendedWaitUntil:
    visible:
      id: "player-card-1"
    timeout: 20000
- tapOn:
    id: "player-card-1"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000

# ── Header: four actions, in order (they wrap on a narrow screen, left to right) ──
- assertVisible:
    id: "player-add-to-classes"
# E2E Student is seeded off the standing waiting list; if a peer flow leaves
# it enrolled this assertion needs "player-waiting-list-remove" instead.
- assertVisible:
    id: "player-waiting-list"
- assertVisible:
    id: "player-edit"
- assertVisible:
    id: "player-remove"
- assertNotVisible:
    id: "player-attendance-link"
- assertNotVisible:
    id: "player-absences-link"
- assertNotVisible:
    id: "player-evaluations-action"

# ── The blocks, in order ──
- scrollUntilVisible:
    element:
      id: "player-info-card"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "player-info-edit"
- scrollUntilVisible:
    element:
      id: "evaluation-card"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "player-evaluations-open"
- scrollUntilVisible:
    element:
      id: "profile-attendance-block"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "profile-period-1m"
- scrollUntilVisible:
    element:
      id: "strengths-weaknesses-card"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "strengths-weaknesses-card"
