# PAD-793 (classes.create rule 6b, B-709; owner, 2026-10-29): the iOS new-class form shows
# "Notificações automáticas", starting off, and a class created with it switched on is stored on.
# Before PAD-793 the iOS form had no switch and always sent false, so a class's reminders stopped
# once PAD-729 made its occurrences honour the false.
#
# One-off class on a Tuesday about two years out (deep link `class/new?date=`). Proven by the
# server's own class payload, never rendered copy. Mirrors the web unit test
# AddClassSheet.clone.test.tsx ("the notifications switch"). Flow number 314 reserved by the
# coordinator for PAD-793. Setup and teardown remove the class.
appId: com.padellevelup.app
onFlowStart:
  - runScript: ../scripts/notify-switch-setup.js
onFlowComplete:
  - runScript: ../scripts/notify-switch-setup.js
---
- runFlow: ../subflows/login-coach.yaml
- openLink: "levelup://class/new?date=${output.day}"
- extendedWaitUntil:
    visible:
      id: "class-name"
    timeout: 15000
- tapOn:
    id: "class-name"
- inputText: "Maestro PAD-793 Switch"
- pressKey: Enter

- scrollUntilVisible:
    element:
      id: "class-new-auto-notify-switch"
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible:
    id: "class-new-auto-notify-switch"
    checked: false
- tapOn:
    id: "class-new-auto-notify-switch"
- assertVisible:
    id: "class-new-auto-notify-switch"
    checked: true

- scrollUntilVisible:
    element:
      id: "class-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "class-save"
- extendedWaitUntil:
    visible:
      id: "overlap-confirm"
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible:
        id: "overlap-confirm"
    commands:
      - tapOn:
          id: "overlap-confirm"
- extendedWaitUntil:
    notVisible:
      id: "class-new"
    timeout: 15000

# The server's class payload for the new class: notificationsEnabled true. Bounded re-read: the
# create may land a moment after the screen goes back.
- evalScript: "${output.on = (function () { var auth = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }; for (var i = 0; i < 40; i++) { var ev = json(http.get(output.api + '/api/app/calendar?from=' + output.day + 'T00:00:00&to=' + output.day + 'T23:59:59', { headers: auth }).body).filter(function (e) { return e.type === 'class' && e.title === 'Maestro PAD-793 Switch' })[0]; if (ev) { return String(json(http.post(output.api + '/api/app/class_instance?model=' + ev.model + '&id=' + ev.originalId + '&date=' + ev.date, { headers: auth, body: '{}' }).body).notificationsEnabled); } } return 'missing'; })()}"
- assertTrue: "${output.on === 'true'}"
