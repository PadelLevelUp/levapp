# PAD-834 (players.profile rule 12; attendance.history rule 17, attendance.absences rule 12): the
# player screen's Assiduidade block lists the presences in place and leads to the full screens.
# Proof on iOS for PLAYERS-PROFILE-18, ATTENDANCE-HISTORY-10, ATTENDANCE-ABSENCES-10 (the citable
# tests are vitest). The seeded history is 8–250 days old, so the year is used.
# player-card-1 is deterministic: E2E Student (see 04-attendance.yaml).
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 15000
- tapOn:
    id: "players-search"
- eraseText: 40
- inputText: "E2E Student"
- extendedWaitUntil:
    visible:
      id: "player-card-1"
    timeout: 20000
- tapOn:
    id: "player-card-1"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "profile-period-1y"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: "profile-period-1y"
- scrollUntilVisible:
    element:
      id: "profile-attendance-toggle"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "profile-attendance-toggle"
- extendedWaitUntil:
    visible:
      id: "profile-attendance-history-item"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "profile-attendance-full"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "profile-attendance-full"
- extendedWaitUntil:
    visible:
      id: "attendance"
    timeout: 15000
- tapOn:
    id: "attendance-back"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "profile-absences-toggle"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: "profile-absences-toggle"
- extendedWaitUntil:
    visible:
      id: "absences-justification-.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "profile-absences-full"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "profile-absences-full"
- extendedWaitUntil:
    visible:
      id: "absences"
    timeout: 15000
