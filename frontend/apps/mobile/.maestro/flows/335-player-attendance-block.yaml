# PAD-834 (players.profile rule 12; attendance.history rule 17, attendance.absences rule 12): the
# player screen's Assiduidade block lists the presences in place and leads to the full screens.
# Proof on iOS for PLAYERS-PROFILE-18, ATTENDANCE-HISTORY-10, ATTENDANCE-ABSENCES-10 (the citable
# tests are vitest). The seeded history is 8–250 days old, so the year is used.
# player-card-1 is deterministic: E2E Student (see 04-attendance.yaml).
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 15000
- tapOn:
    id: "players-search"
- eraseText: 40
- inputText: "E2E Student"
- extendedWaitUntil:
    visible:
      id: "player-card-1"
    timeout: 20000
- tapOn:
    id: "player-card-1"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "profile-period-1y"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: "profile-period-1y"
- scrollUntilVisible:
    element:
      id: "profile-attendance-toggle"
    direction: DOWN
    timeout: 10000
    centerElement: true
# The toggle is disabled while the period's history loads; wait until it is enabled.
- extendedWaitUntil:
    visible:
      id: "profile-attendance-toggle"
      enabled: true
    timeout: 15000
# The screen's header and action row sit above the scroll view. At the end of the page the toggle is
# left at y≈160-190, under the action row (bottom at y≈189), where a tap lands on the action row and
# no scroll can centre it. Pull the content down by a third of the screen first.
- swipe:
    start: "50%, 40%"
    end: "50%, 75%"
    duration: 600
- waitForAnimationToEnd
- tapOn:
    id: "profile-attendance-toggle"
# The list opens under the toggle, below the fold on a phone: scroll to its first row.
- scrollUntilVisible:
    element:
      id: "profile-attendance-history-item"
    direction: DOWN
    timeout: 15000
    centerElement: true
- scrollUntilVisible:
    element:
      id: "profile-attendance-full"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "profile-attendance-full"
- extendedWaitUntil:
    visible:
      id: "attendance"
    timeout: 15000
- tapOn:
    id: "attendance-back"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "profile-absences-toggle"
    direction: DOWN
    timeout: 20000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "profile-absences-toggle"
      enabled: true
    timeout: 15000
# The chart's load reflows the block; centre the toggle again so the tap is not under the header.
- scrollUntilVisible:
    element:
      id: "profile-absences-toggle"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "profile-absences-toggle"
- scrollUntilVisible:
    element:
      id: "absences-justification-.*"
    direction: DOWN
    timeout: 15000
    centerElement: true
- scrollUntilVisible:
    element:
      id: "profile-absences-full"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "profile-absences-full"
- extendedWaitUntil:
    visible:
      id: "absences"
    timeout: 15000
