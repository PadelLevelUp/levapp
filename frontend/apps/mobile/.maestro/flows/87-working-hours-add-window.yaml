# PAD-361 (B-140) — settings.coach-working-hours rule 5: "add window" always gives
# a day the server accepts. On an untouched day (the default 08:00–22:00, no room
# after it) the day splits around the lunch break, and Save succeeds. Before the
# fix the new window was 22:00–22:00 and the save was refused.
#
# Mirrors: apps/web/e2e/settings/coach-working-hours.spec.ts (the PAD-361 test).
# No time spinner is driven: the value under test is what the button produces.
#
# The seeded coach starts with no working hours. API steps clear them before the
# flow and after it, so a failed run leaves nothing for flows 69 and 85.
# Backend: -e API_BASE=http://localhost:<port>, else :5001. Order: not load bearing.
# Flow number 87 is from Session D's range (2026-09-21 wave).
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.tidy = (typeof output.coachTok === 'undefined') ? false : http.put(output.api + '/api/app/coach/working-hours', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ workingHours: null }) }).ok}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.reset = http.put(output.api + '/api/app/coach/working-hours', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ workingHours: null }) }).ok}"
- assertTrue: "${output.reset == true}"

- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "settings-nav-calendar"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-nav-calendar"
- scrollUntilVisible:
    element:
      id: "working-hours-default"
    direction: DOWN
    timeout: 30000

# ── Monday, untouched: add a window ──
- scrollUntilVisible:
    element:
      id: "working-hours-add-mon"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "working-hours-add-mon"
- scrollUntilVisible:
    element:
      id: "working-hours-mon-1-end"
    direction: DOWN
    timeout: 20000

# ── Save: accepted ──
- scrollUntilVisible:
    element:
      id: "working-hours-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "working-hours-save"
- scrollUntilVisible:
    element:
      id: "working-hours-set"
    direction: UP
    timeout: 30000
- assertNotVisible:
    id: "working-hours-error-mon"

# The server holds the split day: morning, lunch break, afternoon.
- evalScript: "${output.mon = json(http.get(output.api + '/api/app/coach/working-hours', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).workingHours.mon}"
- assertTrue: "${output.mon.length == 2 && output.mon[0][0] == '08:00' && output.mon[0][1] == '13:00' && output.mon[1][0] == '14:00' && output.mon[1][1] == '22:00'}"
