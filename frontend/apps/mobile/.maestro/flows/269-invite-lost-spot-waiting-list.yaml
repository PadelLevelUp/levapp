# PAD-577 — notifications.invitations rule 15a on iOS: a student whose invitation lost the spot to
# another ("Vaga preenchida") joins that class's waiting list from the message and reads "Estás na
# lista de espera". Seeded through the API (R-040): a class three days out with one open spot,
# "E2E Student" (the signed-in student) and "Filler Player 01" invited by hand, the filler's yes
# recorded by the coach so the class is full; the student's own late "yes" is then refused as
# spot_filled (a manual invitation has no vacancy, so a fill never retires it). The coach's open
# spots are made visible for the join (waiting-list rule 14) and restored on completion.
# Asserted by id (PAD-320). Flow
# number 269 is from 0910-SessionB's wave-14 block (unconfirmed).
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.cleanup && output.cleanup()}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.auth = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }}"
- evalScript: "${output.players = (function (r) { return r.items ? r.items : r; })(json(http.get(output.api + '/api/app/coach_players', { headers: output.auth }).body))}"
- evalScript: "${output.find = function (n) { return output.players.filter(function (p) { return p.name === n; })[0]; }}"
- evalScript: "${output.student = output.find('E2E Student')}"
- evalScript: "${output.filler = output.find('Filler Player 01')}"
- evalScript: "${output.two = output.find('E2E Student Two')}"
- assertTrue: "${output.student != null && output.filler != null && output.two != null}"
- evalScript: "${output.day = (function (d) { var m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' + m : '' + m) + '-' + (x < 10 ? '0' + x : '' + x); })(new Date(Date.now() + 3 * 86400000))}"
# One open spot: capacity 2 with Student Two enrolled; the signed-in student and the filler are invited.
- evalScript: "${output.made = json(http.post(output.api + '/api/app/add_class', { headers: output.auth, body: JSON.stringify({ name: 'E2E Lost Spot iOS', classType: 'academy', maxPlayers: 2, levelId: output.student.levelId, date: output.day, startTime: '17:00', endTime: '18:00', playerIds: [output.two.playerId], isRecurring: false, notificationsEnabled: true }) }).body)}"
- evalScript: "${output.wasVisible = !!json(http.get(output.api + '/api/app/notify/config', { headers: output.auth }).body).openSpotsVisible}"
- evalScript: "${output.cleanup = function () { http.post(output.api + '/api/app/notify/config', { headers: output.auth, body: JSON.stringify({ openSpotsVisible: output.wasVisible }) }); http.post(output.api + '/api/app/remove_class', { headers: output.auth, body: JSON.stringify({ event: { model: output.made.model || 'Lesson', originalId: output.made.originalId, date: output.day }, scope: 'single' }) }); }}"
- evalScript: "${output.visible = json(http.post(output.api + '/api/app/notify/config', { headers: output.auth, body: JSON.stringify({ openSpotsVisible: true }) }).body).openSpotsVisible}"
- assertTrue: "${output.visible === true}"
- evalScript: "${output.sent = json(http.post(output.api + '/api/app/notify/manual', { headers: output.auth, body: JSON.stringify({ model: output.made.model || 'Lesson', originalId: output.made.originalId, date: output.day, playerIds: [output.filler.playerId, output.student.playerId] }) }).body).sent}"
- assertTrue: "${output.sent === 2}"
- evalScript: "${output.detail = json(http.post(output.api + '/api/app/class_instance?model=' + (output.made.model || 'Lesson') + '&id=' + output.made.originalId + '&date=' + output.day, { headers: output.auth, body: '{}' }).body)}"
- evalScript: "${output.fillerInvite = output.detail.invitations.filter(function (i) { return i.playerId === String(output.filler.playerId); })[0]}"
- assertTrue: "${output.fillerInvite != null}"
# The coach records the filler's yes: the class is full.
- evalScript: "${output.answered = http.post(output.api + '/api/app/notify/coach_respond', { headers: output.auth, body: JSON.stringify({ notificationEventId: output.fillerInvite.id, action: 'yes' }) }).ok}"
- assertTrue: "${output.answered === true}"
# The student answers yes too late: refused as spot_filled, "Vaga preenchida" on their bubble.
- evalScript: "${output.studentInvite = output.detail.invitations.filter(function (i) { return i.playerId === String(output.student.playerId); })[0]}"
- assertTrue: "${output.studentInvite != null}"
- evalScript: "${output.studentTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-student', password: 'E2eStudent123!' }) }).body).accessToken}"
- evalScript: "${output.late = json(http.post(output.api + '/api/app/notify/respond', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.studentTok }, body: JSON.stringify({ notificationEventId: output.studentInvite.id, action: 'yes' }) }).body).action}"
- assertTrue: "${String(output.late).indexOf('spot_filled') === 0}"

- runFlow: ../subflows/login-student.yaml
- tapOn:
    id: "tab-messages"
- extendedWaitUntil:
    visible:
      id: "conversation-item-.*"
    timeout: 15000
- tapOn:
    id: "conversation-item-.*"
    index: 0
# ── rule 15a: the lost spot offers the waiting list; joining shows the on-list state ──
- scrollUntilVisible:
    element:
      id: "invite-join-waiting-list"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "invite-join-waiting-list"
- extendedWaitUntil:
    visible:
      id: "invite-on-waiting-list"
    timeout: 15000
- assertNotVisible:
    id: "invite-join-waiting-list"
# ── the coach's class holds them as the student's own request (waiting-list rule 14) ──
- evalScript: "${output.rows = json(http.post(output.api + '/api/app/class_instance?model=LessonInstance&id=' + output.detail.originalId + '&date=' + output.day, { headers: output.auth, body: '{}' }).body).waitingList || []}"
- assertTrue: "${output.rows.length === 1 && output.rows[0].playerId === output.student.playerId && output.rows[0].origin === 'student'}"
