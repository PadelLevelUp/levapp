# PAD-240 — tapping a MESSAGE push opens the conversation thread, never the
# class screen (messaging.push-notifications rule 7).
#
# A push cannot be sent from inside Maestro, so this flow is driven by
# scripts/push-tap-flow.sh: it starts this flow and, once Maestro reports the
# "conversation-item-1 is visible" step complete (login-coach has run and this
# flow is parked on the Messages tab), delivers a simulated APNs notification
# with `xcrun simctl push` (payload:
# scripts/push-payloads/message.apns) whose data is {type: "message",
# conversationId: 1} — the shape the backend now sends for every
# message-backed push (direct messages AND invitation/reminder system
# messages). The flow taps the foreground banner and asserts the thread opened.
# Seeded conversation id 1 is deterministic on a fresh database.
#
# Order-independent (reads only); not in config.yaml's flowsOrder because it
# needs the wrapper script — run it via `bash scripts/push-tap-flow.sh`.
appId: com.padellevelup.app
---
# Notification permission first: the registrar asks for it on the simulator
# too (token fetch stays device-only), and Maestro answers the system dialog.
# Without permission iOS drops the simulated push silently.
- launchApp:
    permissions:
      notifications: allow
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-messages"
- extendedWaitUntil:
    visible:
      id: "conversation-item-1"
    timeout: 20000

# The wrapper delivers the push while this waits. The foreground handler
# shows a banner (setNotificationHandler: shouldShowBanner).
- extendedWaitUntil:
    visible:
      text: "PAD-240 push probe"
    timeout: 45000
- tapOn:
    text: "PAD-240 push probe"

# The tap must land in the thread: header role badge + seeded message, and
# NOT the class screen's "could not be found" error state.
- extendedWaitUntil:
    visible:
      id: "chat-header-role"
    timeout: 20000
- assertVisible:
    text: "Thanks coach!"
- assertNotVisible:
    id: "class-detail"
