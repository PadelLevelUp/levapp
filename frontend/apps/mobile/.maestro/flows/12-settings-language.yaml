# Mirrors: apps/web/e2e/settings/language-preference.spec.ts
# - change the preferred language and back; each change is persisted via
#   PATCH /auth/me and confirmed by the saved-status line
#   (`settings-language-status`, asserted by id — it renders in whichever
#   language was just chosen).
#
# The options are tapped by id on both platforms since B-067: a select's
# portal wrapper had no size, so its list lay outside its parent's bounds and
# Android neither hit-tested it nor exposed it to accessibility. Each tap is
# still verified by the saved-status assertion, so a miss fails loudly
# instead of passing silently.
#
# GOTCHA — seeded language is "en", not "pt": seed.py (PAD-40) seeds e2e-coach
# with language="en" so the rest of the E2E suite renders in English. The
# Select's onValueChange no-ops when the tapped option already matches the
# current value, so tapping "English" first (as if starting from "pt") never
# fires the save. Instead: switch to Portuguese first (a genuine change from
# the seeded "en") and verify the save, then switch back to English so the
# suite's English-UI assumption (and the seed default) holds for any
# subsequent standalone re-run of this flow or of the suite's failed-flow
# retry (scripts/e2e.sh reruns failed flows individually, without a DB
# reset).
#
# The restore-to-English step leaves the Preferences pane and comes back
# first, forcing a remount so the leftover saved-status line from the
# Portuguese step is gone before the second save — otherwise the stale line
# would make a missed second tap pass silently.
#
# PAD-193 rewired the navigation only: Settings is off the bottom bar and is
# pushed from the header avatar (`header-account`), and the language control
# lives one drill-in down, inside Preferences (`settings-nav-preferences`) —
# the old `tab-more` / `more-settings` pair had been dead far longer than that.
# The percent taps that used to stand in for the iOS options are gone (PAD-304):
# both platforms tap `settings-language-pt` / `-en` by id, which works since
# B-067 fixed the select's portal wrapper.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-preferences"
- extendedWaitUntil:
    visible:
      id: "settings-language-select"
    timeout: 15000
# (The selected value text is collapsed into the trigger's a11y label
# "Preferred language", so it cannot be asserted directly.)

# ── Switch to Portuguese (first option) — a genuine change from seeded "en" ──
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "settings-language-select"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      # Both platforms tap the option by id (PAD-304). The percent taps this
      # used to need on iOS are gone: B-067 made the select's portal wrapper
      # fill the overlay, so the options are addressable on both platforms.
      - tapOn:
          id: "settings-language-pt"
          retryTapIfNoChange: false
      # By id, not by the sentence: the status is deliberately rendered in the
      # language just switched TO (preferences-section.tsx holds the key, not
      # the resolved string), so asserting the English text failed the moment
      # the switch to Portuguese succeeded — and left every later coach flow
      # running in Portuguese (PAD-304).
      - extendedWaitUntil:
          visible:
            id: "settings-language-status"
          timeout: 8000

# ── Remount Settings (clears the local saved-status text) ──
- tapOn:
    id: "settings-back"
- extendedWaitUntil:
    visible:
      id: "settings-section-list"
    timeout: 8000
- tapOn:
    id: "settings-nav-preferences"
- extendedWaitUntil:
    visible:
      id: "settings-language-select"
    timeout: 15000
- assertNotVisible:
    id: "settings-language-status"

# ── Switch back to English (second option) — restores the seed default ──
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "settings-language-select"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      # Both platforms tap the option by id (PAD-304). The percent taps this
      # used to need on iOS are gone: B-067 made the select's portal wrapper
      # fill the overlay, so the options are addressable on both platforms.
      - tapOn:
          id: "settings-language-en"
          retryTapIfNoChange: false
      # By id, not by the sentence: the status is deliberately rendered in the
      # language just switched TO (preferences-section.tsx holds the key, not
      # the resolved string), so asserting the English text failed the moment
      # the switch to Portuguese succeeded — and left every later coach flow
      # running in Portuguese (PAD-304).
      - extendedWaitUntil:
          visible:
            id: "settings-language-status"
          timeout: 8000
