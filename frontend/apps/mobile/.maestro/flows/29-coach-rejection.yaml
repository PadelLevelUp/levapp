# PAD-233 — auth.coach-approval rules 10-13. The seeded REJECTED coach
# e2e-coach-rejected (PAD-532: rejecting moved to the staff console, so the
# flow no longer rejects a fresh sign-up through the product API) signs in; the
# login screen then shows "Pedido não aprovado" with the reason and a
# "Pedir nova aprovação" button that signs the coach in on the pending screen.
# The flow moves that account rejected -> pending, so it runs once per seeded DB.
#
# Mirrors: apps/web/e2e/auth-onboarding/coach-rejection.spec.ts
appId: com.padellevelup.app
---
# The backend the API calls hit: -e API_BASE=http://localhost:<port> for an isolated
# backend, the shared :5001 otherwise.
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- retry:
    maxRetries: 3
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: "tab-dashboard"
          timeout: 20000
          optional: true
      - runFlow:
          when:
            visible:
              id: "tab-dashboard"
          file: ../subflows/logout.yaml
      - extendedWaitUntil:
          visible:
            id: "login-username"
          timeout: 30000
- waitForAnimationToEnd
- evalScript: ${output.username = 'e2e-coach-rejected'}

# ── Login says why ──
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "login-username"
      - eraseText: 40
      - inputText: ${output.username}
      - assertVisible: ${output.username}
- tapOn:
    id: "login-password"
- eraseText: 40
- inputText: "E2eCoach123!"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "login-rejected"
    timeout: 15000
- assertVisible:
    id: "login-rejected-reason"

# ── Request again → pending screen ──
- tapOn:
    id: "login-reapply"
- extendedWaitUntil:
    visible:
      id: "coach-pending"
    timeout: 25000
- tapOn:
    id: "coach-pending-signout"
- extendedWaitUntil:
    visible:
      id: "login-username"
    timeout: 15000
