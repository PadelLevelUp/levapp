# PAD-683 — players.nickname rule 9 on iOS (B-631): with "use the nickname as the main name" on,
# the invite picker's search row and the class screen's invitee row name the student by the
# coach's nickname. Seeded through the API (R-040): "Filler Player 02" gets the nickname
# "Alcunha M301" (switch on) and a class five days out has "E2E Student" enrolled. Teardown clears
# the nickname and removes the class. Driven by ids; the one rendered-text check is the nickname
# itself, which is what the rule is about.
# Flow number 301 is from la-2110-SessionD's wave-16 block 301–305 (unconfirmed).
#
# Mirrors: apps/web/e2e/players/pad683-coach-display-name.spec.ts (US-683a, US-683b)
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.cleanup && output.cleanup()}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.auth = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }}"
- evalScript: "${output.players = (function (r) { return r.items ? r.items : r; })(json(http.get(output.api + '/api/app/coach_players', { headers: output.auth }).body))}"
- evalScript: "${output.find = function (n) { return output.players.filter(function (p) { return p.name === n; })[0]; }}"
- evalScript: "${output.enrolled = output.find('E2E Student')}"
- evalScript: "${output.nicked = output.find('Filler Player 02')}"
- assertTrue: "${output.enrolled != null && output.nicked != null}"
- evalScript: "${output.setNick = function (nick, on) { return http.post(output.api + '/api/app/edit_player', { headers: output.auth, body: JSON.stringify({ player: { coachId: output.nicked.coachId, playerId: output.nicked.playerId }, updates: { nickname: nick, nicknameAsName: on } }) }).ok; }}"
- assertTrue: "${output.setNick('Alcunha M301', true) === true}"
- evalScript: "${output.day = (function (d) { var m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' + m : '' + m) + '-' + (x < 10 ? '0' + x : '' + x); })(new Date(Date.now() + 5 * 86400000))}"
- evalScript: "${output.made = json(http.post(output.api + '/api/app/add_class', { headers: output.auth, body: JSON.stringify({ name: 'E2E Invite Nickname iOS', classType: 'academy', maxPlayers: 4, date: output.day, startTime: '20:30', endTime: '21:30', playerIds: [output.enrolled.playerId], isRecurring: false }) }).body)}"
- evalScript: "${output.ref = { model: output.made.model || 'Lesson', originalId: output.made.originalId, date: output.day }}"
- evalScript: "${output.cleanup = function () { http.post(output.api + '/api/app/remove_class', { headers: output.auth, body: JSON.stringify({ event: output.ref, scope: 'single' }) }); output.setNick('', false); }}"
- evalScript: "${output.instanceId = json(http.get(output.api + '/api/app/calendar?from=' + output.day + 'T00:00:00&to=' + output.day + 'T23:59:59', { headers: output.auth }).body).filter(function (e) { return e.title === 'E2E Invite Nickname iOS' && e.model === 'LessonInstance'; })[0].originalId}"
- assertTrue: "${output.instanceId > 0}"
- evalScript: "${output.pid = String(output.nicked.playerId)}"

# ── the class screen → Convidar → search by the REAL name; the row reads the nickname ──
- runFlow: ../subflows/login-coach.yaml
- openLink: "levelup://class/${output.instanceId}"
- scrollUntilVisible:
    element:
      id: "class-notify"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "class-notify"
- extendedWaitUntil:
    visible:
      id: "class-notify-search"
    timeout: 15000
- tapOn:
    id: "class-notify-search"
- inputText: "Filler Player 02"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "notify-player-${output.pid}"
    timeout: 15000
- assertVisible:
    id: "notify-player-${output.pid}"
    text: ".*Alcunha M301.*"
- assertNotVisible:
    id: "notify-player-${output.pid}"
    text: ".*Filler Player 02.*"

# ── invite; the class screen's "Convidados" row reads the nickname too ──
- tapOn:
    id: "notify-player-${output.pid}"
- tapOn:
    id: "class-notify-send"
- runFlow:
    when:
      visible:
        id: "eligibility-confirm-proceed"
    commands:
      - tapOn:
          id: "eligibility-confirm-proceed"
- extendedWaitUntil:
    notVisible:
      id: "class-notify-dialog"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "invitee-row-${output.pid}"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "invitee-row-${output.pid}"
    text: ".*Alcunha M301.*"
