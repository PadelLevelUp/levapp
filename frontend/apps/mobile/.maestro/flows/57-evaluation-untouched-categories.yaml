# PAD-337 / evaluations.entries rule 6 — mirrors
# apps/web/e2e/evaluation-tools/evaluation-untouched-categories.spec.ts.
# (Flow number 57 is from Session E's reserved range, unconfirmed.)
#
# The evaluation form used to seed every category at its scale midpoint and
# post all of them on save, so saving without touching anything wrote a score
# the coach never gave. Now an untouched category submits nothing.
# - open E2E Student (seeded with no evaluations), open Add Evaluation
# - step the seeded category once → its reset control appears; reset → gone
# - save without a score → the Evaluations card is still empty
# NOTE: player-card-1 is deterministic (see 04-attendance.yaml). Asserts test
# ids only; the rendered copy differs between locales.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 15000
- tapOn:
    id: "players-search"
- inputText: "E2E Student"
- extendedWaitUntil:
    visible:
      id: "player-card-1"
    timeout: 20000
- tapOn:
    id: "player-card-1"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "player-evaluations-empty"
    direction: DOWN
    timeout: 30000

# ── Open the form: nothing is rated, so no reset control shows ──
- scrollUntilVisible:
    element:
      id: "player-add-evaluation"
    direction: UP
    timeout: 30000
- tapOn:
    id: "player-add-evaluation"
- extendedWaitUntil:
    visible:
      id: "add-evaluation-dialog"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "evaluation-score-value-.*"
    timeout: 15000
- assertNotVisible:
    id: "evaluation-score-reset-.*"

# ── Rate, then return to unrated ──
- tapOn: "Increase Forehand"
- extendedWaitUntil:
    visible:
      id: "evaluation-score-reset-.*"
    timeout: 5000
- tapOn:
    id: "evaluation-score-reset-.*"
- assertNotVisible:
    id: "evaluation-score-reset-.*"

# ── Save with nothing rated: no evaluation is written ──
- tapOn:
    id: "evaluation-save"
- extendedWaitUntil:
    notVisible:
      id: "add-evaluation-dialog"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "player-evaluations-empty"
    direction: DOWN
    timeout: 30000
