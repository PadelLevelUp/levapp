# PAD-337's guarantee, carried into the record form (PAD-374) — mirrors
# apps/web/e2e/evaluation-tools/evaluation-untouched-categories.spec.ts.
# (Flow number 57 is from Session E's reserved range.)
#
# The old dialog had a save button and once posted a midpoint for every category. The
# new form saves each input as it is made, so the guarantee reads: a category the coach
# rated and then cleared holds nothing, and finishing the form with nothing rated writes
# no evaluation.
# - open E2E Student's evaluations (the flow assumes no evaluation of theirs exists;
#   78-player-evaluations cleans up after itself), open "Nova avaliação"
# - step the seeded legacy category once → its clear control appears; clear → gone
# - finish with nothing rated → the history is still empty
# NOTE: player-card-1 is deterministic (see 04-attendance.yaml). Asserts test
# ids only; the rendered copy differs between locales.
appId: com.padellevelup.app
---
- runScript: ../scripts/evaluations-setup.js

- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 15000
- tapOn:
    id: "players-search"
- inputText: "E2E Student"
- extendedWaitUntil:
    visible:
      id: "player-card-1"
    timeout: 20000
- tapOn:
    id: "player-card-1"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "player-evaluations-open"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "player-evaluations-open"
- extendedWaitUntil:
    visible:
      id: "player-evaluations"
    timeout: 15000
- assertVisible:
    id: "evaluation-history-empty"

# ── Open the form: nothing is rated, so no clear control shows ──
- tapOn:
    id: "evaluation-new"
- extendedWaitUntil:
    visible:
      id: "evaluation-form"
    timeout: 15000
- assertVisible:
    id: "evaluation-stepper-.*-value-none"
- assertNotVisible:
    id: "evaluation-stepper-.*-clear"

# ── Rate, then return to unrated ──
- tapOn:
    id: "evaluation-stepper-.*-plus"
- extendedWaitUntil:
    visible:
      id: "evaluation-stepper-.*-clear"
    timeout: 5000
# The SERVER saw the "+": one record, one rating at the scale's middle (6/10). The step is one
# input after ~400 ms of quiet, so wait for the row rather than read at once.
- extendedWaitUntil:
    visible:
      id: "evaluation-stepper-.*-value-6"
    timeout: 5000
- evalScript: "${output.afterPlus = json(http.get(output.api + '/api/app/player/' + output.evalPlayerId + '/evaluations', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).records}"
- assertTrue: "${output.afterPlus.length === 1 && output.afterPlus[0].ratings.length === 1 && output.afterPlus[0].ratings[0].score === 6}"
- tapOn:
    id: "evaluation-stepper-.*-clear"
- extendedWaitUntil:
    visible:
      id: "evaluation-stepper-.*-value-none"
    timeout: 5000
- assertNotVisible:
    id: "evaluation-stepper-.*-clear"
# The SERVER saw the clear too (PAD-337 on iOS): the emptied record is gone.
- evalScript: "${output.afterClear = json(http.get(output.api + '/api/app/player/' + output.evalPlayerId + '/evaluations', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).records}"
- assertTrue: "${output.afterClear.length === 0}"

# ── Finish with nothing rated: no evaluation is written ──
- scrollUntilVisible:
    element:
      id: "evaluation-finish"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "evaluation-finish"
- extendedWaitUntil:
    notVisible:
      id: "evaluation-form"
    timeout: 15000
- assertVisible:
    id: "evaluation-history-empty"
- evalScript: "${output.atEnd = json(http.get(output.api + '/api/app/player/' + output.evalPlayerId + '/evaluations', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body)}"
- assertTrue: "${output.atEnd.records.length === 0 && output.atEnd.lastEvaluatedOn === null}"
