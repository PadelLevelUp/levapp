# players.join-token (PAD-212) — the coach's Add by QR sheet, then a student
# redeeming the link via the /join/coach/<token> route.
#
# The token cannot be read back out of the QR by Maestro, so this flow checks
# the coach side (sheet renders a link, rotate works) and the student side's
# paste path on the Connect screen with an obviously invalid link (the
# invalid state). The full redeem is covered by the web spec join-by-qr.spec.ts.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "screen-players"
    timeout: 15000
- tapOn:
    id: "players-add-by-qr"
- assertVisible:
    id: "add-by-qr-sheet"
# PAD-269: only the token's hash is stored, so with a live code the sheet offers a
# new one instead of showing it again (players.join-token rule 7).
- runFlow:
    when:
      visible:
        id: "add-by-qr-live"
    commands:
      - tapOn:
          id: "add-by-qr-new"
- extendedWaitUntil:
    visible:
      id: "add-by-qr-url"
    timeout: 10000
- tapOn:
    id: "add-by-qr-rotate"
- tapOn:
    id: "add-by-qr-rotate-confirm"
- assertVisible:
    id: "add-by-qr-url"
- tapOn:
    id: "add-by-qr-close"
# Reopening with a live code says until when it works and offers a new code.
- tapOn:
    id: "players-add-by-qr"
- extendedWaitUntil:
    visible:
      id: "add-by-qr-live"
    timeout: 10000
- assertNotVisible:
    id: "add-by-qr-url"
- tapOn:
    id: "add-by-qr-new"
- extendedWaitUntil:
    visible:
      id: "add-by-qr-url"
    timeout: 10000
- tapOn:
    id: "add-by-qr-close"
# Student side: the Connect screen rejects something that is not a coach link.
- runFlow: ../subflows/login-student.yaml
- openLink: levelup://connect
- assertVisible:
    id: "connect-with-coach"
- tapOn:
    id: "connect-paste-input"
- inputText: "not a link"
- tapOn:
    id: "connect-paste-go"
- assertVisible:
    id: "connect-paste-error"
