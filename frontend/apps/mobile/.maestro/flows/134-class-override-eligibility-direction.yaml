# PAD-481 / eligibility.rules rule 6 — the per-class override has the direction too (iOS).
# The class "Maestro PAD-481 Override" carries its own bar, within_n_of_class N=1 (both ways).
# The coach edits the class, picks "only above" on the override and saves: the server holds
# within_n_above_class on the class with N kept, and the screen reads "above" once saved.
#
# Setup and teardown through the API (R-040): the class is added with no students (so no
# eligibility warning) and its override set through /api/app/edit_class; pad481-class-clear.js
# removes it before and after, even when a step fails. A one-off class asks no scope.
# Assertions by testID and server values only (the direction is read from the wrapper's testID
# eligibility-direction-is-<both|above|below>). Flow number 134 is from Session-D's reserved
# block (133–135, coordinator).
appId: com.padellevelup.app
onFlowStart:
  - runScript: ../scripts/pad481-class-clear.js
onFlowComplete:
  - runScript: ../scripts/pad481-class-clear.js
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.fmt = function (d) { var m = d.getMonth() + 1, day = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' + m : '' + m) + '-' + (day < 10 ? '0' + day : '' + day); }}"
- evalScript: "${output.day = output.fmt(new Date(Date.now() + 2 * 86400000))}"
- evalScript: "${output.title = 'Maestro PAD-481 Override'}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.auth = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }}"
- evalScript: "${output.findEvent = function () { var evs = json(http.get(output.api + '/api/app/calendar?from=' + output.day + 'T00:00:00&to=' + output.day + 'T23:59:59', { headers: output.auth }).body); return evs.filter(function (e) { return e.type === 'class' && e.title === output.title; })[0]; }}"
- evalScript: "${output.readRules = function () { var e = output.findEvent(); return json(http.post(output.api + '/api/app/class_instance?model=' + e.model + '&id=' + e.originalId + '&date=' + output.day, { headers: output.auth, body: '{}' }).body).eligibilityRules; }}"
- evalScript: "${output.added = http.post(output.api + '/api/app/add_class', { headers: output.auth, body: JSON.stringify({ name: output.title, classType: 'academy', date: output.day, startTime: '19:00', endTime: '20:00', maxPlayers: 4, playerIds: [], isRecurring: false }) }).ok}"
- assertTrue: "${output.added == true}"
- evalScript: "${output.overridden = http.post(output.api + '/api/app/edit_class', { headers: output.auth, body: JSON.stringify({ event: output.findEvent(), scope: 'single', updates: { eligibilityRules: [{ attribute: 'level', operation: 'within_n_of_class', value: 1 }] } }) }).ok}"
- assertTrue: "${output.overridden == true}"
- assertTrue: "${output.readRules()[0].operation === 'within_n_of_class'}"
# ── The coach opens the class (flow 110's walk) ──
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-calendar"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 15000
- tapOn:
    id: "calendar-view-week"
- extendedWaitUntil:
    visible:
      id: "calendar-today"
    timeout: 10000
- tapOn:
    id: "calendar-today"
- waitForAnimationToEnd
- tapOn:
    id: "calendar-view-day"
- extendedWaitUntil:
    visible:
      id: "calendar-next-week"
    timeout: 10000
- repeat:
    times: 2
    while:
      notVisible:
        id: "calendar-day-${output.day}"
    commands:
      - tapOn:
          id: "calendar-next-week"
      - waitForAnimationToEnd
- tapOn:
    id: "calendar-day-${output.day}"
- extendedWaitUntil:
    visible:
      text: "${output.title}"
    timeout: 15000
- tapOn: "${output.title}"
- extendedWaitUntil:
    visible:
      id: "class-detail"
    timeout: 20000

# ── Edit; the override is custom, so its editor shows the direction ──
- scrollUntilVisible:
    element:
      id: "class-edit"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "class-edit"
- scrollUntilVisible:
    element:
      id: "eligibility-direction"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "eligibility-direction-is-both"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "eligibility-direction"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      - tapOn:
          id: "eligibility-direction-above"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: "eligibility-direction-is-above"
          timeout: 5000

# ── Save; answer the eligibility warning if one shows ──
- scrollUntilVisible:
    element:
      id: "class-edit-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "class-edit-save"
- extendedWaitUntil:
    visible:
      id: "eligibility-confirm-proceed"
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible:
        id: "eligibility-confirm-proceed"
    commands:
      - tapOn:
          id: "eligibility-confirm-proceed"
- extendedWaitUntil:
    visible:
      id: "class-edit"
    timeout: 20000

# ── The server holds the one-way override, N kept ──
- evalScript: "${output.r = output.readRules()[0]}"
- assertTrue: "${output.r.operation === 'within_n_above_class' && output.r.value == 1}"

# ── Leave; onFlowComplete removes the class ──
- tapOn:
    id: "class-detail-back"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 15000
- runFlow: ../subflows/logout.yaml
