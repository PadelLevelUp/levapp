# PAD-506 (settings.explicit-save): replaces the PAD-473 save-sign flow (the sign is gone). Choosing "1-10"
# in "Escala de avaliações" is HELD: the server still holds 5 after the tap; tapping
# `settings-preferences-save` ("Guardar alterações") sends it and the server then holds 10. By id and by
# the server's own answers, never rendered copy. `onFlowComplete` puts the scale back to 5 (R-040).
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.restore = (typeof output.coachTok === 'undefined') ? false : http.put(output.api + '/api/app/evaluation_scale', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ scaleMax: 5 }) }).ok}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.reset = http.put(output.api + '/api/app/evaluation_scale', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ scaleMax: 5 }) }).ok}"
- assertTrue: "${output.reset == true}"

- runFlow: ../subflows/login-coach.yaml

- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-preferences"
- scrollUntilVisible:
    element:
      id: "settings-evaluation-scale-option-10"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-evaluation-scale-option-10"
# Held: nothing reached the server yet (a short wait, then read it back).
- extendedWaitUntil:
    visible:
      id: "b506-never-present"
    timeout: 2000
    optional: true
- evalScript: "${output.held = json(http.get(output.api + '/api/app/evaluation_scale', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).scaleMax}"
- assertTrue: "${output.held == 5}"
- scrollUntilVisible:
    element:
      id: "settings-preferences-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-preferences-save"
- retry:
    maxRetries: 5
    commands:
      - extendedWaitUntil:
          visible:
            id: "b506-never-present"
          timeout: 2000
          optional: true
      - evalScript: "${output.scale = json(http.get(output.api + '/api/app/evaluation_scale', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).scaleMax}"
      - assertTrue: "${output.scale == 10}"
