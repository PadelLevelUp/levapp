# PAD-547 — calendar.event-detail rules 19–20 on iOS: the coach's class screen shows the class's
# waiting list with each row's origin, removes a row, and adds a student for this class only.
# Seeded through the API (R-040): a class three days out with "E2E Student" enrolled and
# "Filler Player 01" put on its list by the coach (which also materialises the occurrence); the
# class is opened by its instance id (PAD-326 deep link). Driven and asserted by ids carrying the
# origin, never by rendered English (PAD-320). Flow number 170 is from 0710-SessionB's reserved
# block (unconfirmed).
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.cleanup && output.cleanup()}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.auth = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }}"
- evalScript: "${output.players = (function (r) { return r.items ? r.items : r; })(json(http.get(output.api + '/api/app/coach_players', { headers: output.auth }).body))}"
- evalScript: "${output.find = function (n) { return output.players.filter(function (p) { return p.name === n; })[0]; }}"
- evalScript: "${output.enrolled = output.find('E2E Student')}"
- evalScript: "${output.filler = output.find('Filler Player 01')}"
- evalScript: "${output.two = output.find('E2E Student Two')}"
- assertTrue: "${output.enrolled != null && output.filler != null && output.two != null}"
- evalScript: "${output.day = (function (d) { var m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' + m : '' + m) + '-' + (x < 10 ? '0' + x : '' + x); })(new Date(Date.now() + 3 * 86400000))}"
- evalScript: "${output.made = json(http.post(output.api + '/api/app/add_class', { headers: output.auth, body: JSON.stringify({ name: 'E2E Class Waiting List iOS', classType: 'academy', maxPlayers: 4, levelId: output.enrolled.levelId, date: output.day, startTime: '17:00', endTime: '18:00', playerIds: [output.enrolled.playerId], isRecurring: false, notificationsEnabled: true }) }).body)}"
- evalScript: "${output.cleanup = function () { http.post(output.api + '/api/app/remove_class', { headers: output.auth, body: JSON.stringify({ event: { model: output.made.model || 'Lesson', originalId: output.made.originalId, date: output.day }, scope: 'single' }) }); }}"
- evalScript: "${output.added = json(http.post(output.api + '/api/app/notify/class_waiting_list', { headers: output.auth, body: JSON.stringify({ model: output.made.model || 'Lesson', originalId: output.made.originalId, date: output.day, playerId: output.filler.playerId, scope: 'occurrence' }) }).body).action}"
- assertTrue: "${output.added === 'added'}"
- evalScript: "${output.instanceId = json(http.get(output.api + '/api/app/calendar?from=' + output.day + 'T00:00:00&to=' + output.day + 'T23:59:59', { headers: output.auth }).body).filter(function (e) { return e.title === 'E2E Class Waiting List iOS' && e.model === 'LessonInstance'; })[0].originalId}"
- assertTrue: "${output.instanceId > 0}"

- runFlow: ../subflows/login-coach.yaml
- openLink: "levelup://class/${output.instanceId}"
- scrollUntilVisible:
    element:
      id: "class-waiting-list-toggle"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "class-waiting-list-row-${output.filler.playerId}-coach"

# ── rule 21: remove ──
- tapOn:
    id: "class-waiting-list-remove-${output.filler.playerId}"
- extendedWaitUntil:
    notVisible:
      id: "class-waiting-list-row-${output.filler.playerId}-coach"
    timeout: 15000

# ── rule 20: add for this class only ──
- tapOn:
    id: "class-waiting-list-add"
# The picker lists the roster in a 360pt scroll box; "E2E Student Two" is its last row. iOS
# reports a clipped row as visible, so swipe the box to its end before tapping (2026-10-08).
- extendedWaitUntil:
    visible:
      id: "class-waiting-list-dialog"
    timeout: 15000
- repeat:
    times: 6
    commands:
      - swipe:
          start: "50%, 55%"
          end: "50%, 27%"
          duration: 300
- assertNotVisible:
    id: "class-waiting-list-candidate-${output.enrolled.playerId}"
- tapOn:
    id: "class-waiting-list-candidate-${output.two.playerId}"
- tapOn:
    id: "class-waiting-list-scope-occurrence"
- tapOn:
    id: "class-waiting-list-confirm"
- extendedWaitUntil:
    visible:
      id: "class-waiting-list-row-${output.two.playerId}-coach"
    timeout: 15000
