# confirmed — Session-C, iPhone 17 Pro simulator, fix/b242-custom-frequency @ dae954372, 2026-10-02 08:26Z and 08:31Z: green ×2; red on staging 439ae2088 at afterBackground == 7 (2026-10-01)
# B-242 / PAD-473 / evaluations.reminders rule 1 — a number typed into "Personalizado" is saved
# however the coach leaves, not only when the field blurs. The field uses the number pad, which
# has no Return key, so before the fix a number typed and then left behind by sending the app to
# the background, or by following a link (a notification tap), never reached the server.
#
# Each half types a number, proves it is in the field (`copyTextFrom`), leaves WITHOUT tapping
# outside the field, and reads the stored value back through the API. `onFlowComplete` PUTs
# `{"reminder":"never"}` so no later flow inherits a frequency (R-040).
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.restore = (typeof output.coachTok === 'undefined') ? false : http.put(output.api + '/api/app/evaluation_settings', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ reminder: 'never' }) }).ok}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.reset = http.put(output.api + '/api/app/evaluation_settings', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ reminder: 'never' }) }).ok}"
- assertTrue: "${output.reset == true}"

- runFlow: ../subflows/login-coach.yaml

# ── Half 1: type 7, send the app to the background ──
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-preferences"
- scrollUntilVisible:
    element:
      id: "settings-evaluation-reminder"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-evaluation-reminder-option-custom"
- extendedWaitUntil:
    visible:
      id: "settings-evaluation-reminder-n"
    timeout: 10000
- tapOn:
    id: "settings-evaluation-reminder-n"
- eraseText: 4
- inputText: "7"
- copyTextFrom:
    id: "settings-evaluation-reminder-n"
- assertTrue: "${maestro.copiedText == '7'}"
- pressKey: Home
- launchApp:
    stopApp: false
- evalScript: "${output.afterBackground = json(http.get(output.api + '/api/app/evaluation_settings', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).everyN}"
- assertTrue: "${output.afterBackground == 7}"

# ── Half 2: type 9, follow a link away ──
- tapOn:
    id: "settings-evaluation-reminder-n"
- eraseText: 4
- inputText: "9"
- copyTextFrom:
    id: "settings-evaluation-reminder-n"
- assertTrue: "${maestro.copiedText == '9'}"
- openLink: levelup://players
- extendedWaitUntil:
    visible:
      id: "screen-players"
    timeout: 15000
# The link may leave Preferences mounted under the pushed screen; then the number goes out
# when its short save delay (600 ms) runs out. Wait 1 s (an id that never appears, optional).
- extendedWaitUntil:
    visible:
      id: "b242-never-present"
    timeout: 1000
    optional: true
- evalScript: "${output.afterLink = json(http.get(output.api + '/api/app/evaluation_settings', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).everyN}"
- assertTrue: "${output.afterLink == 9}"
