# PAD-506 (settings.explicit-save): a held custom number is NOT sent by leaving the foreground or by
# following a link — only `settings-preferences-save` sends it (this replaces B-242 / PAD-473's "the
# number is saved when the app goes to the background", which is gone). Type 7, send the app to the
# background and back: the server still holds the old value and the field still shows 7; tap Save: the
# server holds 7. Then type 9, follow a link away and come back to Preferences: the server still holds 7
# (the leave sent nothing); the field is reloaded from the server.
# `onFlowComplete` PUTs `{"reminder":"never"}` so no later flow inherits a frequency (R-040).
# (before PAD-506) confirmed — Session-C, iPhone 17 Pro simulator, feature/pad-473 @ f5d3fd425, 2026-10-02 12:22Z.
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.restore = (typeof output.coachTok === 'undefined') ? false : http.put(output.api + '/api/app/evaluation_settings', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ reminder: 'never' }) }).ok}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.reset = http.put(output.api + '/api/app/evaluation_settings', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ reminder: 'never' }) }).ok}"
- assertTrue: "${output.reset == true}"

- runFlow: ../subflows/login-coach.yaml

# ── Half 1: type 7, background the app: nothing is sent; Save sends it ──
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-preferences"
- scrollUntilVisible:
    element:
      id: "settings-evaluation-reminder"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-evaluation-reminder-option-custom"
- extendedWaitUntil:
    visible:
      id: "settings-evaluation-reminder-n"
    timeout: 10000
- evalScript: "${output.everyNBefore = json(http.get(output.api + '/api/app/evaluation_settings', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).everyN}"
- tapOn:
    id: "settings-evaluation-reminder-n"
- eraseText: 4
- inputText: "7"
- pressKey: Home
- launchApp:
    stopApp: false
# Give a (wrongly) sent value time to land, then read: it must still be the old one.
- extendedWaitUntil:
    visible:
      id: "b506-never-present"
    timeout: 3000
    optional: true
- evalScript: "${output.afterBackground = json(http.get(output.api + '/api/app/evaluation_settings', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).everyN}"
- assertTrue: "${output.afterBackground == output.everyNBefore}"
# The field still shows what the coach typed.
- copyTextFrom:
    id: "settings-evaluation-reminder-n"
- assertTrue: "${maestro.copiedText == '7'}"
- scrollUntilVisible:
    element:
      id: "settings-preferences-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-preferences-save"
- retry:
    maxRetries: 5
    commands:
      - extendedWaitUntil:
          visible:
            id: "b506-never-present"
          timeout: 2000
          optional: true
      - evalScript: "${output.afterSave = json(http.get(output.api + '/api/app/evaluation_settings', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).everyN}"
      - assertTrue: "${output.afterSave == 7}"

# ── Half 2: type 9, follow a link away: nothing is sent ──
- tapOn:
    id: "settings-evaluation-reminder-n"
- eraseText: 4
- inputText: "9"
- openLink: levelup://players
- extendedWaitUntil:
    visible:
      id: "screen-players"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "b506-never-present"
    timeout: 2000
    optional: true
- evalScript: "${output.afterLink = json(http.get(output.api + '/api/app/evaluation_settings', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).everyN}"
- assertTrue: "${output.afterLink == 7}"
