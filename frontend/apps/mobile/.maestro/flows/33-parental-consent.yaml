# PAD-198 — auth.parental-consent. A 10-year-old in Portugal signs up on the
# phone: the form asks for a guardian's email, the account gets no session and
# the "waiting for your guardian" card shows; signing in before consent shows
# the same card. The guardian's consent is given through the API with the
# token read from the flag-gated debug route (the consent page itself is
# web-only: the guardian arrives from an email); the minor then signs in and
# lands on the email code screen.
#
# Mirrors: apps/web/e2e/auth-onboarding/parental-consent.spec.ts
appId: com.padellevelup.app
---
# The backend the debug calls hit: Maestro -e API_BASE=http://localhost:<port> for an
# isolated backend; the shared test backend on :5001 otherwise.
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- launchApp:
    clearState: true
- evalScript: ${output.stamp = String(Date.now())}
- evalScript: ${output.year = String(new Date().getFullYear() - 10)}
- evalScript: ${output.username = 'maestro-minor-' + output.stamp}
- evalScript: ${output.guardian = 'g-' + output.username + '@example.com'}
- extendedWaitUntil:
    visible:
      id: "login-create-account"
    timeout: 25000
- tapOn:
    id: "login-create-account"
- extendedWaitUntil:
    visible:
      id: "screen-signup"
    timeout: 15000
- tapOn:
    id: "signup-role-student"
- tapOn:
    id: "signup-name"
- inputText: "Maestro Minor"
- tapOn:
    id: "signup-username"
- inputText: ${output.username}
# PAD-198: Next moves focus down the form and scrolls the field into view. A field
# under the keyboard still counts as visible, so tapping it would hit the keyboard.
- pressKey: Enter
- inputText: ${output.username + '@example.com'}
- pressKey: Enter
- inputText: "Segura1234"
- pressKey: Enter
- inputText: "Segura1234"
- pressKey: Enter
- inputText: ${'0101' + output.year}
# The number pad closes itself once the date is complete.
- assertVisible:
    id: "signup-birthDate"
    text: "${'01/01/' + output.year}"
- scrollUntilVisible:
    element:
      id: "signup-guardianEmail"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "signup-guardianEmail"
- inputText: ${output.guardian}
# Done on the guardian email closes the keyboard.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "signup-submit"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "signup-submit"
- extendedWaitUntil:
    visible:
      id: "guardian-pending"
    timeout: 25000

# ── Signing in before consent shows the same card ──
- tapOn:
    id: "guardian-pending-back"
- extendedWaitUntil:
    visible:
      id: "login-username"
    timeout: 15000
- tapOn:
    id: "login-username"
- eraseText: 40
- inputText: ${output.username}
- tapOn:
    id: "login-password"
- eraseText: 40
- inputText: "Segura1234"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "guardian-pending"
    timeout: 15000

# ── The guardian consents (web-only page; driven through the API here) ──
- evalScript: ${output.token = json(http.get(output.api + '/api/auth/guardian-consent/debug/last-link?email=' + output.guardian).body).consentToken}
- evalScript: "${output.consented = http.post(output.api + '/api/auth/guardian-consent/' + output.token, { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ guardianName: 'Maestro Guardian', relationship: 'parent', confirmMinorDetails: true, acceptTerms: true }) }).ok}"

# ── The minor gets in, to the email code screen first ──
- tapOn:
    id: "guardian-pending-back"
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 15000
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "verify-email"
    timeout: 25000
