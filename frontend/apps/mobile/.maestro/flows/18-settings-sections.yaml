# New flow: smoke-checks the new coach-only Settings sections (Phase 6+7 —
# Club + auto-invite toggle). Read-only on purpose:
# - club-invite is only asserted visible, never tapped (would send a real
#   coach invite).
# - settings-auto-invite-toggle is only asserted visible, never flipped
#   (the seeded notification config's autoNotifyEnabled is relied on by
#   other flows/tests — see useAutoInviteEnabled gating class/[id].tsx's
#   auto-notifications card).
# NOTE: settings.tsx has no tab navigation (memory notes about a tabbed
# SettingsPage describe the WEB app) — it's a single scrollable column, so
# these sections just need scrolling into view, not a tab switch.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-more"
- tapOn:
    id: "more-settings"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000

# ── Club section renders (seeded coach belongs to "E2E Club") ──
- scrollUntilVisible:
    element:
      id: "settings-club"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "club-invite"

# ── Auto-invite toggle renders ──
- scrollUntilVisible:
    element:
      id: "settings-auto-invite-toggle"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "settings-auto-invite-toggle"
