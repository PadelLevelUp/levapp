# PAD-357 — settings.coach-working-hours rule 2, "Invalid hours are refused by the
# server": a day the server refuses shows the error naming that day, not a
# success, and nothing is stored. Closes the iOS gap #338 left ("Not run").
#
# Mirrors: apps/web/e2e/settings/coach-working-hours.spec.ts (the refused save).
#
# Making the invalid day (PAD-361): no button can any more — "add window" always
# gives a day the server accepts (rule 5, flow 87). So Monday is split by "add
# window" into 08:00–13:00 and 14:00–22:00, and the morning window's END is pushed
# later on the hour wheel until it runs into the afternoon window. This does not
# need the precision flows 13 and 69 avoid: from 13:00 any end from 15:00 to 23:00
# overlaps, and 00:00 to 08:00 ends before it starts — 18 of the wheel's 24 hours.
# Two swipes of about three rows each land near 19:00 (measured 2026-09-21: one
# swipe took 13:00 to 16:00 on the iPhone 17 Pro).
#
# ios-only: Android shows the platform's clock dialog, which a swipe does not drive.
# The Android lane excludes the tag (README, "Android lane").
#
# The seeded coach starts with no working hours. A first API step clears any left
# by an earlier failed run; the flow stores nothing, and the last step proves it.
# iOS carries the refused day in the id: working-hours-error-<key>.
# Backend: -e API_BASE=http://localhost:<port>, else :5001. Order: not load bearing.
# Flow number 85 is from Session D's range (2026-09-21 wave).
appId: com.padellevelup.app
tags:
  - ios-only
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.reset = http.put(output.api + '/api/app/coach/working-hours', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ workingHours: null }) }).ok}"
- assertTrue: "${output.reset == true}"

- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "settings-nav-calendar"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-nav-calendar"
- scrollUntilVisible:
    element:
      id: "working-hours-default"
    direction: DOWN
    timeout: 30000

# ── Monday splits in two, then the morning runs into the afternoon ──
- scrollUntilVisible:
    element:
      id: "working-hours-add-mon"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "working-hours-add-mon"
- scrollUntilVisible:
    element:
      id: "working-hours-mon-0-end"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "working-hours-mon-0-end"
- extendedWaitUntil:
    visible:
      id: "working-hours-mon-0-end-confirm"
    timeout: 10000
# The hour wheel is the dialog's left column; its selected row sits mid-dialog.
- swipe:
    start: "31%,50%"
    end: "31%,36%"
    duration: 500
- swipe:
    start: "31%,50%"
    end: "31%,36%"
    duration: 500
- tapOn:
    id: "working-hours-mon-0-end-confirm"

# ── Save: refused, the error names Monday ──
- scrollUntilVisible:
    element:
      id: "working-hours-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "working-hours-save"
- extendedWaitUntil:
    visible:
      id: "working-hours-error-mon"
    timeout: 15000

# Not a success: the card never reached "set" (Clear only renders when set), and
# the server still holds nothing.
- assertNotVisible:
    id: "working-hours-clear"
- evalScript: "${output.stored = json(http.get(output.api + '/api/app/coach/working-hours', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).workingHours}"
- assertTrue: "${output.stored === null}"
