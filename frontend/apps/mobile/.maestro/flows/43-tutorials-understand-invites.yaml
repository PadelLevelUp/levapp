# PAD-196 — Settings › Tutorials › "Understand invites" (settings.tutorials).
# Mirrors: apps/web/e2e/settings/tutorials-understand-invites.spec.ts
#   US-196-01 (coach sees Tutorials) and US-196-02 (class → player → rounds).
#
# The tutorial is a rehearsal of the invitation engine and creates nothing. PAD-816: the class it
# previews is the flow's own (scripts/tutorial-class-setup.js, 4 days out), created and removed by
# the hooks below, not the seed's next-Monday "E2E Academy Class": on a Sunday that one is inside
# the invitation window, the engine fills its maxTotal, and the rehearsal shows no first batch.
#
# Pickers are Pressable rows with testIDs (an @rn-primitives Select's portal
# is invisible to the iOS accessibility tree — see 08-set-player-level.skipped),
# so every step below taps an id or a visible label, never a coordinate.
#
# The badge at the end is asserted by its status id
# (tutorial-send-status-first_batch), not its rendered English text (PAD-320).
appId: com.padellevelup.app
onFlowStart:
  - runScript: ../scripts/tutorial-class-setup.js
onFlowComplete:
  - runScript: ../scripts/tutorial-class-teardown.js
---
- runFlow: ../subflows/login-coach.yaml
# PAD-193: Settings is off the bottom bar — the account avatar in the
# header (`header-account`) pushes it onto the root stack.
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000

# ── Tutorials row is offered to the coach ──
- scrollUntilVisible:
    element:
      id: "settings-nav-tutorials"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-nav-tutorials"
- assertVisible:
    id: "settings-tutorials"

# ── Open "Understand invites" ──
- tapOn:
    id: "tutorial-understand-invites"
- extendedWaitUntil:
    visible:
      id: "tutorial-understand-invites-screen"
    timeout: 15000

# ── Step 1: the flow's class ──
- scrollUntilVisible:
    element:
      text: "E2E Tutorial Class"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "E2E Tutorial Class"

# ── Step 2: the enrolled student ──
- extendedWaitUntil:
    visible:
      text: "E2E Student"
    timeout: 15000
# Centred first: the chip sits at the bottom edge after the class list, where the tap can miss it.
- scrollUntilVisible:
    element:
      text: "E2E Student"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "E2E Student"

# ── Step 3: results — rounds with a first-batch badge ──
# No wait on `tutorial-results` itself: the section (every round and its
# candidates) is taller than the screen, so it is never 100% visible and both
# an in-place wait and a scroll to it fail — the in-place wait failed on
# origin/staging 80a377091 (2026-09-16 21:36Z). Round 1 below proves the
# results rendered.
# PAD-566 (settings.tutorials rule 4.4): the spot line says why its side, from the engine's own
# counts; it sits above round 1, so it is reached first.
- scrollUntilVisible:
    element:
      id: "tutorial-spot-side-reason"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "tutorial-spot-side-reason"
# PAD-825 (rule 4.4): under it, the roster the projection is built from (going and open spots).
- scrollUntilVisible:
    element:
      id: "tutorial-spot-side-roster"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "tutorial-spot-side-roster"
- scrollUntilVisible:
    element:
      id: "tutorial-round-1"
    direction: DOWN
    timeout: 30000
# PAD-710 (Android lane): the first-batch badge sits in a later round, below a clipped round-1 card, so the round-1 scroll above does not reach it (nightlies 6-13 Nov, run 42203817602); scroll to the badge itself.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: "tutorial-send-status-first_batch"
          direction: DOWN
          timeout: 30000
          centerElement: true
- assertVisible:
    id: "tutorial-send-status-first_batch"
