# PAD-139 — auth.password-recovery. From the login screen, "Forgot your
# password?" asks for the account email, the flag-gated backend captures the
# recovery mail, `/api/auth/email-verification/debug/last-code?email=` hands the
# 6-digit code back, and the code plus a new password signs the coach in.
#
# Mirrors: apps/web/e2e/auth-onboarding/password-recovery.spec.ts
# - the coach recovers with a new password and lands on the dashboard
# - the seeded password is put back (through the same flow) so 01-login and
#   every later flow still sign in
appId: com.padellevelup.app
# PAD-710 (Android lane): the first half leaves e2e-coach on E2eCoachNew123! until the second half
# restores it, so a failure between them made every later login 401 (36-android-evidence did). This
# puts the seeded password back through the API whatever happened: if the NEW password still logs
# in, recover back to the seeded one (request, read the captured code, confirm). When the seeded
# password is already in place the login fails and the whole block is skipped.
onFlowComplete:
  - evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
  - evalScript: "${output.coachStillNew = http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoachNew123!' }) }).ok}"
  - runFlow:
      when:
        true: ${output.coachStillNew}
      commands:
        - evalScript: "${output.sent = http.post(output.api + '/api/auth/password-recovery/request', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: 'e2e-coach@test.com' }) }).ok}"
        - evalScript: "${output.restoreCode = json(http.get(output.api + '/api/auth/email-verification/debug/last-code?email=e2e-coach@test.com').body).code}"
        - evalScript: "${output.restored = http.post(output.api + '/api/auth/password-recovery/confirm', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: 'e2e-coach@test.com', code: output.restoreCode, newPassword: 'E2eCoach123!' }) }).ok}"
---
# PAD-758: the debug-code reads go through output.api like onFlowComplete's, so an iOS run with
# -e API_BASE=http://localhost:<port> reaches its own backend; unset, it stays :5001 (the Android lane).
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
# Same prelude as subflows/login.yaml: relaunch without clearState, and if a
# previous flow left someone signed in, log out through the UI.
- retry:
    maxRetries: 3
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: "tab-dashboard"
          timeout: 20000
          optional: true
      - runFlow:
          when:
            visible:
              id: "tab-dashboard"
          file: ../subflows/logout.yaml
      - extendedWaitUntil:
          visible:
            id: "login-forgot-password"
          timeout: 30000
- waitForAnimationToEnd

# ── Recover with a new password ──
- tapOn:
    id: "login-forgot-password"
- extendedWaitUntil:
    visible:
      id: "screen-forgot-password"
    timeout: 15000
- tapOn:
    id: "recovery-email"
- inputText: "e2e-coach@test.com"
- hideKeyboard
- tapOn:
    id: "recovery-send"
- extendedWaitUntil:
    visible:
      id: "recovery-code-step"
    timeout: 15000
- evalScript: ${output.code = json(http.get(output.api + '/api/auth/email-verification/debug/last-code?email=e2e-coach@test.com').body).code}
# PAD-758: tap the cells the code input covers (iOS leaves the input itself out of the
# hierarchy); the tap lands on the input and focuses it on both platforms.
- tapOn:
    id: "recovery-code-cells"
- inputText: ${output.code}
- tapOn:
    id: "recovery-password"
- inputText: "E2eCoachNew123!"
- hideKeyboard
- tapOn:
    id: "recovery-submit"
- extendedWaitUntil:
    visible:
      id: "screen-dashboard"
    timeout: 25000
# PAD-717 (B-602): the evidence that recovery lands on a drawn dashboard, not a blank window.
- takeScreenshot: 28-after-recovery-dashboard

# ── Put the seeded password back the same way ──
- runFlow: ../subflows/logout.yaml
- extendedWaitUntil:
    visible:
      id: "login-forgot-password"
    timeout: 25000
- tapOn:
    id: "login-forgot-password"
- extendedWaitUntil:
    visible:
      id: "screen-forgot-password"
    timeout: 15000
- tapOn:
    id: "recovery-email"
- inputText: "e2e-coach@test.com"
- hideKeyboard
- tapOn:
    id: "recovery-send"
- extendedWaitUntil:
    visible:
      id: "recovery-code-step"
    timeout: 15000
- evalScript: ${output.code = json(http.get(output.api + '/api/auth/email-verification/debug/last-code?email=e2e-coach@test.com').body).code}
# PAD-758: tap the cells the code input covers (iOS leaves the input itself out of the
# hierarchy); the tap lands on the input and focuses it on both platforms.
- tapOn:
    id: "recovery-code-cells"
- inputText: ${output.code}
- tapOn:
    id: "recovery-password"
- inputText: "E2eCoach123!"
- hideKeyboard
- tapOn:
    id: "recovery-submit"
- extendedWaitUntil:
    visible:
      id: "screen-dashboard"
    timeout: 25000
- runFlow: ../subflows/logout.yaml
