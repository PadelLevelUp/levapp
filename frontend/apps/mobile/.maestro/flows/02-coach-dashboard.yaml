# Mirrors: apps/web/e2e/dashboard/coach-dashboard.spec.ts
# - the upcoming-classes list shows the seeded "E2E Academy Class"
# - the "this week" cards render with real values — each card's accessibility
#   label is "<label>: <value>" (the child Text nodes are not addressable on
#   either platform, so the value must live in the label)
#
# PAD-304: this flow used to assert four `dashboard-kpi-*` tiles. Those belong
# to the STUDENT dashboard (`KpiTiles`); the coach dashboard renders
# `WeekPulse`'s two cards instead, and the flow had been failing on BOTH
# platforms since that redesign, not just on Android.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
# Upcoming classes list shows the seeded class.
# Regex, not the bare title: on iOS the row is one accessible button and its
# child Text nodes collapse into the button's label ("MON 14 E2E Academy Class
# 10:00 …"), so an exact match finds nothing. Android exposes the title as its
# own node, which the same regex matches (PAD-304).
- scrollUntilVisible:
    element:
      text: ".*E2E Academy Class.*"
    direction: DOWN
    timeout: 30000
- assertVisible: ".*E2E Academy Class.*"
# The "this week" cards sit below the list on both platforms.
- scrollUntilVisible:
    element:
      id: "dashboard-week-pulse"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "dashboard-pulse-seats-filled"
    text: "Seats filled: [0-9]+%"
- assertVisible:
    id: "dashboard-pulse-active-players"
    text: "Active players: [0-9]+"
