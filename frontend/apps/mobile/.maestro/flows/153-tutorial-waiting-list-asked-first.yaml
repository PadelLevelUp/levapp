# PAD-446 — Settings › Tutorials › "Understand invites" shows the class's waiting list as ASKED
# FIRST (settings.tutorials rule 4.3; notifications.invite-simulation rule 8), not as placed.
# Same path as flow 43, on the same flow-owned class (PAD-816: scripts/tutorial-class-setup.js, 4 days
# out, created first so the entry fans out to it); the setup then puts "Filler Player 01" on the
# coach's standing waiting list, and the teardowns remove both.
#
# Asserted by ids, not rendered English (PAD-320). The block's header is a shared-locale string,
# so the iOS i18n static-import trap would show a raw key here — the id proves the block rendered,
# and the second assertion proves the student's row did.
appId: com.padellevelup.app
onFlowStart:
  - runScript: ../scripts/tutorial-class-setup.js
  - runScript: ../scripts/pad446-setup.js
onFlowComplete:
  - runScript: ../scripts/pad446-teardown.js
  - runScript: ../scripts/tutorial-class-teardown.js
---
- assertTrue: "${output.entryId > 0}"
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "settings-nav-tutorials"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-nav-tutorials"
- tapOn:
    id: "tutorial-understand-invites"
- extendedWaitUntil:
    visible:
      id: "tutorial-understand-invites-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "E2E Tutorial Class"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "E2E Tutorial Class"
- extendedWaitUntil:
    visible:
      text: "E2E Student"
    timeout: 15000
- tapOn:
    text: "E2E Student"

# ── the waiting list, asked first, with the student's own row ──
# PAD-710 (Android lane): on 8 Nov (run 42469410279) the swipe overshot to the page end and the block was above the screen; try DOWN once (optional), then UP, centred, so either side is reached.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: "tutorial-waiting-list"
          direction: DOWN
          timeout: 10000
          centerElement: true
          optional: true
      - scrollUntilVisible:
          element:
            id: "tutorial-waiting-list"
          direction: UP
          timeout: 20000
          centerElement: true
- scrollUntilVisible:
    element:
      id: "tutorial-waiting-list"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "tutorial-waiting-list-${output.playerId}"
- assertNotVisible:
    text: ".*tutorials\\.understandInvites.*"
