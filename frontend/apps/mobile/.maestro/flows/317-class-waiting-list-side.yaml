# PAD-803 — notifications.waiting-list rule 18a on iOS: the coach's add to a class's waiting list
# asks the side. "E2E Student Two" (seeded profile side left with e2e-coach) comes up with left
# pre-selected and tagged "Habitual"; the coach picks right instead, confirms, and the new row
# carries a side chip. Seeded through the API (R-040) like flow 170: a class three days out with
# "E2E Student" enrolled, opened by its instance id. Driven and asserted by ids, never by rendered
# copy (PAD-320). The stored value (right) is pinned by the backend test
# test_pad803_coach_picks_the_waiting_list_side.py.
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.cleanup && output.cleanup()}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.auth = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }}"
- evalScript: "${output.players = (function (r) { return r.items ? r.items : r; })(json(http.get(output.api + '/api/app/coach_players', { headers: output.auth }).body))}"
- evalScript: "${output.find = function (n) { return output.players.filter(function (p) { return p.name === n; })[0]; }}"
- evalScript: "${output.enrolled = output.find('E2E Student')}"
- evalScript: "${output.two = output.find('E2E Student Two')}"
- assertTrue: "${output.enrolled != null && output.two != null && output.find('Filler Player 01') != null}"
- evalScript: "${output.day = (function (d) { var m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' + m : '' + m) + '-' + (x < 10 ? '0' + x : '' + x); })(new Date(Date.now() + 3 * 86400000))}"
- evalScript: "${output.made = json(http.post(output.api + '/api/app/add_class', { headers: output.auth, body: JSON.stringify({ name: 'E2E Class Waiting List Side iOS', classType: 'academy', maxPlayers: 4, levelId: output.enrolled.levelId, date: output.day, startTime: '17:00', endTime: '18:00', playerIds: [output.enrolled.playerId], isRecurring: false, notificationsEnabled: true }) }).body)}"
- evalScript: "${output.cleanup = function () { http.post(output.api + '/api/app/remove_class', { headers: output.auth, body: JSON.stringify({ event: { model: output.made.model || 'Lesson', originalId: output.made.originalId, date: output.day }, scope: 'single' }) }); }}"
# The coach's API add of "Filler Player 01" materialises the occurrence, as in flow 170.
- evalScript: "${output.filler = output.find('Filler Player 01')}"
- evalScript: "${output.added = json(http.post(output.api + '/api/app/notify/class_waiting_list', { headers: output.auth, body: JSON.stringify({ model: output.made.model || 'Lesson', originalId: output.made.originalId, date: output.day, playerId: output.filler.playerId, scope: 'occurrence', side: 'right' }) }).body).action}"
- assertTrue: "${output.added === 'added'}"
- evalScript: "${output.instanceId = json(http.get(output.api + '/api/app/calendar?from=' + output.day + 'T00:00:00&to=' + output.day + 'T23:59:59', { headers: output.auth }).body).filter(function (e) { return e.title === 'E2E Class Waiting List Side iOS' && e.model === 'LessonInstance'; })[0].originalId}"
- assertTrue: "${output.instanceId > 0}"

- runFlow: ../subflows/login-coach.yaml
- openLink: "levelup://class/${output.instanceId}"
- scrollUntilVisible:
    element:
      id: "class-waiting-list-toggle"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "class-waiting-list-add"
- tapOn:
    id: "class-waiting-list-search"
# One word: the simulator keyboard can drop the space of "Student Two" (2026-11-03 run).
- inputText: "Two"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "class-waiting-list-candidate-${output.two.playerId}"
    timeout: 15000
- tapOn:
    id: "class-waiting-list-candidate-${output.two.playerId}"

# ── rule 18a: the profile side is pre-selected and tagged ──
- extendedWaitUntil:
    visible:
      id: "class-waiting-list-side"
    timeout: 15000
- assertVisible:
    id: "class-waiting-list-side-usual-left"
- assertNotVisible:
    id: "class-waiting-list-side-usual-right"
- tapOn:
    id: "class-waiting-list-side-right"
- tapOn:
    id: "class-waiting-list-scope-occurrence"
- tapOn:
    id: "class-waiting-list-confirm"

# ── the row shows its side ──
- extendedWaitUntil:
    visible:
      id: "class-waiting-list-row-${output.two.playerId}-coach"
    timeout: 15000
- assertVisible:
    id: "class-waiting-list-side-${output.two.playerId}"
