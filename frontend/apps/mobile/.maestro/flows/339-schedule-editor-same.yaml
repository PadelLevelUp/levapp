# PAD-839 (dashboard.student-setup-guide, DASHBOARD-STUDENT-SETUP-GUIDE-10): the schedule editor
# from step 3, "same every day": every day, two periods (09 to 11 and 15 to 20), saved; the editor
# closes and the saved schedule shows on the step.
#
# Fresh student from scripts/setup-guide-student-setup.js; step 3 is opened by its link. By testID
# only. Backend: -e API_BASE=http://localhost:<port>, else :5001. Flow number 339.
appId: com.padellevelup.app
onFlowStart:
  - runScript: ../scripts/setup-guide-student-setup.js
onFlowComplete:
  - runScript: ../scripts/setup-guide-student-teardown.js
---
- assertTrue: "${output.username && output.username.length > 10}"
- runFlow:
    file: ../subflows/login-guide-student.yaml
    env:
      USERNAME: ${output.username}
      PASSWORD: ${output.password}
# Closes the sheet for the day, then opens step 3 (unavailability) by its link.
- tapOn:
    id: "setup-guide-later"
- extendedWaitUntil:
    notVisible:
      id: "setup-guide-sheet"
    timeout: 10000
- openLink: "levelup://setup-guide?step=unavailability"
- extendedWaitUntil:
    visible:
      id: "setup-unavailability"
    timeout: 20000
- tapOn:
    id: "setup-schedule-create"
- extendedWaitUntil:
    visible:
      id: "schedule-editor"
    timeout: 15000
- tapOn:
    id: "schedule-days-all"
- tapOn:
    id: "schedule-hour-09"
- tapOn:
    id: "schedule-hour-11"
- tapOn:
    id: "schedule-hour-15"
- scrollUntilVisible:
    element:
      id: "schedule-hour-20"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "schedule-hour-20"
- scrollUntilVisible:
    element:
      id: "schedule-summary"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "schedule-summary"
- scrollUntilVisible:
    element:
      id: "schedule-save"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "schedule-save"
- extendedWaitUntil:
    notVisible:
      id: "schedule-editor"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "setup-saved-schedule"
    timeout: 15000
# The server holds exactly what criterion 10 names: two rows sharing one scheduleId, 09:00-11:00
# and 15:00-20:00, weekly on all seven days, type unavailable, blocking auto-invitations.
- evalScript: "${output.rows = json(http.get(output.api + '/api/app/availability_blockers', { headers: { 'Authorization': 'Bearer ' + output.studentTok } }).body)}"
- evalScript: "${output.rowKeys = output.rows.map(function (r) { return r.startTime + '-' + r.endTime + '@' + r.recurrenceRule.daysOfWeek.slice().sort().join(',') }).sort().join(' | ')}"
- assertTrue: "${output.rows.length === 2}"
- assertTrue: "${output.rows[0].scheduleId && output.rows.every(function (r) { return r.scheduleId === output.rows[0].scheduleId })}"
- assertTrue: "${output.rows.every(function (r) { return r.type === 'unavailable' && r.isRecurring === true && r.blocksAutoInvitations === true })}"
- assertTrue: "${output.rowKeys === '09:00-11:00@0,1,2,3,4,5,6 | 15:00-20:00@0,1,2,3,4,5,6'}"
