# players.claim (PAD-213) — the coach's "Link to existing account" action on a
# claimable player, and the student's link-request inbox.
#
# Maestro cannot register a second account and approve across sessions in one
# flow, so this covers the coach half end to end (create a claimable player →
# open it → link dialog → unknown username is reported inline) and, on the
# student side, that the Settings → Account inbox renders (empty for the seeded
# student). The full merge is covered by the web spec
# players/claim-existing-account.spec.ts and the backend tests.
appId: com.padellevelup.app
---
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "tab-players"
- extendedWaitUntil:
    visible:
      id: "screen-players"
    timeout: 15000
- tapOn:
    id: "players-add"
- extendedWaitUntil:
    visible:
      id: "player-name"
    timeout: 15000
- tapOn:
    id: "player-name"
- inputText: "Maestro Claimable"
- swipe:
    start: "50%, 45%"
    end: "50%, 20%"
- scrollUntilVisible:
    element:
      id: "player-create-and-invite"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "player-create-and-invite"
- extendedWaitUntil:
    visible:
      id: "player-invite-link"
    timeout: 20000
# PAD-556: `back` is Android-only (a no-op on iOS), so close the invite dialog by its
# close button; closing it returns to the roster.
- tapOn:
    id: "dialog-close"
# Open the player we just created. The roster is paginated A-Z and a new row can sit on a
# later page, so filter by name first. Tap a row by id, not by text: the search field
# holds the same text.
- extendedWaitUntil:
    visible:
      id: "players-search"
    timeout: 15000
- tapOn:
    id: "players-search"
- eraseText: 40
- inputText: "Maestro Claimable"
- extendedWaitUntil:
    notVisible:
      text: "E2E Student"
    timeout: 15000
- tapOn:
    id: "player-card-.*"
- extendedWaitUntil:
    visible:
      id: "player-detail"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "player-claim-link"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "player-claim-link"
- assertVisible:
    id: "player-claim-dialog"
# PAD-528 (players.claim rule 4b): the dialog opens on "From your students"; switch to the
# username tab before typing.
- tapOn:
    id: "player-claim-tab-username"
- tapOn:
    id: "player-claim-username"
- inputText: "nobody-has-this-username"
- tapOn:
    id: "player-claim-submit"
- assertVisible:
    id: "player-claim-error"
# Student side: the inbox exists under Settings → Account.
- runFlow: ../subflows/logout.yaml
- runFlow: ../subflows/login-student.yaml
- openLink: levelup://settings
- scrollUntilVisible:
    element:
      id: "settings-claim-requests"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "settings-claim-requests"
