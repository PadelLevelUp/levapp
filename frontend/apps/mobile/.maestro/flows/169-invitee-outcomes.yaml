# PAD-548 — calendar.event-detail rules 16 and 18 on iOS: the coach's class screen shows an
# invitee's outcome, and "Delete invitation" withdraws a pending one after the warning.
# Seeded through the API (R-040): a class three days out with "E2E Student" enrolled and a manual
# invitation to "Filler Player 01"; the class is opened by its instance id (PAD-326 deep link).
# Asserted and driven by ids carrying the outcome, never by rendered English (PAD-320).
# Flow number 169 is from 0710-SessionB's reserved block (unconfirmed).
appId: com.padellevelup.app
onFlowComplete:
  - evalScript: "${output.cleanup && output.cleanup()}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.auth = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }}"
- evalScript: "${output.players = (function (r) { return r.items ? r.items : r; })(json(http.get(output.api + '/api/app/coach_players', { headers: output.auth }).body))}"
- evalScript: "${output.find = function (n) { return output.players.filter(function (p) { return p.name === n; })[0]; }}"
- evalScript: "${output.enrolled = output.find('E2E Student')}"
- evalScript: "${output.invitee = output.find('Filler Player 01')}"
- assertTrue: "${output.enrolled != null && output.invitee != null}"
- evalScript: "${output.day = (function (d) { var m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' + m : '' + m) + '-' + (x < 10 ? '0' + x : '' + x); })(new Date(Date.now() + 3 * 86400000))}"
- evalScript: "${output.made = json(http.post(output.api + '/api/app/add_class', { headers: output.auth, body: JSON.stringify({ name: 'E2E Invitee Outcomes iOS', classType: 'academy', maxPlayers: 4, levelId: output.enrolled.levelId, date: output.day, startTime: '17:00', endTime: '18:00', playerIds: [output.enrolled.playerId], isRecurring: false, notificationsEnabled: true }) }).body)}"
- evalScript: "${output.cleanup = function () { http.post(output.api + '/api/app/remove_class', { headers: output.auth, body: JSON.stringify({ event: { model: output.made.model || 'Lesson', originalId: output.made.originalId, date: output.day }, scope: 'single' }) }); }}"
- evalScript: "${output.sent = json(http.post(output.api + '/api/app/notify/manual', { headers: output.auth, body: JSON.stringify({ model: output.made.model || 'Lesson', originalId: output.made.originalId, date: output.day, playerIds: [output.invitee.playerId] }) }).body).sent}"
- assertTrue: "${output.sent === 1}"
# The manual invitation materialised the occurrence; the calendar feed names it (model LessonInstance).
- evalScript: "${output.instanceId = json(http.get(output.api + '/api/app/calendar?from=' + output.day + 'T00:00:00&to=' + output.day + 'T23:59:59', { headers: output.auth }).body).filter(function (e) { return e.title === 'E2E Invitee Outcomes iOS' && e.model === 'LessonInstance'; })[0].originalId}"
- assertTrue: "${output.instanceId > 0}"
- evalScript: "${output.detail = function () { return json(http.post(output.api + '/api/app/class_instance?model=LessonInstance&id=' + output.instanceId + '&date=' + output.day, { headers: output.auth, body: '{}' }).body); }}"
- evalScript: "${output.pid = String(output.invitee.playerId)}"

# ── the class screen shows the invitee as "no answer yet" ──
- runFlow: ../subflows/login-coach.yaml
- openLink: "levelup://class/${output.instanceId}"
- scrollUntilVisible:
    element:
      id: "class-invited-toggle"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "class-invited-toggle"
- extendedWaitUntil:
    visible:
      id: "invitee-outcome-${output.pid}-pending"
    timeout: 15000

# ── rule 18: the actions, the warning, the withdrawal ──
- tapOn:
    id: "invitee-actions-${output.pid}"
- tapOn:
    id: "invitee-delete-${output.pid}"
- tapOn:
    id: "invitee-delete-cancel"
- assertVisible:
    id: "invitee-outcome-${output.pid}-pending"
- tapOn:
    id: "invitee-actions-${output.pid}"
- tapOn:
    id: "invitee-delete-${output.pid}"
- tapOn:
    id: "invitee-delete-confirm"
- extendedWaitUntil:
    visible:
      id: "invitee-outcome-${output.pid}-withdrawn"
    timeout: 15000
- assertNotVisible:
    id: "invitee-actions-${output.pid}"
- assertTrue: "${output.detail().invitations.filter(function (r) { return String(r.playerId) === output.pid; })[0].outcome === 'withdrawn'}"
