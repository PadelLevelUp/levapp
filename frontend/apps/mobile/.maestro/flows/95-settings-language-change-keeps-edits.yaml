# PAD-506 (settings.explicit-save): the language is held until `settings-preferences-save`, so B-155 is
# pinned at the Save: the coach adds a valid level row (code + label) and holds Portuguese, then presses
# Save. The Save sends both; the app then re-renders in Portuguese (`t` changes), and the typed row must
# still be on screen — an editor that reloads its rows on a `t` change would replace it. Asserted through
# the API too: the language is pt and the coach has one level more.
# PAD-392 (B-155), settings.unsaved-edits / coach-working-hours rule 7: a change of language never
# undoes an edit.
#
# B-251 (PAD-473): drives the coach-levels editor (in the same Preferences pane as the language).
#
# What is written: the language (pt) and one level ("M95" / "Maestro 95"); onFlowComplete deletes that
# level and puts the language back to en, on failure too. Backend: -e API_BASE=http://localhost:<port>,
# else :5001.
appId: com.padellevelup.app
onFlowComplete:
  # Whatever happened, leave the seeded coach in English and without the added level.
  - evalScript: "${output.tidy = (typeof output.coachTok === 'undefined') ? false : http.request(output.api + '/api/auth/me', { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ language: 'en' }) }).ok}"
  - evalScript: "${output.tidyLevel = (typeof output.coachTok === 'undefined') ? false : (function () { var rows = json(http.get(output.api + '/api/app/coach_levels', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body); for (var i = 0; i < rows.length; i++) { if (rows[i].code === 'M95') { http.post(output.api + '/api/app/delete/coach_level', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ id: rows[i].id }) }); } } return true; })()}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.lang0 = json(http.get(output.api + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).language}"
- assertTrue: "${output.lang0 == 'en'}"
- evalScript: "${output.before = json(http.get(output.api + '/api/app/coach_levels', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).length}"
# The new row is appended after the coach's existing levels.
- evalScript: "${output.newCode = 'level-code-' + output.before}"
- evalScript: "${output.newLabel = 'level-label-' + output.before}"

- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-preferences"
- scrollUntilVisible:
    element:
      id: "settings-levels-add"
    direction: DOWN
    timeout: 30000

# ── Add a valid level: code and label ──
- tapOn:
    id: "settings-levels-add"
- extendedWaitUntil:
    visible:
      id: "${output.newCode}"
    timeout: 10000
- tapOn:
    id: "${output.newCode}"
- inputText: "M95"
- pressKey: Enter
- tapOn:
    id: "${output.newLabel}"
- inputText: "Maestro 95"
- pressKey: Enter
- assertVisible:
    text: "Maestro 95"

# ── Hold another language: the editor must keep the unsaved row ──
# Scrolled UP the select stops just under the screen's header (y≈50–92), where a tap
# lands on the header; centring it puts it in the clear.
- scrollUntilVisible:
    element:
      id: "settings-language-select"
    direction: UP
    timeout: 30000
    centerElement: true
# The picker's first tap sometimes does not open it on iOS; flow 12's retry shape.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "settings-language-select"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      - tapOn:
          id: "settings-language-pt"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "${output.newLabel}"
    direction: DOWN
    timeout: 30000
- assertVisible:
    text: "Maestro 95"

# ── Save: the language and the level go together; the app re-renders in Portuguese ──
- scrollUntilVisible:
    element:
      id: "settings-preferences-save"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-preferences-save"
- retry:
    maxRetries: 5
    commands:
      - extendedWaitUntil:
          visible:
            id: "b506-never-present"
          timeout: 1000
          optional: true
      - evalScript: "${output.lang1 = json(http.get(output.api + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).language}"
      - assertTrue: "${output.lang1 == 'pt'}"
- evalScript: "${output.after = json(http.get(output.api + '/api/app/coach_levels', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).length}"
- assertTrue: "${output.after == output.before + 1}"
# B-155: after the language change (t changed), the typed row is still on screen.
- scrollUntilVisible:
    element:
      text: "Maestro 95"
    direction: UP
    timeout: 30000
- assertVisible:
    text: "Maestro 95"
