# PAD-392 (B-155), settings.unsaved-edits / coach-working-hours rule 7: a change of language never
# undoes an unsaved edit.
#
# The defect: an editor that reloaded its rows in an effect listing `t` in its deps re-ran on a
# language change and replaced the rows, wiping what the coach had typed but not saved. The section
# under test sits in the SAME Preferences section as the language selector, which is what makes this
# drivable end to end on iOS with no timing: add, type, switch language, look.
#
# B-251 (PAD-473): this flow used to drive the evaluation-categories editor, removed from Settings by
# PAD-373 (1a113e541) without the testid grep, so it failed at its first scroll. It now drives the
# coach-levels editor (an explicit-save section in the same Preferences pane): add a level, type its
# label, do not save.
#
# What is written: only the coach's LANGUAGE, twice (pt, then back to en); no level is saved. The end
# state is asserted: the row still holds its typed label, the language is "en" again, and the server
# holds no new level. Backend: -e API_BASE=http://localhost:<port>, else :5001.
appId: com.padellevelup.app
onFlowComplete:
  # Whatever happened, leave the seeded coach in English.
  - evalScript: "${output.tidy = (typeof output.coachTok === 'undefined') ? false : http.request(output.api + '/api/auth/me', { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ language: 'en' }) }).ok}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.lang0 = json(http.get(output.api + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).language}"
- assertTrue: "${output.lang0 == 'en'}"
- evalScript: "${output.before = json(http.get(output.api + '/api/app/coach_levels', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).length}"
# The new row is appended after the coach's existing levels.
- evalScript: "${output.newLabel = 'level-label-' + output.before}"

- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-preferences"
- scrollUntilVisible:
    element:
      id: "settings-levels-add"
    direction: DOWN
    timeout: 30000

# ── Add a level and type its label; do not save ──
- tapOn:
    id: "settings-levels-add"
- extendedWaitUntil:
    visible:
      id: "${output.newLabel}"
    timeout: 10000
- tapOn:
    id: "${output.newLabel}"
- inputText: "Maestro 95"
- pressKey: Enter
- assertVisible:
    text: "Maestro 95"

# ── Switch the language: the editor must keep the unsaved row ──
# Scrolled UP the select stops just under the screen's header (y≈50–92), where a tap
# lands on the header; centring it puts it in the clear.
- scrollUntilVisible:
    element:
      id: "settings-language-select"
    direction: UP
    timeout: 30000
    centerElement: true
# The picker's first tap sometimes does not open it on iOS; flow 12's retry shape.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "settings-language-select"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      - tapOn:
          id: "settings-language-pt"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: "settings-language-status"
          timeout: 15000
- scrollUntilVisible:
    element:
      id: "${output.newLabel}"
    direction: DOWN
    timeout: 30000
- assertVisible:
    text: "Maestro 95"

# ── Back to English the same way; the row survives that too ──
# Scrolled UP the select stops just under the screen's header (y≈50–92), where a tap
# lands on the header; centring it puts it in the clear.
- scrollUntilVisible:
    element:
      id: "settings-language-select"
    direction: UP
    timeout: 30000
    centerElement: true
# The picker's first tap sometimes does not open it on iOS; flow 12's retry shape.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "settings-language-select"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      - tapOn:
          id: "settings-language-en"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: "settings-language-status"
          timeout: 15000
- scrollUntilVisible:
    element:
      id: "${output.newLabel}"
    direction: DOWN
    timeout: 30000
- assertVisible:
    text: "Maestro 95"

# ── End state: language en, nothing saved ──
- evalScript: "${output.lang1 = json(http.get(output.api + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).language}"
- assertTrue: "${output.lang1 == 'en'}"
- evalScript: "${output.after = json(http.get(output.api + '/api/app/coach_levels', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).length}"
- assertTrue: "${output.after == output.before}"
