# PAD-392 (B-155) — evaluations.categories rule 8, settings.coach-working-hours rule 7:
# a change of language never undoes an unsaved edit.
#
# The iOS evaluation-categories editor loaded its rows in an effect that listed `t`
# in its deps. `t` gets a new identity whenever the language changes, so the effect
# re-ran and its reload replaced the rows — wiping a category the coach had just
# added and typed but not yet saved. This section sits in the SAME Preferences
# section as the language selector, which is what makes the defect drivable end to
# end on iOS with no timing: add, type, switch language, look. (Working hours and
# seasons live on another section; switching to Preferences unmounts them, so they
# cannot be proven this way — PAD-393 covers the harness that could.)
#
# What is written: only the coach's LANGUAGE, twice (pt, then back to en); no
# category is saved. The end state is asserted: the row is still there with its
# typed name, the coach's language is "en" again, and the server holds no new
# category. Backend: -e API_BASE=http://localhost:<port>, else :5001.
# Order: not load bearing. Flow number 95 is from Session D's range.
appId: com.padellevelup.app
onFlowComplete:
  # Whatever happened, leave the seeded coach in English.
  - evalScript: "${output.tidy = (typeof output.coachTok === 'undefined') ? false : http.request(output.api + '/api/auth/me', { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ language: 'en' }) }).ok}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- evalScript: "${output.lang0 = json(http.get(output.api + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).language}"
- assertTrue: "${output.lang0 == 'en'}"
- evalScript: "${output.before = json(http.get(output.api + '/api/app/evaluation_categories', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).length}"

- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-preferences"
- scrollUntilVisible:
    element:
      id: "settings-evaluation-categories-add"
    direction: DOWN
    timeout: 30000

# ── Add a category and type its name; do not save ──
- tapOn:
    id: "settings-evaluation-categories-add"
- extendedWaitUntil:
    visible:
      id: "evaluation-category-name-new"
    timeout: 10000
- tapOn:
    id: "evaluation-category-name-new"
- inputText: "Maestro 95"
- pressKey: Enter
- assertVisible:
    text: "Maestro 95"

# ── Switch the language: the editor must keep the unsaved row ──
# Scrolled UP the select stops just under the screen's header (y≈50–92), where a tap
# lands on the header; centring it puts it in the clear.
- scrollUntilVisible:
    element:
      id: "settings-language-select"
    direction: UP
    timeout: 30000
    centerElement: true
# The picker's first tap sometimes does not open it on iOS; flow 12's retry shape.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "settings-language-select"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      - tapOn:
          id: "settings-language-pt"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: "settings-language-status"
          timeout: 15000
- scrollUntilVisible:
    element:
      id: "settings-evaluation-categories-add"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "evaluation-category-name-new"
- assertVisible:
    text: "Maestro 95"

# ── Back to English the same way; the row survives that too ──
# Scrolled UP the select stops just under the screen's header (y≈50–92), where a tap
# lands on the header; centring it puts it in the clear.
- scrollUntilVisible:
    element:
      id: "settings-language-select"
    direction: UP
    timeout: 30000
    centerElement: true
# The picker's first tap sometimes does not open it on iOS; flow 12's retry shape.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "settings-language-select"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      - tapOn:
          id: "settings-language-en"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: "settings-language-status"
          timeout: 15000
- scrollUntilVisible:
    element:
      id: "settings-evaluation-categories-add"
    direction: DOWN
    timeout: 30000
- assertVisible:
    text: "Maestro 95"

# ── End state: language en, nothing saved ──
- evalScript: "${output.lang1 = json(http.get(output.api + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).language}"
- assertTrue: "${output.lang1 == 'en'}"
- evalScript: "${output.after = json(http.get(output.api + '/api/app/evaluation_categories', { headers: { 'Authorization': 'Bearer ' + output.coachTok } }).body).length}"
- assertTrue: "${output.after == output.before}"
