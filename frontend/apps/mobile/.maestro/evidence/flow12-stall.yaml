# EVIDENCE ONLY (PAD-816, flow 12), not in flowsOrder. Why does the scroll UP Preferences stall?
# Hypothesis: each swipe starts mid-screen over the Coach Levels text inputs, which take the gesture.
# 1. From Save, the flow's own scroll UP (15 s, optional) - expected to stall.
# 2. Swipes that start over the left margin (x 2%), screenshot each, mark when settings-back shows.
# 3. Back down to Save, the flow's own scroll UP again, then a hard assert: its failure dumps the
#    screen hierarchy at the stall (the report keeps it).
appId: com.padellevelup.app
onFlowComplete:
  # Whatever happened, leave the seeded coach in English.
  - evalScript: "${output.tidy = (typeof output.coachTok === 'undefined') ? false : http.request(output.api + '/api/auth/me', { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + output.coachTok }, body: JSON.stringify({ language: 'en' }) }).ok}"
---
- evalScript: "${output.api = (typeof API_BASE === 'undefined' ? 'http://localhost:5001' : API_BASE)}"
- evalScript: "${output.coachTok = json(http.post(output.api + '/api/auth/login', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'e2e-coach', password: 'E2eCoach123!' }) }).body).accessToken}"
- runFlow: ../subflows/login-coach.yaml
- tapOn:
    id: "header-account"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 15000
- tapOn:
    id: "settings-nav-preferences"
- extendedWaitUntil:
    visible:
      id: "settings-language-select"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "settings-preferences-save"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "settings-back"
    direction: UP
    timeout: 15000
    optional: true
- takeScreenshot: stall-01-center-scroll-stopped
- evalScript: ${output.i = 0}
- repeat:
    times: 10
    commands:
      - evalScript: ${output.i = output.i + 1}
      - swipe:
          start: 2%, 30%
          end: 2%, 85%
          duration: 500
      - waitForAnimationToEnd
      - takeScreenshot: stall-1${output.i}-left-margin-swipe
      - runFlow:
          when:
            visible:
              id: "settings-back"
          commands:
            - takeScreenshot: stall-2${output.i}-LEFT-MARGIN-REACHED-BACK
- scrollUntilVisible:
    element:
      id: "settings-preferences-save"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "settings-back"
    direction: UP
    timeout: 15000
    optional: true
- takeScreenshot: stall-30-center-scroll-stopped-again
- assertVisible:
    id: "settings-back"
