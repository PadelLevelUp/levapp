    visible:
      id: "email-prompt"
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element:
      id: "email-prompt"
    direction: DOWN
    timeout: 20000
    centerElement: true
    optional: true
- takeScreenshot: diag132-after-scroll-down
- assertVisible:
    id: "email-prompt"
    optional: true
- scrollUntilVisible:
    element:
      id: "email-prompt"
    direction: UP
    timeout: 10000
    optional: true
- takeScreenshot: diag132-after-scroll-up
