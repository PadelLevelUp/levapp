# Parametrized login subflow.
# Usage:
#   - runFlow:
#       file: ../subflows/login.yaml
#       env:
#         USERNAME: e2e-coach
#         PASSWORD: E2eCoach123!
#
# Strategy: launch WITHOUT clearState. Relaunching with clearState right
# after an authenticated session triggers a delayed remount of the login
# screen (stale-token 401 → redirect) that silently wipes typed text.
# Instead we relaunch normally: if a previous flow left a user signed in the
# app restores straight to the dashboard and we log out through the UI
# (stable JS session), then type on the login screen.
#
# The signed-in probe keys off `tab-dashboard`, the one tab every role gets
# (`app/(tabs)/_layout.tsx`): Players/Presences/Training are coach-only and
# Availability is student-only, so they cannot serve as a role-agnostic
# signal. It used to key off `tab-more`, a tab that no longer exists — the
# probe therefore never fired, the app stayed signed in, and the flow died on
# the login-screen wait. Settings is deliberately NOT used: PAD-193 removes
# that tab.
#
# The launch itself is retried: the dev client occasionally dies during the
# launch animation, which hard-fails even optional waits. A retry relaunches
# cleanly. Typing is also retry-verified: each attempt clears the field with
# a BOUNDED eraseText (unbounded eraseText crashes the iOS driver), retypes
# and asserts the value actually registered before submitting.
appId: com.padellevelup.app
---
- retry:
    maxRetries: 3
    commands:
      - launchApp
      # If a previous flow left someone signed in, the app lands on the tabs UI.
      - extendedWaitUntil:
          visible:
            id: "tab-dashboard"
          timeout: 20000
          optional: true
      - runFlow:
          when:
            visible:
              id: "tab-dashboard"
          file: logout.yaml
      - extendedWaitUntil:
          visible:
            id: "login-username"
          timeout: 30000
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "login-username"
      - eraseText: 40
      - inputText: ${USERNAME}
      - assertVisible: ${USERNAME}
      - tapOn:
          id: "login-password"
      - eraseText: 40
      - inputText: ${PASSWORD}
      - tapOn:
          id: "login-submit"
      # players.join-token rule 8: a student with no coach lands on "Connect
      # with a coach" (e2e-student-3 in the seed). Its "Go to dashboard" is the
      # explicit way through; every other account never shows it.
      - extendedWaitUntil:
          visible:
            id: "connect-go-dashboard"
          timeout: 8000
          optional: true
      - runFlow:
          when:
            visible:
              id: "connect-go-dashboard"
          commands:
            - tapOn:
                id: "connect-go-dashboard"
      - extendedWaitUntil:
          visible:
            id: "screen-dashboard"
          timeout: 25000
