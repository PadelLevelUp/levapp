# PAD-839 (flows 337-340): sign in as the throw-away student the setup script made, and stop at the
# setup guide's sheet. login.yaml cannot be used: it ends on `screen-dashboard`, which the sheet's
# modal covers for a student whose guide is live.
# Usage: runFlow with env USERNAME and PASSWORD.
appId: com.padellevelup.app
---
# Notifications unset: Maestro's launchApp grants every permission by default, and step 2
# (device_push) counts this device's granted permission as done, so a "new" student would read 40%.
- launchApp:
    clearState: true
    permissions:
      notifications: unset
# The notifications alert (see below) can also come up at launch, over the login screen.
- extendedWaitUntil:
    visible:
      id: "login-username"
    timeout: 30000
    optional: true
- runFlow:
    when:
      platform: iOS
      visible:
        text: ".*Would Like to Send You Notifications"
    commands:
      - tapOn:
          text: "Don.t Allow"
- extendedWaitUntil:
    visible:
      id: "login-username"
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: "login-username"
- inputText: ${USERNAME}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "login-submit"
- runFlow: dismiss-save-password.yaml
# With notifications unset, the push registrar asks on sign-in and iOS's alert covers the sheet.
# Answer it only while its own title shows (never a bare text tap, B-728); "Don't Allow" keeps step 2
# not done, so the guide still reads 20%. Its apostrophe is a curly one, hence "Don.t".
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: ".*Would Like to Send You Notifications"
          timeout: 8000
          optional: true
- runFlow:
    when:
      platform: iOS
      visible:
        text: ".*Would Like to Send You Notifications"
    commands:
      - tapOn:
          text: "Don.t Allow"
- runFlow: dismiss-save-password.yaml
- extendedWaitUntil:
    visible:
      id: "setup-guide-sheet"
    timeout: 30000
