# B-728: answer iOS's "Save Password?" sheet after a sign-in. A simulator with AutoFill passwords on asks
# after every sign-in, and the system sheet hides the app from Maestro until it is answered. Only on
# iOS, and the tap only while the sheet's own title shows: Maestro's text match ignores case, so a bare
# "Not Now" tap also hit the app's "Not now" / "Agora não" and dismissed the coach home's email prompt.
# Every sign-in that succeeds runs this next (src/lib/maestro-login-system-sheet.test.ts).
appId: com.padellevelup.app
---
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Save Password\\?|Guardar palavra-passe\\?|Salvar senha\\?"
          timeout: 5000
          optional: true
- runFlow:
    when:
      platform: iOS
      visible:
        text: "Save Password\\?|Guardar palavra-passe\\?|Salvar senha\\?"
    commands:
      - tapOn:
          text: "Not Now|Agora não"
