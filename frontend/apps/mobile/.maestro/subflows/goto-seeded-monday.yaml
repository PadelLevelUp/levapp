# Navigate the Calendar tab to the seeded Monday (the next Monday after
# today, where seed.py schedules "E2E Academy Class" at 10:00) and select
# that day in the week strip. The seeded Monday is always in the NEXT
# calendar week (weeks start on Monday), so one next-week tap normally
# reaches it; the repeat guard makes it robust either way.
# Postcondition: the seeded Monday is selected and "E2E Academy Class"
# is visible in the day list.
appId: com.padellevelup.app
---
- tapOn:
    id: "tab-calendar"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 15000
# B-217: the calendar remembers its view mode across launches, and a flow that left it on Mês or
# Semana (32, 35, 117, 31, …) left no `calendar-next-week` in the day strip for the steps below.
# Select the day view here instead of relying on run order. Every role sees the view control.
- tapOn:
    id: "calendar-view-day"
- runScript: ../scripts/seeded-monday.js
- repeat:
    times: 3
    while:
      notVisible:
        id: "calendar-day-${output.seededMonday}"
    commands:
      - tapOn:
          id: "calendar-next-week"
      - waitForAnimationToEnd
- tapOn:
    id: "calendar-day-${output.seededMonday}"
- extendedWaitUntil:
    visible:
      text: "E2E Academy Class"
    timeout: 20000
