# admin.foundation rule 12 (PAD-531): the staff console image serves the built SPA and nothing
# else. The HOST nginx routes `/admin/api/` to the backend container of the same environment
# (infra/nginx/sites-available/levapp-admin*), so this container holds no upstream. The admin
# token travels in the Authorization header, never in a URL, so no log redaction is needed here.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A proxy rule that is wrong would land API calls here: answer honestly, not with the shell.
  location /admin/api/ {
    return 404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /index.html;
  }
}
