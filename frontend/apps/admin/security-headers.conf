# admin.foundation hardening (PAD-531, 2026-10-07): the staff console's security headers.
# Included in EVERY location of nginx.conf: nginx drops server-level add_header directives in a
# location that has its own, so a header set only at server level silently vanishes.
# Google Identity Services: the button script, its iframe and its fetches live under
# accounts.google.com/gsi/; the console calls only its own origin (/admin/api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Robots-Tag "noindex, nofollow" always;
