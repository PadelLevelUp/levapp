id: P05
variant: a
title: nobody answers
source: {section: "Plano §9.1 Coverage and group order", lines: [235, 235]}
what_it_tests: X more go out after each T, older invitations stay open, and M counts only counting ones
tags: [rounds, max-open, timers]
derived_from: [S5, D4, D16]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). X = 2 and M = 5, as the plan's own check: invitations past T stop counting toward M, so the result is
  the same as with no cap. Paired with P05b (S5b) only to fit the format's id rule.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
  invites_per_spot: 2
  max_open: 5
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 4, R: 3}
students:
  - {cohort: L3R, count: 100, level: 3, side: R}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L3R, count: 2, side_named: null, group: 3}]
  - at: 2026-11-01 20:00
    expect:
      invitations: [{cohort: L3R, count: 2, side_named: null, group: 3}]
      open_unanswered: 4
  - at: 2026-11-01 21:00
    expect:
      invitations: [{cohort: L3R, count: 2, side_named: null, group: 3}]
      open_unanswered: 6
final:
  roster: {L: 4, R: 3}
