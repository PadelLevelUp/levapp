id: P21
title: a cancellation after last_invite_at
source: {section: "Plano §9.3 Regulars and absences", lines: [276, 276]}
what_it_tests: nothing new is sent after last_invite_at, but an open invitation can still take the spot
tags: [last-invite, regulars, cancellation]
derived_from: [S21, D4, §8 step 6]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). The opening on 2 Nov invites 3 right-siders; one takes it and 2 stay open (D4). After last_invite_at a
  right regular says No: nothing is sent, and an open invitation takes the spot.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 3, R: 4, both: 1}
students:
  - {cohort: L3R, count: 3, level: 3, side: R}

timeline:
  - at: 2026-11-02 10:00
    events: [{regular_no: R-1}]
    expect:
      invitations: [{cohort: L3R, count: 3, side_named: null, group: 3}]
  - at: 2026-11-02 10:10
    events: [{accepts: {cohort: L3R, state: invited, as: r1}}]
    expect:
      placed: [{who: r1, side: R, how: invitation}]
      missing: {total: 0}
  - at: 2026-11-03 09:00
    events: [{regular_no: R-2}]
    expect:
      invitations: none
      missing: {total: 1}
  - at: 2026-11-03 09:10
    events: [{accepts: {cohort: L3R, state: invited, as: r2}}]
    expect:
      placed: [{who: r2, side: R, how: invitation}]
      missing: {total: 0}
final:
  roster: {total: 8}
