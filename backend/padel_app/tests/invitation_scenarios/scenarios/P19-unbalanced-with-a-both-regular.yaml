id: P19
title: unbalanced with a both-sides regular
source: {section: "Plano §9.3 Regulars and absences", lines: [269, 269]}
what_it_tests: only the both-sides regular moves to the under-filled side; the one-sided regulars stay
tags: [unbalanced, both-sides, regulars]
derived_from: [S19, §4, §8 step 6]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). 1 needed, so 3 invitations. On a Yes, at last_invite_at the both-sides regular and one right regular
  (R-5, joined most recently) play left: 4 / 4.

  Re-derived again (PAD-913, owner 2026-11-12, decisions 12-13: the engine moves a student only within the
  sides they play): at last_invite_at only B-1 (who plays both sides) goes left
  and gets `side_moved`; R-5 plays only the right and stays there, so its `side_moved` is gone and the
  08:30 observation and the final are L3 R5 (was L4 R4).

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 1, R: 5, both: 1}
students:
  - {cohort: L3L, count: 5, level: 3, side: L}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L3L, count: 3, side_named: null, group: 3}]
      missing: {total: 1}
  - at: 2026-11-01 19:10
    events: [{accepts: {cohort: L3L, state: invited, as: l1}}]
    expect:
      placed: [{who: l1, side: L, how: invitation}]
      missing: {total: 0}
  - at: 2026-11-03 08:30
    derived_from: [§8 step 6]
    expect:
      roster: {L: 3, R: 5}
      messages: [{who: B-1, kind: side_moved}]
final:
  roster: {L: 3, R: 5}
