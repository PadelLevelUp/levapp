notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). Group 1 covers the either spot with 3 right-siders (offer: right); nobody in group 1 fits must(L), so
  group 2 is its ideal tier and the other 2 right-siders are asked to play left (Q9: per spot type). Branch
  a: after one of the first 3 takes the right, a second one's Yes is re-offered the left (Q6).

  Re-derived (PAD-913, owner 2026-11-12, decision 1: no re-offer at all): 19:20 r2's offer (right) has
  filled, so r2 gets the Aviso (sorry with the waiting-list offer), never an offer of the left, though the
  left spot is open and group 4 admits right-siders there. r2 does not join the list, so nothing more goes to
  them, and no invitation is sent at 19:20: the left's ideal tier is group 4, whose 2 named-L invitations
  still count (to 20:00) and no group-4 candidate is left uninvited. The left stays 1 short; final 7.

