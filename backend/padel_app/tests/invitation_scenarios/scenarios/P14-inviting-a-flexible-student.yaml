id: P14
title: inviting a flexible student
source: {section: "Plano §9.2 Distinct people and flexible students", lines: [256, 256]}
what_it_tests: a both-sides student is never told a side; the other side is named only to left-siders
tags: [both-sides, other-side, groups]
derived_from: [S14, D11, D17]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). B1 alone is group 1 for the right spot and gets no side named. When B1 stops counting, group 2 asks 3
  left-siders, naming the right side.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 4, R: 3}
students:
  - {id: B1, level: 3, side: both}
  - {cohort: L3L, count: 6, level: 3, side: L}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{who: B1, side_named: null, group: 3}]
  - at: 2026-11-01 20:00
    expect:
      invitations: [{cohort: L3L, count: 3, side_named: R, group: 4}]
final:
  roster: {L: 4, R: 3}
