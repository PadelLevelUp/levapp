id: 52
title: um candidato que joga dos dois lados para vagas nos dois lados
source: {section: "Cenários 47 a 57: lado diferente, dois lados e regulares desequilibrados", lines: [1213, 1228]}
what_it_tests: o aluno que joga dos dois lados conta só uma vez, e o seu lado adapta-se para encher a aula
tags: [both-sides, groups, sides]
derived_from: [D17, D20]
corrections: []
notes: >
  B1 is a label for the PDF's unnamed level-2 both-sides student. B1 covers one spot by heads. For the
  other spot group 4 enters at once with the full X = 3 (R1; U5). B1's invitation names no side ("para
  qualquer lado"). When the right fills, B1's Yes takes the left (R12: the both-sides student goes to the
  spot that the lower groups cannot fill).

  Re-derived under the plan (PAD-900, 2026-11-11): B1's either-side offer covers one spot. The other goes to
  group 4 at 1 per spot, because group 3 (B1) is the ideal tier for both types (D17).

  2026-11-13 (PAD-931): passes unchanged under the owner's decision 16 (a flexible invitation fills one type's
  budget only, reversing D20). With one spot per side the two readings send the same invitations, so this file
  cannot tell them apart; P40 pins the rule.

