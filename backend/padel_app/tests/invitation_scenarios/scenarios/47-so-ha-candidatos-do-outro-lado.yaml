id: 47
title: só há candidatos do outro lado
source: {section: "Cenários 47 a 57: lado diferente, dois lados e regulares desequilibrados", lines: [1113, 1131]}
what_it_tests: a ordem do grupo 5 antes do grupo 6, a substituição imediata e o lado indicado no convite
tags: [groups, rounds, timers, other-side]
depends_on: [U12]
corrections: []
notes: >
  The 19:10 No is replaced at once from the same group (R2); the replacement joins the current round and
  gets no time of its own. The 19:20 round asks for 3 but group 5 has only 2 uninvited left. 20:20 is 60
  minutes after that last round of group 5 (Method A). Every invitation names the right side (D11),
  because the spot is on the other side from the candidates. U12 is tagged because the expected times
  rest on the PDF's two timers.

roster:
  regulars: {L: 8, R: 7}
students:
  - {cohort: L2L, count: 6, level: 2, side: L}
  - {cohort: L3L, count: 2, level: 3, side: L}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L2L, count: 3, side_named: R, group: 5}]
  - at: 2026-11-01 19:10
    events: [{declines: {cohort: L2L, state: invited, as: d1}}]
    expect:
      invitations: [{cohort: L2L, count: 1, side_named: R, group: 5}]
      open_unanswered: 3
  - at: 2026-11-01 19:20
    expect:
      invitations: [{cohort: L2L, count: 2, side_named: R, group: 5}]
      open_unanswered: 5
  - at: 2026-11-01 20:00
    derived: true
    expect:
      invitations: none
  - at: 2026-11-01 20:20
    expect:
      invitations: [{cohort: L3L, count: 2, side_named: R, group: 6}]
      open_unanswered: 7
  - at: 2026-11-01 20:30
    events: [{accepts: {cohort: L3L, state: invited, as: a}}]
    expect:
      placed: [{who: a, side: R, how: invitation}]
      missing: {L: 0, R: 0}
final:
  roster: {L: 8, R: 8}
