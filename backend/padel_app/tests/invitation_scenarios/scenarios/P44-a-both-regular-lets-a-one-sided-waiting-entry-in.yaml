id: P44
title: a both regular lets a one-sided waiting-list entry in
source: {section: "PAD-807 (ticket example: full class of 16, 8 right, 7 left, 1 both)", lines: [1, 1]}
what_it_tests: when a right regular says No, the left-only waiting-list student is invited and placed, because the both regular balances the class
tags: [waiting-list, both-sides, regulars, absences, sides]
derived_from: [D12]
corrections: []
notes: >
  PAD-807's example on the new engine (promoted from the PAD-802 triage's throwaway P93). The class of 16
  is full: 7 left, 8 right and 1 regular who plays both sides. W1 (left only, `sides: own`) is on the
  students' waiting list. A right regular says No. The old engine typed the freed spot right (the side of
  the absence) and skipped W1 for her side. On the new engine an unplaced both regular counts under
  neither side (engine-spots rule 5), so the spot is `either` (L 7, R 7, one open, must 0) and a left-sider
  fits it; the students' list is a candidate tier whatever the side (engine-tiers rule 6). W1 is invited
  at once, with no side named, and is placed left; nothing is missing and the both regular takes the right.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}

roster:
  regulars: {L: 7, R: 8, both: 1}
students:
  - {id: W1, level: 3, side: L}
  - {cohort: L3R, count: 3, level: 3, side: R}

timeline:
  - at: 2026-11-01 19:00
    events: [{joins_waiting_list: W1, sides: own}]
    expect: {invitations: none}
  - at: 2026-11-02 18:00
    events: [{regular_no: R-1}]
    expect:
      invitations: [{who: W1, side_named: null, group: 2}]
  - at: 2026-11-02 18:10
    events: [{accepts: W1}]
    expect:
      placed: [{who: W1, side: L, how: invitation}]
      missing: {total: 0}
final:
  roster: {L: 8, R: 7}
