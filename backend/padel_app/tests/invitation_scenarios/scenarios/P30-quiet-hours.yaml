id: P30
title: quiet hours
source: {section: "Plano §9.5 Messages, levels, timing", lines: [297, 297]}
what_it_tests: quiet hours hold all sending and pause the inactivity time
tags: [quiet-hours, timers]
derived_from: [S30, D14]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). Quiet hours 22:00-07:00, as the plan's example needs. 21:30: 3 of the 4 right-siders. 23:00: a second
  spot opens inside quiet hours and nothing is sent. 07:00: group 1 first, its last right-sider. The 21:30
  invitations used 30 minutes before 22:00, so they stop counting at 07:30, and group 2 gets 1 for the spot
  group 1 no longer covers.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
  quiet_hours: ["22:00", "07:00"]
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 4, R: 4}
students:
  - {cohort: L3R, count: 4, level: 3, side: R}
  - {cohort: L3L, count: 3, level: 3, side: L}

timeline:
  - at: 2026-11-01 21:30
    events: [{regular_no: R-1}]
    expect:
      invitations: [{cohort: L3R, count: 3, side_named: null, group: 3}]
  - at: 2026-11-01 23:00
    events: [{regular_no: R-2}]
    expect:
      nothing_sent: true
      missing: {L: 0, R: 2}
  - at: 2026-11-02 07:00
    expect:
      invitations: [{cohort: L3R, count: 1, side_named: null, group: 3}]
  - at: 2026-11-02 07:25
    expect: {invitations: none}
  - at: 2026-11-02 07:30
    expect:
      invitations: [{cohort: L3L, count: 1, side_named: R, group: 4}]
final:
  roster: {L: 4, R: 2}
