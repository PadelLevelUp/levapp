id: 91
title: "6 à esquerda e 2 à direita: todo o limite vai para a direita"
source: {section: "Cenários 91 a 95: limite de convites e equilíbrio dos lados", lines: [1976, 1997]}
what_it_tests: o lado mais vazio recebe os convites primeiro, e o outro lado entra assim que os dois se aproximam
tags: [max-open, sides, rounds]
depends_on: [U7]
corrections: []
notes: >
  M counts only unanswered invitations of the current round (R10); each round sends X x spots up to M without
  subtracting earlier rounds (R11), so 19:20 sends 12 more and 24 right-side invitations are open (stated at
  lines 2169-2173). 19:25: the PDF's "8 convites abertos na ronda atual" (right side) is the state before the
  top-up; open_in_round is checked after the engine runs, so it is those 8 plus the 4 left invitations = 12.
  The 2 right invitations above the ideal of 6 are not cancelled (lines 2188-2191). 19:40 is 20 minutes after
  the 19:20 round; the 19:25 top-up has no clock of its own (line 170). All 40 candidates are used.

roster:
  regulars: {L: 6, R: 2}
students:
  - {cohort: L2R, count: 30, level: 2, side: R}
  - {cohort: L2L, count: 10, level: 2, side: L}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L2R, count: 12, side_named: null, group: 3}]
      missing: {L: 2, R: 6}
  - at: 2026-11-01 19:20
    expect:
      invitations: [{cohort: L2R, count: 12, side_named: null, group: 3}]
      open_unanswered: 24
  - at: 2026-11-01 19:25
    events:
      - {accepts: {cohort: L2R, state: invited, invited_at: 2026-11-01 19:20, as: a1}}
      - {accepts: {cohort: L2R, state: invited, invited_at: 2026-11-01 19:20, as: a2}}
      - {accepts: {cohort: L2R, state: invited, invited_at: 2026-11-01 19:20, as: a3}}
      - {accepts: {cohort: L2R, state: invited, invited_at: 2026-11-01 19:20, as: a4}}
    expect:
      placed:
        - {who: a1, side: R, how: invitation}
        - {who: a2, side: R, how: invitation}
        - {who: a3, side: R, how: invitation}
        - {who: a4, side: R, how: invitation}
      missing: {L: 2, R: 2}
      invitations: [{cohort: L2L, count: 4, side_named: null, group: 3}]
      open_in_round: 12
  - at: 2026-11-01 19:40
    expect:
      invitations:
        - {cohort: L2L, count: 6, side_named: null, group: 3}
        - {cohort: L2R, count: 6, side_named: null, group: 3}
  - at: 2026-11-01 19:50
    events:
      - {accepts: {cohort: L2L, state: invited, as: b1}}
      - {accepts: {cohort: L2L, state: invited, as: b2}}
      - {accepts: {cohort: L2R, state: invited, as: b3}}
      - {accepts: {cohort: L2R, state: invited, as: b4}}
    expect:
      placed:
        - {who: b1, side: L, how: invitation}
        - {who: b2, side: L, how: invitation}
        - {who: b3, side: R, how: invitation}
        - {who: b4, side: R, how: invitation}
      missing: {L: 0, R: 0}
final:
  roster: {L: 8, R: 8}
