notes: >
  Students are named by participation count (P12 has 12). The tiebreak is the base criterion, set explicitly
  because the PDF lists it under "Definições diferentes". The Yes from P1, last in the ranking, takes the spot:
  "O desempate não dá prioridade na resposta".

