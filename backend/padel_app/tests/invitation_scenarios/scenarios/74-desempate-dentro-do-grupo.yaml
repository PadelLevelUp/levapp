    expect:
      invitations:
        - {who: P12, side_named: null, group: 3}
        - {who: P9, side_named: null, group: 3}
        - {who: P7, side_named: null, group: 3}
      missing: {L: 0, R: 1}
  - at: 2026-11-01 19:20
    expect:
