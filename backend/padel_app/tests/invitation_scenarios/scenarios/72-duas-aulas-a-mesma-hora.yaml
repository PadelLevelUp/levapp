id: 72
title: duas aulas à mesma hora disputam os mesmos alunos
source: {section: "Cenários 72 a 79: outras regras e parâmetros", lines: [1583, 1601]}
what_it_tests: um aluno só tem um convite aberto por horário, e fica livre quando a aula que o convidou enche
tags: [multi-class, rounds, tiebreak]
depends_on: [U25]
corrections: []
notes: >
  Encoded exactly as written (design §6.1 E2): when A fills at 19:10, D2 and D3 are freed, which contradicts
  64 and 65 keeping invitations to a filled class valid; U25. The main class is A ("processada primeiro");
  B is the other class. Participations 5..1 rank D1 > D2 > ... > D5, so D2 (not D3) is the one B invites at
  19:10. B invites D2 at once, inside its current round (R14). A freed student is invited for B's spot by the
  "same side" group 3.

roster:
  regulars: {L: 8, R: 7}
other_classes:
  - {id: B, level: 3, capacity: 16, start: 2026-11-03 10:30, regulars: {L: 8, R: 7}}
students:
  - {id: D1, level: 2, side: R, participations: 5}
  - {id: D2, level: 2, side: R, participations: 4}
  - {id: D3, level: 2, side: R, participations: 3}
  - {id: D4, level: 2, side: R, participations: 2}
  - {id: D5, level: 2, side: R, participations: 1}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations:
        - {who: D1, side_named: null, group: 3}
        - {who: D2, side_named: null, group: 3}
        - {who: D3, side_named: null, group: 3}
      other_class:
        B:
          invitations:
            - {who: D4, side_named: null, group: 3}
            - {who: D5, side_named: null, group: 3}
  - at: 2026-11-01 19:10
    events: [{accepts: D1}]
    expect:
      placed: [{who: D1, side: R, how: invitation}]
      missing: {L: 0, R: 0}
      other_class:
        B:
          invitations: [{who: D2, side_named: null, group: 3}]
  - at: 2026-11-01 19:15
    events: [{other_class: B, event: {accepts: D2}}]
    expect:
      other_class:
        B:
          placed: [{who: D2, side: R, how: invitation}]
          missing: {L: 0, R: 0}
final:
  roster: {L: 8, R: 8}
  other_classes:
    B: {roster: {L: 8, R: 8}}
