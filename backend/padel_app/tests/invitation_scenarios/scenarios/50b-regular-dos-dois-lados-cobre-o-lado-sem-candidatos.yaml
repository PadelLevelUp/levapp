id: 50
variant: nao
title: regular que joga dos dois lados cobre o lado sem candidatos
source: {section: "Cenários 47 a 57: lado diferente, dois lados e regulares desequilibrados", lines: [1174, 1195]}
what_it_tests: a aplicação conta alunos em falta, não vagas por lado, e não convida a mais por causa do aluno que joga dos dois lados
tags: [both-sides, regulars, groups, unbalanced]
depends_on: [U11]
corrections: []
notes: >
  Branch "Se disser Não" (variant nao; the Sim branch is 50a, with the same 19:00 step). Capacity 4,
  one student missing from either side (R7): everyone counts as same side, groups 3 and 4 merge both
  sides, groups 5 and 6 are empty. After the No, group 3 is exhausted and everyone in it refused, so
  group 4 (the 3 L3L) is invited at once (base rule "todos recusarem"). The PDF gives no times for the
  answers; 19:10 and 19:20 are the encoder's. Final: 2 left, 1 right and the both-sides regular, who
  completes the right (encoded as total 4). The app does not assign the regular's side (U11).

class:
  level: 3
  capacity: 4
  start: 2026-11-03 10:30
  created_at: null

roster:
  regulars: {L: 1, R: 1, both: 1}
students:
  - {cohort: L2R, count: 1, level: 2, side: R}
  - {cohort: L3L, count: 3, level: 3, side: L}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L2R, count: 1, side_named: null, group: 3}]
      missing: {total: 1}
  - at: 2026-11-01 19:10
    events: [{declines: {cohort: L2R, state: invited, as: r1}}]
    expect:
      invitations: [{cohort: L3L, count: 3, side_named: null, group: 4}]
      missing: {total: 1}
  - at: 2026-11-01 19:20
    events: [{accepts: {cohort: L3L, state: invited, as: l1}}]
    expect:
      placed: [{who: l1, side: L, how: invitation}]
      missing: {total: 0}
final:
  roster: {total: 4}
