id: 92
title: "5 à esquerda e 3 à direita: o limite divide-se em 9 e 3"
source: {section: "Cenários 91 a 95: limite de convites e equilíbrio dos lados", lines: [1998, 2020]}
what_it_tests: o limite equilibra os lados e é redistribuído a cada resposta
tags: [max-open, sides, rounds]
depends_on: [U7]
corrections: []
notes: >
  The limit covers 4 spots: 2 to bring the right level with the left, the other 2 halved (lines 1969-1974).
  19:15: the PDF's "7 de direita e 3 de esquerda abertos" is the state before the top-up and is not checked;
  the step checks the 2 left invitations it causes (R10: accepted invitations leave the count). 19:20 is the
  next round, 20 minutes after 19:00, sending X x 4 spots = 12 without subtracting earlier rounds (R11).

roster:
  regulars: {L: 5, R: 3}
students:
  - {cohort: L2R, count: 30, level: 2, side: R}
  - {cohort: L2L, count: 20, level: 2, side: L}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations:
        - {cohort: L2R, count: 9, side_named: null, group: 3}
        - {cohort: L2L, count: 3, side_named: null, group: 3}
      missing: {L: 3, R: 5}
  - at: 2026-11-01 19:15
    events:
      - {accepts: {cohort: L2R, state: invited, as: a1}}
      - {accepts: {cohort: L2R, state: invited, as: a2}}
    expect:
      placed:
        - {who: a1, side: R, how: invitation}
        - {who: a2, side: R, how: invitation}
      missing: {L: 3, R: 3}
      invitations: [{cohort: L2L, count: 2, side_named: null, group: 3}]
  - at: 2026-11-01 19:20
    expect:
      invitations:
        - {cohort: L2L, count: 6, side_named: null, group: 3}
        - {cohort: L2R, count: 6, side_named: null, group: 3}
  - at: 2026-11-01 19:30
    events:
      - {accepts: {cohort: L2L, state: invited, as: b1}}
      - {accepts: {cohort: L2L, state: invited, as: b2}}
      - {accepts: {cohort: L2L, state: invited, as: b3}}
      - {accepts: {cohort: L2R, state: invited, as: b4}}
      - {accepts: {cohort: L2R, state: invited, as: b5}}
      - {accepts: {cohort: L2R, state: invited, as: b6}}
    expect:
      placed:
        - {who: b1, side: L, how: invitation}
        - {who: b2, side: L, how: invitation}
        - {who: b3, side: L, how: invitation}
        - {who: b4, side: R, how: invitation}
        - {who: b5, side: R, how: invitation}
        - {who: b6, side: R, how: invitation}
      missing: {L: 0, R: 0}
final:
  roster: {L: 8, R: 8}
