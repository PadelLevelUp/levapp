id: 65
title: cancelamento depois do último convite
source: {section: "Cenários 58 a 71: respostas, faltas, cancelamentos e horários", lines: [1449, 1467]}
what_it_tests: depois do último convite, só os convites abertos ou uma entrada direta preenchem a vaga
tags: [cancellation, absences, last-invite]
depends_on: [U25, U29]
corrections: []
notes: >
  Encoded exactly as written (design §6.1 E2): D2's and D3's invitations stay valid after the class filled at
  19:30, which contradicts scenario 72; U25. The cancel at 3 Nov 09:00 is after the 22:30 cutoff, so it is
  unjustified (U29). invitations_total_sent 3 at 09:00 checks that no L3R was ever invited. At 10:40 the class
  has started and D3's Yes must change nothing. `refused` covers only direct_join and waiting_list, so the
  step applies the late accept and checks by proxy: roster unchanged and nothing sent (no Aviso, no
  placement). Proposed to H: `refused: [{who: D3, action: accept}]`.

roster:
  regulars: {L: 8, R: 7}
students:
  - {id: D1, level: 2, side: R}
  - {id: D2, level: 2, side: R}
  - {id: D3, level: 2, side: R}
  - {cohort: L3R, count: 3, level: 3, side: R}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations:
        - {who: D1, side_named: null, group: 3}
        - {who: D2, side_named: null, group: 3}
        - {who: D3, side_named: null, group: 3}
  - at: 2026-11-01 19:30
    events: [{accepts: D1}]
    expect:
      placed: [{who: D1, side: R, how: invitation}]
      missing: {L: 0, R: 0}
  - at: 2026-11-03 09:00
    events: [{cancels: D1}]
    expect:
      absences: [{who: D1, kind: unjustified}]
      invitations: none
      invitations_total_sent: 3
      missing: {L: 0, R: 1}
  - at: 2026-11-03 09:20
    events: [{accepts: D2}]
    expect:
      placed: [{who: D2, side: R, how: invitation}]
      missing: {L: 0, R: 0}
  - at: 2026-11-03 10:40
    events: [{accepts: D3}]
    expect:
      nothing_sent: true
      roster: {L: 8, R: 8}
final:
  roster: {L: 8, R: 8}
