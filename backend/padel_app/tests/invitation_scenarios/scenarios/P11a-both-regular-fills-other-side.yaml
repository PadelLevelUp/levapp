id: P11
variant: a
title: a both-sides regular fills the other side
source: {section: "Plano §9.2 Distinct people and flexible students", lines: [253, 253]}
what_it_tests: a both-sides regular takes whichever side is left at last_invite_at
tags: [both-sides, regulars]
derived_from: [S11, §4, §8 step 6]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). Branch a (Yes): the right-sider takes the right; at last_invite_at the both-sides regular gets the left
  and is notified (`side_moved`).

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 3, R: 3, both: 1}
students:
  - {cohort: L3R, count: 1, level: 3, side: R}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L3R, count: 1, side_named: null, group: 3}]
      missing: {total: 1}
  - at: 2026-11-01 19:10
    events: [{accepts: {cohort: L3R, state: invited, as: r1}}]
    expect:
      placed: [{who: r1, side: R, how: invitation}]
      missing: {total: 0}
  - at: 2026-11-03 08:30
    derived_from: [§8 step 6]
    expect:
      roster: {L: 4, R: 4}
      messages: [{who: B-1, kind: side_moved}]
final:
  roster: {L: 4, R: 4}
