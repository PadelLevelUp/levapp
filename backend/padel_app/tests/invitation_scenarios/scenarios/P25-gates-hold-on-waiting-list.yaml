id: P25
title: gates hold on the waiting list
source: {section: "Plano §9.4 Waiting list", lines: [286, 286]}
what_it_tests: a waiting-list student who said No, or is in another session at the same time, is not invited
tags: [waiting-list, multi-class, eligibility]
derived_from: [S25, D13]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). X2 joined class B, at the same hour, before A's invitations start; X1 says No to A and then lists.
  Neither is invited from the waiting list; group 2 takes the spot. The third gate (excluded by the coach)
  returns when N's W1 maps the `coach_excludes` event (coordinator, 2026-11-11).

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 4, R: 3}
other_classes:
  - {id: B, level: 3, capacity: 8, start: 2026-11-03 10:30, regulars: {L: 4, R: 3}}
students:
  - {id: X1, level: 3, side: R}
  - {id: X2, level: 3, side: R}
  - {cohort: L3L, count: 3, level: 3, side: L}

timeline:
  - at: 2026-11-01 18:00
    events:
      - {other_class: B, event: {joins_directly: X2}}
      - {joins_waiting_list: X2, sides: both}
    expect:
      invitations: none
  - at: 2026-11-01 19:00
    expect:
      invitations: [{who: X1, side_named: null, group: 3}]
  - at: 2026-11-01 19:10
    events:
      - {declines: X1}
      - {joins_waiting_list: X1, sides: both}
    expect:
      invitations: [{cohort: L3L, count: 3, side_named: R, group: 4}]
final:
  roster: {L: 4, R: 3}
  other_classes:
    B: {roster: {L: 4, R: 4}}
