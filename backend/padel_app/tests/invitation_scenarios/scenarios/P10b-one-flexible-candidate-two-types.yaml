id: P10
variant: b
title: one flexible candidate for two types
source: {section: "Plano §9.2 Distinct people and flexible students", lines: [247, 252]}
what_it_tests: a flexible invitation counts for both types, and a flexible Yes goes where nobody else can
tags: [both-sides, groups, other-side]
derived_from: [S10, D5, D17, D20]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). Branch b (No): the right type has no group 1 candidate left, so group 2 becomes its ideal tier, and the
  3 left-siders not yet invited are asked to play right, side named. The left type keeps its 2.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 3, R: 3}
students:
  - {id: B1, level: 3, side: both}
  - {cohort: L3L, count: 5, level: 3, side: L}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations:
        - {who: B1, side_named: null, group: 3}
        - {cohort: L3L, count: 2, side_named: null, group: 3}
      invitations_total_sent: 3
      missing: {L: 1, R: 1}
  - at: 2026-11-01 19:10
    events: [{declines: B1}]
    expect:
      invitations: [{cohort: L3L, count: 3, side_named: R, group: 4}]
      missing: {L: 1, R: 1}
final:
  roster: {L: 3, R: 3}
