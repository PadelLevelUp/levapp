id: 23
title: mesmo antes e mesmo depois dos lembretes
source: {section: "Cenários 19 a 31: waiting list antes e depois dos lembretes", lines: [659, 676]}
what_it_tests: a hora dos lembretes é a fronteira entre a entrada automática e o convite
tags: [coach-list, waiting-list, reminders, timers]
depends_on: [U16, U13]
corrections: []
notes: >
  Setup step at 1 Nov 19:00 (derived): the coach adds W1 then W2, so W1 is ahead on the coach's list.
  The PDF says W1 enters first and gives no other order. W1 and W2 have no level (level null).
  At 18:01 group 1 (W2 alone) is exhausted and 60 minutes have passed since its only round. Group 3 is
  called even though W2's open invitation still covers the spot by heads (R3, timers beat heads; tagged
  U13).

class: {level: 3, capacity: 8, start: 2026-11-03 10:30}
roster:
  regulars: {L: 4, R: 4}
students:
  - {id: W1, level: null, side: R}
  - {id: W2, level: null, side: R}
  - {cohort: L2R, count: 3, level: 2, side: R}

timeline:
  - at: 2026-11-01 19:00
    derived: true
    events:
      - {coach_adds_to_waiting_list: W1, side: R}
      - {coach_adds_to_waiting_list: W2, side: R}
    expect:
      invitations: none
      waiting_list: {coach: [W1, W2], students: []}
  - at: 2026-11-02 16:59
    events: [{regular_no: R-1}]
    expect:
      placed: [{who: W1, side: R, how: auto_from_waiting_list}]
      messages: [{who: W1, kind: added}]
      invitations: none
  - at: 2026-11-02 17:00
    expect:
      reminders: {to: [regulars, W1]}
  - at: 2026-11-02 17:01
    events: [{regular_no: R-2}]
    expect:
      invitations: [{who: W2, group: 1}]
      missing: {L: 0, R: 1}
  - at: 2026-11-02 18:01
    expect:
      invitations: [{cohort: L2R, count: 3, side_named: null, group: 3}]
  - at: 2026-11-02 18:10
    events: [{accepts: W2}]
    expect:
      placed: [{who: W2, side: R, how: invitation}]
      missing: {L: 0, R: 0}
final:
  roster: {L: 4, R: 4}
