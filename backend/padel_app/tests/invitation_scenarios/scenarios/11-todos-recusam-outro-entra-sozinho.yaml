notes: >
  The PDF's level-3 right-sider only "vê a aula" at 20:00. Under the base groups he would be a group-4
  candidate from 19:00, and the PDF's jump to group 5 at 19:10 and "não há mais candidatos" at 19:20 only
  hold if he does not exist before 20:00. Encoded with `{appears: J1}` at 20:00 (coordinator's format
  decision, 2026-11-10). 19:10: everyone in group 3 refused and group 4 is empty, so group 5 is invited
  at once (cenarios.txt 172-173, R2), invited to play right (side_named R).

