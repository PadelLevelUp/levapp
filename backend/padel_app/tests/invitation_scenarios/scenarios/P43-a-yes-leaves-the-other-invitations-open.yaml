id: P43
title: a Yes leaves the other invitations open
source: {section: "PAD-804 (ticket example: six right spots, 18 candidates, equal lists)", lines: [1, 1]}
what_it_tests: six right spots ask 18 right-siders at once; after one Yes the other 17 stay open and nothing new is sent
tags: [sides, max-open, aviso]
derived_from: [D4]
corrections: []
notes: >
  PAD-804's example on the new engine (promoted from the PAD-802 triage's throwaway P91). The old engine
  gave each spot its own 3 invitees and, when spot 1 filled, told its other two "Vaga preenchida"
  (spot filled) unless another spot had no invitations of its own, and often re-invited them on the next
  batch. On the new engine invitations belong to the session, not a spot (engine-planning rule 2), and no
  fill withdraws one (rule 10, D4). Capacity 16 with 8 left and 2 right regulars gives 6 right spots;
  X = 3 wants 18. max_open is raised to 30 so the cap does not cut the first send (with the default 12,
  12 go out and the Yes tops the session back up to 12 under rule 8, which is not a withdrawal). After A's
  Yes, 17 invitations stay open, no message goes to anyone, and nothing new is sent at 19:10, 19:30 or
  when the 18 stop counting at 20:00 (no other candidate exists).

settings:
  invites_per_spot: 3
  max_open: 30
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}

roster:
  regulars: {L: 8, R: 2}
students:
  - {cohort: L3R, count: 18, level: 3, side: R}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L3R, count: 18, side_named: null, group: 3}]
      missing: {L: 0, R: 6}
  - at: 2026-11-01 19:10
    events: [{accepts: {cohort: L3R, state: invited, as: a}}]
    expect:
      placed: [{who: a, side: R, how: invitation}]
      missing: {L: 0, R: 5}
      open_unanswered: 17
      nothing_sent: true
  - at: 2026-11-01 19:30
    expect:
      invitations: none
      open_unanswered: 17
  - at: 2026-11-01 20:00
    expect:
      nothing_sent: true
      open_unanswered: 17
final:
  roster: {L: 8, R: 3}
