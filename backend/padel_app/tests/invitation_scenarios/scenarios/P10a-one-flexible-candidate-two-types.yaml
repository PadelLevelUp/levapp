  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 3, R: 3}
students:
  - {id: B1, level: 3, side: both}
  - {cohort: L3L, count: 5, level: 3, side: L}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations:
        - {who: B1, side_named: null, group: 3}
        - {cohort: L3L, count: 2, side_named: null, group: 3}
      invitations_total_sent: 3
      missing: {L: 1, R: 1}
  - at: 2026-11-01 19:10
    events: [{accepts: B1}]
    expect:
      placed: [{who: B1, side: R, how: invitation}]
      invitations: [{cohort: L3L, count: 1, side_named: null, group: 3}]
      missing: {L: 1, R: 0}
final:
