id: 84
title: várias rondas dentro do primeiro grupo
source: {section: "Cenários 80 a 90: métodos de tempo A, B e C", lines: [1811, 1834]}
what_it_tests: o tempo do grupo divide-se por rondas decrescentes, e o último terço é o tempo de espera até ao grupo seguinte
tags: [method-b, timers, rounds, groups]
derived_from: [D16, §2]
corrections: []
notes: >
  Method B, same people as 83 plus 6 more level-2 right-siders. Group 3 gets 3 h in 3 rounds: 70 min, 50 min,
  then the last third (60 min) as the wait to group 4. The 70/50 minutes are encoded as the PDF writes them
  (E4, design 6.1): no stated formula gives them, and the document's own 9:8:7:6 family would give 72/48 (the
  second round at 16:42 instead of 16:40). The 18:45 Aviso probe is derived from "Os outros convidados veem o
  Aviso se disserem Sim" (R9). Regular R-1 stands for "o regular de direita".

  Disposition (PAD-900, 2026-11-11, coordinator's reversal after reading S's specs): deferred, re-derived to
  the plan's outcome. A decreasing per-round schedule inside one tier has no formula the engine can
  implement (the 70/50 split is E4), and the spec's Method B is one round per tier. Plan outcome, checked by
  R: T fixed per invitation with between_rounds = between_groups = 60m, so group 3's rounds go at 15:30,
  16:30 and 17:30 and group 4 comes at 18:30. The owner sees this line on the disposition sheet.

  Undeferred (PAD-911, 2026-11-11, owner ruling on Tomás's answer): Method B's parts also set the rounds
  inside one tier (engine-settings rule 2). Group 3's share is 3 h (9/30 of 10 h, as in 83); its last round
  waits the last third (60 min, to group 4) and the two rounds before it split the other 2 h as 3:2, so
  72 and 48 min: rounds at 15:30, 16:42 and 17:30, group 4 at 18:30. Tomás: "No 84, a segunda ronda passa
  das 16h40 para as 16h42. A terceira continua às 17h30 e o grupo 4 às 18h30." 3 rounds = 9 candidates
  over a budget of 3 (our inference, not his words).

settings:
  timing: {method: B}

roster:
  regulars: {L: 8, R: 8}
students:
  - {cohort: L2R, count: 9, level: 2, side: R}
  - {cohort: L3R, count: 3, level: 3, side: R}
  - {cohort: L2L, count: 3, level: 2, side: L}
  - {cohort: L3L, count: 3, level: 3, side: L}

