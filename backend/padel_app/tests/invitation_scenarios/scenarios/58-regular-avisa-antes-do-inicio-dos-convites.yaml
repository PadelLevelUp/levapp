id: 58
title: um regular avisa antes do início dos convites
source: {section: "Cenários 58 a 71: respostas, faltas, cancelamentos e horários", lines: [1315, 1334]}
what_it_tests: nenhum convite sai antes da hora de início, mesmo havendo uma vaga aberta
tags: [regulars, absences, reminders]
depends_on: [U29]
corrections: []
notes: >
  The regular who says No is R-1 (cohort-form regular). The justified absence at 1 Nov 10:00 is the PDF's
  own label, decided by the 12 h cutoff (U29). The 17:00 reminder goes to the regulars still going, which
  excludes R-1, and not to the student who accepted an invitation (glossary "Lembrete").

class:
  level: 3
  capacity: 8
  start: 2026-11-03 10:30

roster:
  regulars: {L: 4, R: 4}
students:
  - {cohort: L2R, count: 5, level: 2, side: R}

timeline:
  - at: 2026-11-01 10:00
    events: [{regular_no: R-1}]
    expect:
      absences: [{who: R-1, kind: justified}]
      invitations: none
      missing: {L: 0, R: 1}
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L2R, count: 3, side_named: null, group: 3}]
  - at: 2026-11-01 19:10
    events: [{accepts: {cohort: L2R, state: invited, as: r1}}]
    expect:
      placed: [{who: r1, side: R, how: invitation}]
      missing: {L: 0, R: 0}
  - at: 2026-11-02 17:00
    expect:
      reminders:
        to: [regulars]
        not_to: [R-1, r1]
final:
  roster: {L: 4, R: 4}
