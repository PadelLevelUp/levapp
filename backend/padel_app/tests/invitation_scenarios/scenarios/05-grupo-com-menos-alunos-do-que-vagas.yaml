id: 5
title: grupo com menos alunos do que vagas
source: {section: "Cenários 1 a 11: base e grupos de prioridade", lines: [313, 335]}
what_it_tests: a aplicação avança logo para o grupo seguinte quando, mesmo que todos aceitem, faltariam alunos
tags: [groups, other-side]
derived_from: [D17, §2]
corrections: []
notes: >
  Coverage is by heads (R1): at 19:00 group 3 covers 3 of 4 spots and group 4 gets X (3) for the one
  uncovered spot, capped at its 2 candidates. At 19:20 a No leaves 4 open for 4 spots, so nothing goes out
  (R2). At 19:30 a second No leaves 3 for 4; groups 3 and 4 are exhausted, so group 5 gets X for the
  uncovered spot (R1, R2), invited to play right (side_named R). Invitations at 19:50 are not checked:
  the PDF is silent on whether group 5 runs a second round then.

  Re-derived under the plan (PAD-900, 2026-11-11): 19:00: group 3 is the ideal tier for the right (it has
  candidates), so group 4 gets 1 for the uncovered spot, not X (D17). 19:20: the 19:00 L3R stops counting (T
  20m, its tier still had a candidate) and the No leaves 2 spots to lower tiers at 1 each: the last L3R and
  one L2L named R. 19:30: d2 is pinned to the L3R invited at 19:00, which no longer counts, so nothing
  changes.

roster:
  regulars: {L: 8, R: 4}
students:
  - {cohort: L2R, count: 3, level: 2, side: R}
  - {cohort: L3R, count: 2, level: 3, side: R}
  - {cohort: L2L, count: 6, level: 2, side: L}

