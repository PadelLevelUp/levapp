id: 29
title: o professor adiciona um aluno com convites abertos
source: {section: "Cenários 19 a 31: waiting list antes e depois dos lembretes", lines: [771, 789]}
what_it_tests: a entrada automática ocupa a vaga mesmo com convites abertos
tags: [coach-list, waiting-list, rounds, aviso, reminders]
depends_on: [U16, U25]
corrections: []
notes: >
  The 19:20 round sends 2, not 3: X × 1 spot = 3, capped by the 2 candidates left in the group (R1, R11).
  The open level-2 invitations stay valid after the class fills, so a later Sim gets the Aviso (glossary
  "Convite aberto"; tagged U25). W1 has no level (level null).

roster:
  regulars: {L: 8, R: 7}
students:
  - {id: W1, level: null, side: R}
  - {cohort: L2R, count: 5, level: 2, side: R}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L2R, count: 3, side_named: null, group: 3}]
  - at: 2026-11-01 19:20
    expect:
      invitations: [{cohort: L2R, count: 2, side_named: null, group: 3}]
      open_unanswered: 5
  - at: 2026-11-01 19:30
    events:
      - {coach_adds_to_waiting_list: W1, side: R}
    expect:
      placed: [{who: W1, side: R, how: auto_from_waiting_list}]
      messages: [{who: W1, kind: added}]
      missing: {L: 0, R: 0}
  - at: 2026-11-01 19:40
    events: [{accepts: {cohort: L2R, state: invited, as: a}}]
    expect:
      messages: [{who: a, kind: aviso}]
  - at: 2026-11-02 17:00
    expect:
      reminders: {to: [regulars, W1]}
final:
  roster: {L: 8, R: 8}
