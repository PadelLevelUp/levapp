id: 17
title: o limite é atingido entre dois grupos
source: {section: "Cenários 12 a 18: máximo de convites em simultâneo", lines: [539, 559]}
what_it_tests: o grupo prioritário entra primeiro e o grupo seguinte fica com o espaço que sobra no limite
tags: [max-open, groups, rounds, timers]
depends_on: [U5]
corrections: []
notes: >
  19:00 is one round across two groups: group 3 covers 2 spots by heads and group 4 gets X for the 6
  uncovered spots (18), capped at the 10 places left under M (R1). 19:20: a new round sends X x spots
  without subtracting the 12 open (R11), capped at the 10 remaining candidates. 20:20 is 60 min after the
  last round; no group has candidates, so nothing goes out and 22 stay open.

roster:
  regulars: {L: 8, R: 0}
students:
