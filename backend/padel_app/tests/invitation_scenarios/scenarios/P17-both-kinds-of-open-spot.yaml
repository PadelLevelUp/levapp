id: P17
title: both kinds of open spot
source: {section: "Plano §9.3 Regulars and absences", lines: [262, 264]}
what_it_tests: a spot with no regular and a spot freed by an absence are filled the same way
tags: [regulars, absences]
derived_from: [S17, §2, §8 step 4]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). L-1's No before invitations start is justified. The engine sees 2 left and 1 right: 6 and 3
  invitations. The coach's view (2 spots with no regular, 1 absence) is not observable here.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 3, R: 3}
students:
  - {cohort: L3L, count: 10, level: 3, side: L}
  - {cohort: L3R, count: 10, level: 3, side: R}

timeline:
  - at: 2026-11-01 10:00
    events: [{regular_no: L-1}]
    expect:
      absences: [{who: L-1, kind: justified}]
      invitations: none
      missing: {L: 2, R: 1}
  - at: 2026-11-01 19:00
    expect:
      invitations:
        - {cohort: L3L, count: 6, side_named: null, group: 3}
        - {cohort: L3R, count: 3, side_named: null, group: 3}
final:
  roster: {L: 2, R: 3}
