id: P06
title: lower group answers first
source: {section: "Plano §9.1 Coverage and group order", lines: [237, 237]}
what_it_tests: priority decides who is asked first, not who wins
tags: [groups, other-side, aviso]
derived_from: [S6, D4, D9]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). The right-siders' late Yes gets the Aviso (sorry plus the waiting-list offer).

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 4, R: 3}
students:
  - {cohort: L3R, count: 3, level: 3, side: R}
  - {cohort: L3L, count: 3, level: 3, side: L}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L3R, count: 3, side_named: null, group: 3}]
  - at: 2026-11-01 20:00
    expect:
      invitations: [{cohort: L3L, count: 3, side_named: R, group: 4}]
  - at: 2026-11-01 20:10
    events: [{accepts: {cohort: L3L, state: invited, as: l1}}]
    expect:
      placed: [{who: l1, side: R, how: invitation}]
      missing: {L: 0, R: 0}
  - at: 2026-11-01 20:15
    events: [{accepts: {cohort: L3R, state: invited, as: r1}}]
    expect:
      messages: [{who: r1, kind: aviso}]
final:
  roster: {L: 4, R: 4}
