id: 44
title: quem recusou muda de ideias
source: {section: "Cenários 32 a 46: waiting list, lados, Aviso e entrada direta", lines: [1060, 1075]}
what_it_tests: a regra de não convidar duas vezes não impede o aluno de entrar sozinho numa vaga aberta
tags: [direct-join, reminders]
depends_on: [U23, U24]
corrections: []
notes: >
  After the 19:10 No there is no other candidate in any group, so nothing is sent (R2). At 21:00 the
  same student joins directly and is not invited again (invitations_total_sent stays 1). The reminder
  goes to them because they joined directly (glossary "Lembrete").

roster:
  regulars: {L: 8, R: 7}
students:
  - {cohort: L2R, count: 1, level: 2, side: R}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: [{cohort: L2R, count: 1, side_named: null, group: 3}]
  - at: 2026-11-01 19:10
    events: [{declines: {cohort: L2R, state: invited, as: a}}]
    expect:
      invitations: none
      missing: {L: 0, R: 1}
  - at: 2026-11-01 21:00
    events: [{joins_directly: a}]
    expect:
      placed: [{who: a, side: R, how: direct}]
      missing: {L: 0, R: 0}
      invitations_total_sent: 1
  - at: 2026-11-02 17:00
    expect:
      reminders:
        to: [regulars, a]
final:
  roster: {L: 8, R: 8}
