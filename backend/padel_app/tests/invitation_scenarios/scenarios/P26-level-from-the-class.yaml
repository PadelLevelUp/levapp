id: P26
title: level from the class
source: {section: "Plano §9.5 Messages, levels, timing", lines: [290, 290]}
what_it_tests: an open spot's level is the class's, not the leaving player's
tags: [eligibility, groups]
derived_from: [S26, D3]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). R1 is one level above the class and says No. Groups: class level, same side first, then one above. If
  the spot took R1's level, group 1 would be the level-2 right-siders; it is the level-3 ones.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: +1, side: same}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars:
    - {id: R1, side: R, level: 2}
    - {id: R2, side: R}
    - {id: R3, side: R}
    - {id: R4, side: R}
    - {id: G1, side: L}
    - {id: G2, side: L}
    - {id: G3, side: L}
    - {id: G4, side: L}
students:
  - {cohort: L3R, count: 3, level: 3, side: R}
  - {cohort: L2R, count: 3, level: 2, side: R}

timeline:
  - at: 2026-11-02 10:00
    events: [{regular_no: R1}]
    expect:
      invitations: [{cohort: L3R, count: 3, side_named: null, group: 3}]
final:
  roster: {L: 4, R: 3}
