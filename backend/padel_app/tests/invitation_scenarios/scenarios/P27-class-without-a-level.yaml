id: P27
title: a class without a level
source: {section: "Plano §9.5 Messages, levels, timing", lines: [291, 291]}
what_it_tests: no level rule applies in any group when the class has no level
tags: [eligibility, groups]
derived_from: [S27, D3]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). The class has no level, so no group's level part applies and there is no class level to measure
  eligibility from: right-siders of levels 2, 4 and 5 are all group 1 for the right spot. Format addition:
  class.level may be null.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: null, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 4, R: 3}
students:
  - {cohort: L2R, count: 1, level: 2, side: R}
  - {cohort: L4R, count: 1, level: 4, side: R}
  - {cohort: L5R, count: 1, level: 5, side: R}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations:
        - {cohort: L2R, count: 1, side_named: null, group: 3}
        - {cohort: L4R, count: 1, side_named: null, group: 3}
        - {cohort: L5R, count: 1, side_named: null, group: 3}
      invitations_total_sent: 3
final:
  roster: {L: 4, R: 3}
