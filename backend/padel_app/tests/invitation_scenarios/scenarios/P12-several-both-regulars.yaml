id: P12
title: several both-sides regulars
source: {section: "Plano §9.2 Distinct people and flexible students", lines: [254, 254]}
what_it_tests: one either spot invites the top 3 from both sides, and the both-sides regulars take the sides left
tags: [both-sides, regulars, tiebreak, aviso]
derived_from: [S12, §4, §8 step 6]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). Participations make the top 3 L3L-1, L3R-1 and L3L-2. A left-sider's Yes leaves 2 left places and 2
  right ones: at last_invite_at one both-sides regular plays left and two play right, each notified. A later
  Yes gets the Aviso.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 2, R: 2, both: 3}
students:
  - {cohort: L3L, count: 10, level: 3, side: L, participations: [5, 3, 0, 0, 0, 0, 0, 0, 0, 0]}
  - {cohort: L3R, count: 10, level: 3, side: R, participations: [4, 0, 0, 0, 0, 0, 0, 0, 0, 0]}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations:
        - {cohort: L3L, count: 2, side_named: null, group: 3}
        - {cohort: L3R, count: 1, side_named: null, group: 3}
      missing: {total: 1}
  - at: 2026-11-01 19:10
    events: [{accepts: {cohort: L3L, state: invited, as: l1}}]
    expect:
      placed: [{who: l1, side: L, how: invitation}]
      missing: {total: 0}
  - at: 2026-11-01 19:20
    events: [{accepts: {cohort: L3R, state: invited, as: r1}}]
    expect:
      messages: [{who: r1, kind: aviso}]
  - at: 2026-11-03 08:30
    derived_from: [§8 step 6]
    expect:
      roster: {L: 4, R: 4}
      messages:
        - {who: B-1, kind: side_moved}
        - {who: B-2, kind: side_moved}
        - {who: B-3, kind: side_moved}
final:
  roster: {L: 4, R: 4}
