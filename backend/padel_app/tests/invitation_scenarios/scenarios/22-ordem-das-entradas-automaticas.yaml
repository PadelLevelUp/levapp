id: 22
title: ordem das entradas automáticas
source: {section: "Cenários 19 a 31: waiting list antes e depois dos lembretes", lines: [639, 658]}
what_it_tests: >
  a ordem dos grupos (primeiro a waiting list do professor, depois a dos alunos) mantém-se nas entradas
  automáticas, e só depois saem convites
tags: [coach-list, waiting-list, groups]
depends_on: [U16, U17, U18]
corrections: []
notes: >
  Setup step at 1 Nov 19:00 (derived): S1 joins the students' list before the coach adds W1, so the
  student "está na lista há mais tempo" is expressed by event order. Regulars A, B, C are R-1, R-2, R-3.
  S1 and W1 have no level in the PDF (level null). The 11:00 round is group 3 because both lists are
  empty after the two automatic entries.

class: {level: 3, capacity: 8, start: 2026-11-03 10:30}
roster:
  regulars: {L: 4, R: 4}
students:
  - {id: S1, level: null, side: R}
  - {id: W1, level: null, side: R}
  - {cohort: L2R, count: 5, level: 2, side: R}

timeline:
  - at: 2026-11-01 19:00
    derived: true
    events:
      - {joins_waiting_list: S1, sides: own}
      - {coach_adds_to_waiting_list: W1, side: R}
    expect:
      invitations: none
      waiting_list: {coach: [W1], students: [S1]}
  - at: 2026-11-02 09:00
    events: [{regular_no: R-1}]
    expect:
      placed: [{who: W1, side: R, how: auto_from_waiting_list}]
      messages: [{who: W1, kind: added}]
      invitations: none
  - at: 2026-11-02 10:00
    events: [{regular_no: R-2}]
    expect:
      placed: [{who: S1, side: R, how: auto_from_waiting_list}]
      messages: [{who: S1, kind: added}]
      invitations: none
  - at: 2026-11-02 11:00
    events: [{regular_no: R-3}]
    expect:
      invitations: [{cohort: L2R, count: 3, side_named: null, group: 3}]
      missing: {L: 0, R: 1}
  - at: 2026-11-02 11:10
    events: [{accepts: {cohort: L2R, state: invited, as: r1}}]
    expect:
      placed: [{who: r1, side: R, how: invitation}]
      missing: {L: 0, R: 0}
final:
  roster: {L: 4, R: 4}
