id: 24
title: lembretes mais cedo mudam a fronteira
source: {section: "Cenários 19 a 31: waiting list antes e depois dos lembretes", lines: [677, 696]}
what_it_tests: a fronteira acompanha a hora definida pelo professor
tags: [coach-list, waiting-list, reminders]
depends_on: [U16]
corrections: []
notes: >
  Setup step at 1 Nov 19:00 (derived), when the class is full. Reminders: day before at 10:00, every
  2 h, max 3, so they go out at 10:00, 12:00 and 14:00. Reminders are not checked at 12:00 because a
  reminder and the invitation both happen then. The 14:00 probe (derived) makes "não recebe lembretes,
  porque aceitou um convite" testable. W1 has no level (level null).

settings:
  reminders: {days_before: 1, at: "10:00", every: 2h, max: 3}
roster:
  regulars: {L: 8, R: 8}
students:
  - {id: W1, level: null, side: R}
  - {cohort: L2R, count: 5, level: 2, side: R}

timeline:
  - at: 2026-11-01 19:00
    derived: true
    events:
      - {coach_adds_to_waiting_list: W1, side: R}
    expect: {invitations: none}
  - at: 2026-11-02 10:00
    expect:
      reminders: {to: [regulars], not_to: [W1]}
  - at: 2026-11-02 12:00
    events: [{regular_no: R-1}]
    expect:
      invitations: [{who: W1, group: 1}]
      missing: {L: 0, R: 1}
  - at: 2026-11-02 12:10
    events: [{accepts: W1}]
    expect:
      placed: [{who: W1, side: R, how: invitation}]
      missing: {L: 0, R: 0}
  - at: 2026-11-02 14:00
    derived: true
    expect:
      reminders: {not_to: [W1]}
final:
  roster: {L: 8, R: 8}
