id: 45
title: um aluno entra antes de a waiting list responder
source: {section: "Cenários 32 a 46: waiting list, lados, Aviso e entrada direta", lines: [1076, 1091]}
what_it_tests: "depois dos lembretes, o convite da waiting list não reserva a vaga: quem responde primeiro fica com ela"
tags: [direct-join, coach-list, waiting-list, aviso, regulars]
depends_on: [U23, U24, U26]
corrections: []
notes: >
  W1 (coach's list, no level given) and J1 (level 3, right) are labels for the PDF's unnamed students.
  The PDF has W1 on the coach's list from the start; the first step (derived) puts them there while the
  class is full, so nothing happens. At 18:00 on 2 Nov, after the reminder hour, the opening produces
  an invitation to W1 (group 1), not an automatic entry. J1 (group 4) is not invited because W1 covers
  the spot by heads (R1). The absence kind of R-1's No is not stated in the PDF and is not checked.

roster:
  regulars: {L: 8, R: 8}
students:
  - {id: W1, level: null, side: R}
  - {id: J1, level: 3, side: R}

timeline:
  - at: 2026-11-01 18:00
    derived: true
    events: [{coach_adds_to_waiting_list: W1, side: R}]
    expect:
      invitations: none
      waiting_list: {coach: [W1]}
  - at: 2026-11-02 18:00
    events: [{regular_no: R-1}]
    expect:
      invitations: [{who: W1, side_named: null, group: 1}]
      missing: {L: 0, R: 1}
  - at: 2026-11-02 18:05
    events: [{joins_directly: J1}]
    expect:
      placed: [{who: J1, side: R, how: direct}]
      missing: {L: 0, R: 0}
  - at: 2026-11-02 18:10
    events: [{accepts: W1}]
    expect:
      messages: [{who: W1, kind: aviso}]
      waiting_list: {coach: [W1]}
final:
  roster: {L: 8, R: 8}
