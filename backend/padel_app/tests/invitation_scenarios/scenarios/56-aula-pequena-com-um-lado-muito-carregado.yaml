what_it_tests: a aplicação ajuda a equilibrar com os convites, sem impor o lado de cada aluno no fim
tags: [unbalanced, regulars]
derived_from: [§8 step 6, S18]
corrections: []
notes: >
  Capacity 8 (4 per side). 5 right regulars is over half, so the missing count is for the whole class
  (2) and the invitations go to the under-filled left (R6): 2 × 3 = 6. No one is moved to another side
  (U11).

  Re-derived under the plan (PAD-900, 2026-11-11): At last_invite_at one right regular over the quota moves
  left and is notified (§8 step 6, S18; coordinator F2); on a tie, the regular who joined most recently
  (R-5). The added 08:30 step is an observation.

