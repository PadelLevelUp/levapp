id: P24
title: waiting-list placement
source: {section: "Plano §9.4 Waiting list", lines: [285, 285]}
what_it_tests: a waiting-list Yes takes the student's own side when it is open
tags: [waiting-list, sides]
derived_from: [S24, D7, D20]
corrections: []
notes: >
  Plan scenario, encoded from docs/plans/invitation-engine-redesign.md §9 (source lines are that file's).
  Plan §9 defaults: capacity 8 (4 per side), X = 3, one inactivity time T = 60m (between_rounds =
  between_groups, so timing (c) is the plan's single T). Groups: the two waiting lists, side-free (D12), then
  the plan's group 1 = same side at the class level (format group 3) and group 2 = other side (format group
  4). A left spot and a right spot are open from the start (3 L and 3 R regulars; the harness applies two Nos
  in one step one after the other, with a run between, as for P10). W1, a right-sider two levels above the
  class (eligible, in no group, as in P23), joins the waiting list after the reminder hour and is invited for
  either side, no side named, and placed on the right on Yes, even with nobody else for the left.

settings:
  timing: {method: A, between_rounds: 60m, between_groups: 60m}
  groups:
    - {list: coach, side: any}
    - {list: students, side: any}
    - {level: 0, side: same}
    - {level: 0, side: other}
class: {level: 3, capacity: 8, start: 2026-11-03 10:30}

roster:
  regulars: {L: 3, R: 3}
students:
  - {id: W1, level: 1, side: R}

timeline:
  - at: 2026-11-01 19:00
    expect:
      invitations: none
      missing: {L: 1, R: 1}
  - at: 2026-11-02 18:00
    events: [{joins_waiting_list: W1, sides: both}]
    expect:
      invitations: [{who: W1, side_named: null, group: 2}]
      missing: {L: 1, R: 1}
  - at: 2026-11-02 18:10
    events: [{accepts: W1}]
    expect:
      placed: [{who: W1, side: R, how: invitation}]
      missing: {L: 1, R: 0}
final:
  roster: {L: 3, R: 4}
