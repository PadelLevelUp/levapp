<!-- @dsCard group="Components" viewport="700x300" subtitle="Button, Badge, FilterPill, Toggle, Input, SegmentedControl" name="Core" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}
.g{display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cap{font:600 11px/1.2 var(--font-body);letter-spacing:.1em;color:var(--text-tertiary)}</style>
<div class="g">
  <div class="cap">BUTTON</div>
  <div class="row">
    <span style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:12px;font:600 14px/1 var(--font-body);background:var(--action-primary);color:var(--text-on-accent);border:1px solid transparent;">Convidar</span>
    <span style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:12px;font:600 14px/1 var(--font-body);background:var(--action-secondary-bg);color:var(--action-secondary-fg);border:1px solid transparent;">Notificar</span>
    <span style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:12px;font:600 14px/1 var(--font-body);background:transparent;color:var(--text-secondary);border:1px solid var(--border-default);">Depois</span>
    <span style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:12px;font:600 14px/1 var(--font-body);background:transparent;color:var(--text-accent);border:1px solid transparent;">Ver</span>
    <span style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:12px;font:600 14px/1 var(--font-body);background:transparent;color:var(--action-danger);border:1px solid var(--border-default);">Eliminar</span>
    <span style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:12px;font:600 14px/1 var(--font-body);background:var(--action-primary);color:var(--text-on-accent);border:1px solid transparent;opacity:.45">Desativado</span>
  </div>
  <div class="cap">BADGE &amp; FILTER PILL</div>
  <div class="row">
    <span style="display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font:600 13px/1 var(--font-body);background:var(--status-done-bg);color:var(--status-done-fg)">Concluída</span>
    <span style="display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font:600 13px/1 var(--font-body);background:var(--status-attention-bg);color:var(--status-attention-fg)">Faltam 9</span>
    <span style="display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font:600 13px/1 var(--font-body);background:var(--status-problem-bg);color:var(--status-problem-fg)">Recusou</span>
    <span style="display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font:600 13px/1 var(--font-body);background:var(--status-progress-bg);color:var(--status-progress-fg)">Nível 3-</span>
    <span style="display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font:600 13px/1 var(--font-body);background:var(--surface-accent);color:var(--action-secondary-fg)">Convite</span>
    <span style="width:16px"></span>
    <span style="display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font:600 13px/1 var(--font-body);background:var(--surface-inverse);color:var(--text-on-inverse)">Por responder 1</span>
    <span style="display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font:600 13px/1 var(--font-body);background:var(--lv-grey-100);color:var(--text-secondary)">À espera 8</span>
  </div>
  <div class="cap">TOGGLE · SEGMENTED · INPUT</div>
  <div class="row" style="gap:20px">
    <span style="width:46px;height:27px;border-radius:999px;background:var(--action-primary);padding:3px;display:flex;justify-content:flex-end"><span style="width:21px;height:21px;border-radius:999px;background:#fff"></span></span>
    <span style="width:46px;height:27px;border-radius:999px;background:var(--border-default);padding:3px;display:flex"><span style="width:21px;height:21px;border-radius:999px;background:#fff"></span></span>
    <span style="display:flex;gap:4px;padding:4px;background:var(--lv-grey-100);border-radius:12px">
      <span style="padding:9px 14px;border-radius:10px;background:var(--surface-card);box-shadow:var(--shadow-sm);font:600 13px/1 var(--font-body)">Automações</span>
      <span style="padding:9px 14px;border-radius:10px;color:var(--text-secondary);font:600 13px/1 var(--font-body)">Conversas · 1</span>
    </span>
    <span style="display:flex;align-items:center;height:44px;padding:0 14px;border:1px solid var(--border-default);border-radius:12px;background:var(--surface-card);font:400 14px/1 var(--font-body);color:var(--text-tertiary);min-width:180px">Procurar jogador</span>
  </div>
</div>
