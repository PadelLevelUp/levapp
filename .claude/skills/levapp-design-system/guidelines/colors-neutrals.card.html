<!-- @dsCard group="Colors" viewport="700x140" subtitle="Cool greys tuned to the navy — never a warm grey" name="Neutrals" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-page); font-family:var(--font-body); color:var(--text-primary); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .cap { font:400 11px/1.3 var(--font-body); color:var(--text-tertiary); }
  .nm { font:600 12px/1.3 var(--font-body); color:var(--text-primary); }
  
</style>
<div class="row" style="flex-wrap:nowrap">
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:var(--lv-grey-50)"></div><div class="nm">50</div><div class="cap">#F6F8FB</div></div>
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:var(--lv-grey-150)"></div><div class="nm">150</div><div class="cap">#E9EDF3</div></div>
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:var(--lv-grey-300)"></div><div class="nm">300</div><div class="cap">#D3DBE6</div></div>
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:var(--lv-grey-500)"></div><div class="nm">500</div><div class="cap">#8592A8</div></div>
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:var(--lv-grey-600)"></div><div class="nm">600</div><div class="cap">#55627A</div></div>
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:var(--lv-grey-800)"></div><div class="nm">800</div><div class="cap">#101E33</div></div>
</div>
