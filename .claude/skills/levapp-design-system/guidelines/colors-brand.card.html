<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-page); font-family:var(--font-body); color:var(--text-primary); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .cap { font:400 11px/1.3 var(--font-body); color:var(--text-tertiary); }
  .nm { font:600 12px/1.3 var(--font-body); color:var(--text-primary); }
  
</style>
<div class="row" style="flex-wrap:nowrap">
<div class="col" style="flex:1"><div style="height:68px;border-radius:12px;background:var(--lv-ink-900)"></div><div class="nm">Ink 900</div><div class="cap">#0B1524</div></div>
<div class="col" style="flex:1"><div style="height:68px;border-radius:12px;background:var(--lv-navy-800)"></div><div class="nm">Navy 800</div><div class="cap">#0D1B31</div></div>
<div class="col" style="flex:1"><div style="height:68px;border-radius:12px;background:var(--lv-blue-600)"></div><div class="nm">Blue 600</div><div class="cap">#1355DC</div></div>
<div class="col" style="flex:1"><div style="height:68px;border-radius:12px;background:var(--lv-blue-500)"></div><div class="nm">Blue 500</div><div class="cap">#2F8AFF</div></div>
<div class="col" style="flex:1"><div style="height:68px;border-radius:12px;background:var(--lv-blue-400)"></div><div class="nm">Blue 400</div><div class="cap">#4A9BFF</div></div>
<div class="col" style="flex:1"><div style="height:68px;border-radius:12px;background:var(--lv-blue-100)"></div><div class="nm">Blue 100</div><div class="cap">#E8F1FF</div></div>
</div>
