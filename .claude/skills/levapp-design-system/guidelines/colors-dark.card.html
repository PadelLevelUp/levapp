<!-- @dsCard group="Colors" viewport="700x150" subtitle="Surfaces step up in lightness instead of relying on borders" name="Dark surfaces" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-page); font-family:var(--font-body); color:var(--text-primary); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .cap { font:400 11px/1.3 var(--font-body); color:var(--text-tertiary); }
  .nm { font:600 12px/1.3 var(--font-body); color:var(--text-primary); }
  body[data-theme] { background: #070E1A; }
</style>
<div data-theme="dark" style="background:#070E1A;padding:16px;border-radius:14px">
<div class="row" style="flex-wrap:nowrap">
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:#070E1A;border:1px solid #24374F"></div><div class="nm" style="color:#F2F6FC">page</div><div class="cap" style="color:#7E90AB">#070E1A</div></div>
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:#0F1B2E"></div><div class="nm" style="color:#F2F6FC">card</div><div class="cap" style="color:#7E90AB">#0F1B2E</div></div>
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:#17273F"></div><div class="nm" style="color:#F2F6FC">raised</div><div class="cap" style="color:#7E90AB">#17273F</div></div>
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:#24374F"></div><div class="nm" style="color:#F2F6FC">border</div><div class="cap" style="color:#7E90AB">#24374F</div></div>
<div class="col" style="flex:1"><div style="height:52px;border-radius:12px;background:#4A9BFF"></div><div class="nm" style="color:#F2F6FC">primary</div><div class="cap" style="color:#7E90AB">#4A9BFF</div></div>
</div></div>
