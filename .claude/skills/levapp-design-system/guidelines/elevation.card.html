<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-page); font-family:var(--font-body); color:var(--text-primary); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .cap { font:400 11px/1.3 var(--font-body); color:var(--text-tertiary); }
  .nm { font:600 12px/1.3 var(--font-body); color:var(--text-primary); }
  
</style>
<div class="row" style="gap:18px">
<div class="col" style="align-items:center;gap:8px"><div style="width:132px;height:62px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:16px;box-shadow:var(--shadow-none)"></div><div class="nm">none</div><div class="cap">List item</div></div><div class="col" style="align-items:center;gap:8px"><div style="width:132px;height:62px;background:var(--surface-card);border:none;border-radius:16px;box-shadow:var(--shadow-sm)"></div><div class="nm">sm</div><div class="cap">Toggle knob</div></div><div class="col" style="align-items:center;gap:8px"><div style="width:132px;height:62px;background:var(--surface-card);border:none;border-radius:16px;box-shadow:var(--shadow-md)"></div><div class="nm">md</div><div class="cap">Popover</div></div><div class="col" style="align-items:center;gap:8px"><div style="width:132px;height:62px;background:var(--surface-card);border:none;border-radius:16px;box-shadow:var(--shadow-lg)"></div><div class="nm">lg</div><div class="cap">Sheet / phone</div></div>
</div>
