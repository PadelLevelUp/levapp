<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-page); font-family:var(--font-body); color:var(--text-primary); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .cap { font:400 11px/1.3 var(--font-body); color:var(--text-tertiary); }
  .nm { font:600 12px/1.3 var(--font-body); color:var(--text-primary); }
  
</style>
<div class="col" style="gap:14px">
<div style="background:var(--lv-navy-800);border-radius:18px;padding:20px 26px;display:flex;align-items:center;gap:18px">
  <img src="../assets/logo/levapp-mark-on-dark.svg" width="46" height="46">
  <div style="font:700 32px/1 var(--font-display);letter-spacing:-0.02em;color:#fff">Lev<span style="color:var(--lv-blue-500)">App</span></div>
</div>
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:18px;padding:20px 26px;display:flex;align-items:center;gap:18px">
  <img src="../assets/logo/levapp-mark-on-light.svg" width="46" height="46">
  <div style="font:700 32px/1 var(--font-display);letter-spacing:-0.02em;color:var(--lv-navy-800)">Lev<span style="color:var(--lv-blue-600)">App</span></div>
</div>
</div>
