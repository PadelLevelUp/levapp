<!-- @dsCard group="Type" viewport="700x140" subtitle="Times, scores and counts are always tabular" name="Numerals" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-page); font-family:var(--font-body); color:var(--text-primary); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .cap { font:400 11px/1.3 var(--font-body); color:var(--text-tertiary); }
  .nm { font:600 12px/1.3 var(--font-body); color:var(--text-primary); }
  
</style>
<div class="row" style="gap:28px;align-items:flex-end">
<div class="col"><div style="font:var(--text-metric);font-variant-numeric:tabular-nums;letter-spacing:var(--tracking-display)">88%</div><div class="cap">--text-metric</div></div>
<div class="col"><div style="font:600 20px/1 var(--font-body);font-variant-numeric:tabular-nums">10:30 – 12:00</div><div class="cap">tabular-nums</div></div>
<div class="col"><div style="font:600 20px/1 var(--font-body);font-variant-numeric:tabular-nums">12/16</div><div class="cap">fill counts</div></div>
</div>
<div class="cap" style="margin-top:14px">Proportional figures make a column of times jitter. Every number in a list gets <code>font-variant-numeric: tabular-nums</code>.</div>
