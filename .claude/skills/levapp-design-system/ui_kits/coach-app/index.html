<!-- @startingPoint section="Coach app" subtitle="Full mobile shell with the fill-a-class flow" viewport="980x760" -->
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>LevApp — coach app</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body {
    margin: 0; min-height: 100vh; background: var(--lv-grey-150);
    font-family: var(--font-body); color: var(--text-primary);
    display: flex; align-items: center; justify-content: center; padding: 32px; gap: 40px;
  }
  body[data-theme="dark"] { background: #06101D; }
  a { color: var(--text-accent); }
  a:hover { color: var(--lv-blue-500); }
  #root { display: contents; }
</style>
</head>
<body>
<div id="root"></div>

<script>
// The design-system sources are authored as ES modules. This kit loads them at
// runtime into one shared scope so the screens can be read as plain files.
const DS = [
  "../../components/core/Button.jsx",
  "../../components/core/Badge.jsx",
  "../../components/core/Card.jsx",
  "../../components/core/Avatar.jsx",
  "../../components/core/ProgressBar.jsx",
  "../../components/core/Toggle.jsx",
  "../../components/core/Input.jsx",
  "../../components/core/SegmentedControl.jsx",
  "../../components/core/FilterPill.jsx",
  "../../components/core/Eyebrow.jsx",
  "../../components/core/Icon.jsx",
  "../../components/app/ScreenHeader.jsx",
  "../../components/app/StatCard.jsx",
  "../../components/app/ActionCard.jsx",
  "../../components/app/ClassBlock.jsx",
  "../../components/app/PlayerRow.jsx",
  "../../components/app/MessageRow.jsx",
  "../../components/app/AutomationRow.jsx",
  "../../components/app/TabBar.jsx"
];
const SCREENS = ["Painel.jsx", "Calendario.jsx", "Jogadores.jsx", "Mensagens.jsx", "ConvidarSheet.jsx"];

// Each module keeps its own scope (several declare private helpers with the same
// name); exports are collected onto NS and destructured once for the screens.
const strip = src => src.replace(/^\s*import[^;]*;\s*$/gm, "").replace(/^export\s+/gm, "");

(async () => {
  const parts = ["const NS = {};"];
  const exported = [];
  for (const p of DS) {
    const src = await (await fetch(p)).text();
    const names = [...src.matchAll(/^export function (\w+)/gm)].map(m => m[1]);
    exported.push(...names);
    parts.push(`(function(){\n${strip(src)}\nObject.assign(NS, {${names.join(", ")}});\n})();`);
  }
  parts.push(`const {${exported.join(", ")}} = NS;`);
  for (const p of SCREENS) parts.push(strip(await (await fetch(p)).text()));
  parts.push(await (await fetch("Shell.jsx")).text());
  parts.push("ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Shell));");
  const code = Babel.transform(parts.join("\n"), { presets: [["react", { runtime: "classic" }]] }).code;
  try { new Function("React", "ReactDOM", code)(window.React, window.ReactDOM); }
  catch (e) { console.error(e); document.getElementById("root").textContent = String(e); }
})();
</script>
</body>
</html>
