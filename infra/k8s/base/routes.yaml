# One HTTPRoute per host, mirroring infra/nginx/sites-available (delivery.k8s-manifests rule 3).
# Every host that serves /api/ also routes /api/app/events to the events Service, which carries the
# 3600 s backend timeout; the api Service's 60 s would cut every stream. Every HTTPS rule sets HSTS
# (delivery.transport-security). Hostnames are placeholders the overlays replace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs: [{name: levapp, sectionName: https}]
  hostnames: [app.invalid]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api/app/events}}]
      backendRefs: [{name: events, port: 80}]
      filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set: [{name: Strict-Transport-Security, value: "max-age=31536000"}]
    - matches: [{path: {type: PathPrefix, value: /api/}}]
      backendRefs: [{name: api, port: 80}]
      filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set: [{name: Strict-Transport-Security, value: "max-age=31536000"}]
    - matches: [{path: {type: PathPrefix, value: /register/}}]
      backendRefs: [{name: web, port: 80}]
      filters:
          # The activation link carries its token in the path: never in a Referer (PAD-269).
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - {name: Strict-Transport-Security, value: "max-age=31536000"}
                - {name: Referrer-Policy, value: no-referrer}
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: web, port: 80}]
      filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set: [{name: Strict-Transport-Security, value: "max-age=31536000"}]
---
# api.<host>: the API only (PAD-614); anything else is unmatched and the load balancer answers 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-host
spec:
  parentRefs: [{name: levapp, sectionName: https}]
  hostnames: [api.invalid]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api/app/events}}]
      backendRefs: [{name: events, port: 80}]
      filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set: [{name: Strict-Transport-Security, value: "max-age=31536000"}]
    - matches: [{path: {type: PathPrefix, value: /api/}}]
      backendRefs: [{name: api, port: 80}]
      filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set: [{name: Strict-Transport-Security, value: "max-age=31536000"}]
---
# The staff console (PAD-531). Its image's nginx refuses a URL that carries a token
# (frontend/apps/admin/nginx.conf), as the host vhost does on the VM.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
spec:
  parentRefs: [{name: levapp, sectionName: https}]
  hostnames: [admin.invalid]
  rules:
    - matches: [{path: {type: PathPrefix, value: /admin/api/}}]
      backendRefs: [{name: api, port: 80}]
      filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set: [{name: Strict-Transport-Security, value: "max-age=31536000"}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: admin, port: 80}]
      filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set: [{name: Strict-Transport-Security, value: "max-age=31536000"}]
---
# Plain HTTP: every host is redirected to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
spec:
  parentRefs: [{name: levapp, sectionName: http}]
  hostnames: [app.invalid, api.invalid, admin.invalid]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
