# PAD-698 (delivery.k8s-manifests): what every environment runs. Overlays set the namespace, the
# hostnames, the certificate map, the static address name and the image tags. Nothing here is
# applied by hand: the deploy workflow (PAD-703) applies an overlay with `kubectl apply -k`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: levapp
resources:
  - serviceaccount.yaml
  - api.yaml
  - events.yaml
  - worker.yaml
  - web.yaml
  - admin.yaml
  - gateway.yaml
  - routes.yaml
  - policies.yaml
