# The backend's identity (api, events, worker, migrate). PAD-701 (C3) binds it to a Google service
# account through Workload Identity; the annotation's value is a placeholder the deploy workflow
# fills from a GitHub variable, so no project identifier is tracked (R-036).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: levapp-backend
  annotations:
    iam.gke.io/gcp-service-account: GSA_BACKEND
# PAD-703: every pod pulls with credentials (levapp-registry, written by the deploy workflow from
# the Docker Hub secrets): private repositories need them, and public ones would hit Docker Hub's
# anonymous pull cap from GKE's shared node egress.
imagePullSecrets:
  - name: levapp-registry
---
# web and admin: pull credentials only; no Google identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: levapp-web
imagePullSecrets:
  - name: levapp-registry
