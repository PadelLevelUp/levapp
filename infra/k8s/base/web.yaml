# The web image (nginx serving the static build; delivery.k8s-manifests rule 1). Its own nginx
# keeps the redacted access log; the load balancer's is off (rule 4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app.kubernetes.io/name: web}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: levapp-web
          ports: [{name: http, containerPort: 80}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop: {exec: {command: ["sleep", "10"]}}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {app.kubernetes.io/name: web}
spec:
  selector: {app.kubernetes.io/name: web}
  ports: [{name: http, port: 80, targetPort: http}]
