# PAD-698 rule 5: the staging migrate Job, applied on its own by the deploy workflow.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging-levapp
resources:
  - ../../../jobs
components:
  - ../config
images:
  - {name: levapp-backend, newName: REGISTRY/levelup_backend, newTag: staging}
