# PAD-588 (delivery.zero-downtime-deploy rule 5): the API answers on one of two loopback ports.
# backend/scripts/rollout.sh starts the new container on the idle port, waits for /healthz, then
# stops the old one, so at any moment one or both ports answer. nginx's default
# `proxy_next_upstream error timeout` retries a refused connection on the other server; it does so
# even for a POST, because a refused connect sent no byte of the request.
# A server that refused is skipped for fail_timeout, then tried again.
upstream levapp_api {
    server 127.0.0.1:5000 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:5002 max_fails=1 fail_timeout=5s;
}

upstream levapp_api_staging {
    server 127.0.0.1:5100 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:5102 max_fails=1 fail_timeout=5s;
}
