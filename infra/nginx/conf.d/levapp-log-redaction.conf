# B-182, B-183 (PAD-435): keep URL secrets out of the access log.
#
# EventSource cannot set headers, so the SSE endpoint takes the access token in the query string
# (GET /api/app/events?token=<JWT>, R-009). The stock "combined" format logs $request, the whole
# request line, so every SSE connection wrote a live 30-day token to access.log. The activation
# link carries its secret the same way (/register/<id>?t=<secret>, then the account lookup's
# ?token=), and the page's own requests repeat it in their Referer (B-183). This format logs the
# same fields as combined, with the URI from the first map below, which cuts any query that carries
# a `t=`, `token=` or `access_token=` parameter down to "?[redacted]" and leaves every other request
# as it was, and the Referer from the second, which drops every Referer's query.
#
# Loaded at http level (nginx.conf includes conf.d/*.conf); each server block in
# sites-available/ selects it with `access_log /var/log/nginx/access.log redacted;`, which
# replaces the http-level combined log for that server.

map $request_uri $levapp_log_request_uri {
    default $request_uri;
    "~*^(?<levapp_log_path>[^?]*)\?(.*&)?(t|token|access_token)=" "${levapp_log_path}?[redacted]";
}

map $http_referer $levapp_log_referer {
    default $http_referer;
    "" "-";  # no Referer logs as "-", as in combined
    "~^(?<levapp_log_referer_base>[^?]*)\?" "${levapp_log_referer_base}?[redacted]";
}

log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $levapp_log_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$levapp_log_referer" "$http_user_agent"';
