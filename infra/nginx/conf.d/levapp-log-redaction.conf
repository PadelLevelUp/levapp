# B-182 (PAD-435): keep access tokens out of the access log.
#
# EventSource cannot set headers, so the SSE endpoint takes the access token in the query string
# (GET /api/app/events?token=<JWT>, R-009). The stock "combined" format logs $request, the whole
# request line, so every SSE connection wrote a live 30-day token to access.log. This format logs
# the same fields with the URI from the map below, which cuts any query that carries a `token=`
# (or `access_token=`) parameter down to "?[redacted]" and leaves every other request as it was.
#
# Loaded at http level (nginx.conf includes conf.d/*.conf); each server block in
# sites-available/ selects it with `access_log /var/log/nginx/access.log redacted;`, which
# replaces the http-level combined log for that server.

map $request_uri $levapp_log_request_uri {
    default $request_uri;
    "~*^(?<levapp_log_path>[^?]*)\?(.*&)?(access_)?token=" "${levapp_log_path}?[redacted]";
}

log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $levapp_log_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
