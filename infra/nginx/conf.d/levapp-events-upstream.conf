# PAD-697 (delivery.events-role): the events process (ROLE=events, gunicorn's gevent worker) on its
# own loopback port pair, swapped by rollout.sh like levapp_api. rollout.sh reads fail_timeout from
# this file for B-664's wait (the workflow points NGINX_UPSTREAM_CONF here for the events call).
# Staging only: prod's events role waits for PAD-704's two-copies proof (and PAD-692's prod flip,
# because the events role needs SSE_BROKER=postgres).
upstream levapp_events_staging {
    server 127.0.0.1:5104 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:5106 max_fails=1 fail_timeout=5s;
}
