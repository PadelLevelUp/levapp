# PAD-554 (B-382): the real client address behind Cloudflare.
#
# A request that reaches nginx through Cloudflare's proxy has a Cloudflare edge as its TCP peer.
# Not all traffic does: on 2026-10-08 only 17 of the last 1,725 access-log lines had a peer inside
# Cloudflare's ranges (DNS-only records, or direct hits on the VM's address). Both cases are handled
# here: a Cloudflare peer is replaced by the client it names, any other peer is kept as it is.
# Source of the ranges below: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6,
# fetched 2026-10-08. To refresh: curl both, replace the set_real_ip_from lines, update
# CLOUDFLARE in backend/padel_app/tests/test_pad554_real_ip.py, nginx -t, reload.
#
# For a request whose peer is in Cloudflare's published ranges, $remote_addr becomes the CF-Connecting-IP Cloudflare sets. A request from
# anywhere else (straight to the VM) keeps its socket peer: a forged CF-Connecting-IP from outside
# Cloudflare is ignored. Every vhost already forwards X-Real-IP $remote_addr to the backend, which
# keys its rate limits on that header alone (backend/padel_app/utils/rate_limit.py client_ip).
# X-Forwarded-For is never trusted. Included at http level from /etc/nginx/conf.d/.
#
# Refresh the ranges when Cloudflare announces a change; test_pad554_real_ip pins this list.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive off;
