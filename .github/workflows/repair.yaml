name: VM Repair and Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose-and-repair:
    runs-on: ubuntu-latest
    steps:
    - name: Diagnose and repair on GCE
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        command_timeout: 10m
        script: |
          echo "=== uptime ==="
          uptime
          echo "=== docker ps -a ==="
          sudo docker ps -a
          # PAD-641 (delivery.repair-diagnostics rules 1-2): the Actions log is on GitHub, and
          # app log lines and query text can carry names and e-mails (psycopg2 inlines
          # parameters). The log tail stays on the VM, owner-only; only counts and exception
          # class names are printed here.
          echo "=== padelapp logs (last 200 lines, counts only) ==="
          LOGDIR="$HOME/repair-logs"
          mkdir -p -m 700 "$LOGDIR"
          LOGF="$LOGDIR/padelapp-$(date -u +%Y%m%dT%H%M%SZ).log"
          (umask 077; sudo docker logs padelapp --tail 200 > "$LOGF" 2>&1) || true
          echo "saved on the VM: ~/repair-logs/$(basename "$LOGF") ($(wc -l < "$LOGF") lines)"
          for level in CRITICAL ERROR WARNING Traceback; do echo "$level: $(grep -c "$level" "$LOGF" || true)"; done
          echo "exception classes (count, name):"
          grep -oE '[A-Za-z_][A-Za-z0-9_.]*(Error|Exception)' "$LOGF" | sort | uniq -c | sort -rn | head -n 10 || true
          find "$LOGDIR" -name 'padelapp-*.log' -mtime +14 -delete 2>/dev/null || true
          echo "=== nightly backup (PAD-296, R-028) ==="
          cat ~/backup.status 2>/dev/null || echo "no ~/backup.status yet — the backup has never run"
          tail -n 5 ~/backup.log 2>/dev/null || echo "no ~/backup.log"
          BUCKET=$(grep -s '^BACKUP_BUCKET=' ~/.backup.env | cut -d= -f2-)
          if [ -n "$BUCKET" ]; then gsutil ls -l "$BUCKET/padel_app/" 2>&1 | tail -n 3; else echo "no ~/.backup.env — deploy-prod has not run since PAD-296"; fi
          # B-090: this section printed the log and the bucket but never the
          # SCHEDULE, so a crontab with no backup line looked exactly like a
          # healthy one that had not run yet. Read-only.
          crontab -l 2>/dev/null | grep 'backup\.sh' || echo "NO backup.sh line in the crontab — the nightly backup is NOT SCHEDULED"
          echo "=== postgres activity ==="
          # PAD-641 (rule 3): query_id and wait events, never the query text.
          Q_ACTIVITY="SELECT pid, usename, datname, state, wait_event_type, wait_event, now()-xact_start AS xact_age, query_id FROM pg_stat_activity WHERE xact_start IS NOT NULL OR state <> 'idle' ORDER BY xact_start;"
          Q_BLOCKING="SELECT blocked.pid AS blocked_pid, blocked.query_id AS blocked_query_id, blocking.pid AS blocking_pid, blocking.state AS blocking_state, now()-blocking.xact_start AS blocking_xact_age, blocking.query_id AS blocking_query_id FROM pg_stat_activity blocked JOIN unnest(pg_blocking_pids(blocked.pid)) AS bp(pid) ON true JOIN pg_stat_activity blocking ON blocking.pid = bp.pid;"
          PG=$(sudo docker ps --format '{{.Names}}' | grep -i -m1 'postgres\|db' || true)
          echo "PG container: ${PG:-none}"
          if [ -n "$PG" ]; then
            sudo docker exec "$PG" psql -U postgres -c "$Q_ACTIVITY" || true
            sudo docker exec "$PG" psql -U postgres -c "$Q_BLOCKING" || true
          elif systemctl is-active postgresql >/dev/null 2>&1; then
            sudo -u postgres psql -c "$Q_ACTIVITY" || true
            sudo -u postgres psql -c "$Q_BLOCKING" || true
          fi
          echo "=== guest agent status ==="
          sudo systemctl status google-guest-agent --no-pager 2>&1 | head -20 || true
          echo "=== restarting guest agent ==="
          sudo systemctl restart google-guest-agent || sudo systemctl start google-guest-agent || true
          sleep 3
          sudo systemctl is-active google-guest-agent || true
          echo "=== memory and disk ==="
          free -m
          df -h /
