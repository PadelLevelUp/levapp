name: Deploy frontend to staging

# Serves staging.levapp.app from container levelup_frontend_staging on host
# port 3100. The SPA calls a relative /api, so which backend it reaches is
# decided by the nginx vhost on the VM, not by this build.
on:
  push:
    branches: [ staging ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-staging.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-gce-frontend-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/levelup_frontend:staging
          platforms: linux/amd64

      - name: Deploy on GCE
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: |
            docker network create levelup_net || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/levelup_frontend:staging
            docker stop levelup_frontend_staging || true && docker rm levelup_frontend_staging || true
            docker run -d --name levelup_frontend_staging \
              --restart unless-stopped \
              --network levelup_net \
              --memory 100m \
              -p 3100:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/levelup_frontend:staging
            docker image prune -f || true
