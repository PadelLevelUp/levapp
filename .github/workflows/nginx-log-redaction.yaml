name: nginx log redaction

# B-182 (PAD-435). EventSource cannot set headers, so the SSE endpoint takes the
# access token in the query string (R-009), and the host nginx logged it in full:
# a live 30-day token in access.log on every SSE connection, and in error.log on
# every upstream error. This runs the tracked host config (infra/nginx/, the VM's
# files) and the web image's nginx.conf in the same nginx images, sends a token
# request to every vhost and port, and fails if the token reaches either log.
# It also fails on `nginx -t`, so a broken vhost never gets as far as the VM.
#
# No workflow-level `paths:` filter: a required check that is skipped blocks the
# PR forever (see deploy-staging.yaml). Docker is preinstalled on ubuntu-latest.

on:
  pull_request:
    branches: [ staging, main ]
  push:
    branches: [ staging, main ]

concurrency:
  group: nginx-log-redaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redaction:
    name: nginx keeps tokens out of its logs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # PAD-739: our GHCR copy (mirror-ci-images.yaml), pulled with the run's GITHUB_TOKEN.
      NGINX_IMAGE: ghcr.io/padellevelup/ci-nginx:1.27
      NGINX_FALLBACK: public.ecr.aws/docker/library/nginx:1.27
    steps:
      - uses: actions/checkout@v4
      # PAD-598 follow-up: one image for both steps (one pull per job), and that image cached
      # between runs as a tarball keyed by its tag, so a runner with a warm cache pulls nothing.
      # Even AWS's public mirror throttles anonymous pulls per IP (`toomanyrequests: Rate
      # exceeded` on 2026-10-09; `Data limit exceeded` on every cache miss of 2026-10-22).
      - uses: actions/cache@v4
        id: nginx-image
        with:
          path: /tmp/nginx-image.tar
          key: docker-image-${{ env.NGINX_IMAGE }}
      - name: Log in to GHCR
        if: steps.nginx-image.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The fallback covers the window before the mirror first publishes ci-nginx (the PR that adds
      # it, and the staging push that runs both workflows at once); it is the old anonymous pull.
      - name: Load the cached nginx image, or pull it once
        run: |
          if [ -f /tmp/nginx-image.tar ]; then
            docker load -i /tmp/nginx-image.tar
          else
            if ! docker pull "$NGINX_IMAGE"; then
              echo "::warning::could not pull $NGINX_IMAGE; falling back to $NGINX_FALLBACK"
              docker pull "$NGINX_FALLBACK"
              docker tag "$NGINX_FALLBACK" "$NGINX_IMAGE"
            fi
            docker save -o /tmp/nginx-image.tar "$NGINX_IMAGE"
          fi
      - name: Host nginx (infra/nginx)
        run: bash infra/nginx/check-log-redaction.sh infra/nginx
      - name: Web image nginx (frontend/apps/web/nginx.conf)
        env:
          # The script's --web path reads NGINX_WEB_IMAGE; the same image as the host step, so
          # the job pulls once. The web container's real base is nginx:1.27-alpine; the check
          # exercises config and logging, which do not differ between the two builds.
          NGINX_WEB_IMAGE: ${{ env.NGINX_IMAGE }}
        run: bash infra/nginx/check-log-redaction.sh --web frontend/apps/web/nginx.conf
