name: Android build

# PAD-297 (Android wave A, child of PAD-290): the first Android lane.
#
#   apk      — `expo prebuild -p android` + `gradlew assembleRelease` on the
#              GitHub runner (JDK 17 and the Android SDK are preinstalled; nothing
#              is installed on any developer machine). The release APK is signed
#              with the Expo template's DEBUG keystore — installable, JS bundled,
#              no Metro — and uploaded as the artefact `levapp-android-apk`.
#              Its JS is bundled with EXPO_PUBLIC_API_URL=http://10.0.2.2:5001/api
#              (the emulator's alias for the runner) and cleartext HTTP allowed
#              by apps/mobile/plugins/with-ci-cleartext, which only acts when
#              LEVAPP_CI_APK=1 is set at prebuild. The job proves that too: it
#              prebuilds WITHOUT the flag first and fails if that manifest
#              carries the permission, so a store build can never inherit it.
#   maestro  — Postgres 15 service, the backend's real migrations + the E2E
#              seed into an isolated database (levelup_ci_android — never
#              levelup_test), Flask on :5001, an x86_64 API 34 emulator (KVM),
#              and Maestro running MAESTRO_FLOWS against the APK. Results
#              (junit + Maestro's screenshots/logs) are uploaded always.
#
# Triggers: pull requests into staging that touch the mobile app, the shared
# packages or this file (path filtering inside the job, like every other
# workflow here — a workflow-level filter would report "skipped", not
# "success"); and workflow_dispatch with a `flows` input once the file is on
# staging. A branch gets its run by opening a (draft) PR.
#
# Flow policy (PAD-298, agreed with the coordinator): a pull request runs the
# SMOKE list only — login, Semana, Mês and the Android evidence flow, ~6 min after
# the APK — so mobile-touching PRs and batch PRs do not pay the ~75 min of the
# whole suite. The WHOLE suite (`.` = the workspace in config.yaml's flowsOrder,
# continueOnFailure) runs nightly on the schedule below and on demand through
# workflow_dispatch (its `flows` input defaults to `.`). Since PAD-710 the whole
# suite runs as parallel shards cut by flow name (.maestro/android-shards.json,
# delivery.android-nightly-lane), each under a watchdog that names a slow flow; a
# PR that changes the lane itself runs the whole suite as shards too.

on:
  pull_request:
    branches: [ staging ]
  schedule:
    # Nightly full Android suite, 03:00 UTC.
    #
    # This fires only once the workflow reaches the repository's DEFAULT branch
    # (`main`): GitHub schedules a workflow from the default branch's copy of
    # the file and from nowhere else, so no nightly runs while this lives on a
    # feature branch or on staging — the first one happens after the promotion
    # that carries this file to main, and it runs main's HEAD, not staging's.
    # Accepted deliberately (PAD-304): until then, the whole suite is one
    # workflow_dispatch away.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      flows:
        description: "Maestro flows to run (space-separated, relative to apps/mobile/.maestro; `.` = the whole suite)"
        type: string
        default: "."
      force_setup_failure:
        # PAD-757: a regression lever for the lane check. True hands the emulator step an API level
        # with no system image, so its SDK install fails before any flow runs; the Android lane check
        # must then read "setup failed", neutral, never success.
        description: "Make the emulator step's SDK install fail (proves a setup failure is never green)"
        type: boolean
        default: false

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.15.0"
  # PAD-720 (delivery.android-nightly-lane rule 7): while the lane is being brought up (PAD-710), a
  # red shard does not fail the run, so GitHub sends no failure email; the `lane-result` job posts
  # the "Android lane" check as neutral with the red flows named. It turns strict by itself on a
  # scheduled run on main after two consecutive scheduled greens; delete this line to make it
  # strict now.
  ANDROID_LANE_EXPERIMENTAL: "true"
  # The PR smoke list; `.` (nightly / dispatch) is the whole suite — see the flow policy above.
  MAESTRO_FLOWS_SMOKE: "flows/01-login.yaml flows/31-week-view.yaml flows/32-month-view.yaml flows/36-android-evidence.yaml"
  # The runner as seen from inside the emulator.
  EMULATOR_HOST_API_URL: "http://10.0.2.2:5001/api"
  APK_PATH: frontend/apps/mobile/android/app/build/outputs/apk/release/app-release.apk

jobs:
  apk:
    name: APK (prebuild + Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      built: ${{ steps.filter.outputs.mobile }}
      shards: ${{ steps.plan.outputs.shards }}
      changed_flows: ${{ steps.plan.outputs.changed_flows }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        # The diff filter is a pull-request concept; a schedule or dispatch run
        # always builds (their steps gate on the event name instead).
        if: github.event_name == 'pull_request'
        with:
          # PAD-710 rule 1b: the `flows` filter's file list feeds the changed-flows job.
          list-files: json
          filters: |
            mobile:
              - 'frontend/apps/mobile/**'
              - 'frontend/packages/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - '.github/workflows/android-build.yaml'
            lane:
              - '.github/workflows/android-build.yaml'
              - 'frontend/apps/mobile/scripts/ci-android-maestro.sh'
              - 'frontend/apps/mobile/scripts/maestro-shards.mjs'
              - 'frontend/apps/mobile/.maestro/android-shards.json'
            flows:
              - 'frontend/apps/mobile/.maestro/flows/*.yaml'

      # PAD-710 (delivery.android-nightly-lane rule 1): the whole suite runs as parallel shards
      # (the schedule, a dispatch of `.`, a PR that changes the lane itself); anything else is one
      # job ("all") running MAESTRO_FLOWS. The planner refuses a shard file that drops, doubles or
      # splits a flow chain, before an emulator is booted.
      - name: Plan the Maestro shards
        id: plan
        env:
          FLOWS_INPUT: ${{ github.event.inputs.flows }}
          LANE_CHANGED: ${{ steps.filter.outputs.lane }}
          # Rule 1b: the flow files this PR adds or changes, as a JSON list (never eval'd).
          FLOW_FILES: ${{ steps.filter.outputs.flows_files }}
        run: |
          set -euo pipefail
          PLANNER=frontend/apps/mobile/scripts/maestro-shards.mjs
          args=()
          if [ "$GITHUB_EVENT_NAME" = schedule ] || { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${FLOWS_INPUT:-.}" = . ]; } || [ "$LANE_CHANGED" = true ]; then
            node "$PLANNER" check
            args+=(--full)
          fi
          changed=$(node "$PLANNER" changed --json "${FLOW_FILES:-[]}")
          [ -n "$changed" ] && args+=(--changed)
          shards=$(node "$PLANNER" matrix "${args[@]}")
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "changed_flows=$changed" >> "$GITHUB_OUTPUT"
          echo "Maestro jobs: $shards; changed flows: ${changed:-none}"

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.mobile == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.mobile == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.mobile == 'true'

      - name: Install workspace dependencies
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.mobile == 'true'
        working-directory: frontend
        run: npm ci

      # The guard the coordinator asked for: a prebuild WITHOUT LEVAPP_CI_APK must
      # produce a manifest with no cleartext permission. Same command a release
      # build would run; only the flag differs.
      - name: A store prebuild carries no cleartext permission
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.mobile == 'true'
        working-directory: frontend/apps/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          if grep -q "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml; then
            echo "::error::the manifest of a prebuild WITHOUT LEVAPP_CI_APK carries usesCleartextTraffic — a store build would inherit it"
            grep -n "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml
            exit 1
          fi
          echo "store manifest: no cleartext permission (as required)"
          rm -rf android

      - name: Prebuild the CI test app (cleartext to the runner allowed)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.mobile == 'true'
        working-directory: frontend/apps/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          LEVAPP_CI_APK: "1"
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::CI prebuild did not set usesCleartextTraffic — the emulator could not reach Flask"; exit 1; }
          chmod +x android/gradlew

      - name: Gradle assembleRelease (debug keystore, JS bundled)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.mobile == 'true'
        working-directory: frontend/apps/mobile/android
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: ${{ env.EMULATOR_HOST_API_URL }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        # Two ABIs, not four: arm64-v8a runs on every phone the owner can install
        # it on, x86_64 is the CI emulator. The template's default (all four)
        # made this step ~24 min cold AND warm — the Gradle cache does not
        # cover the native compile.
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: APK summary
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.mobile == 'true'
        run: |
          set -euo pipefail
          ls -la "$APK_PATH"
          {
            echo "### levapp-android-apk"
            echo ""
            echo "- file: \`app-release.apk\` ($(du -h "$APK_PATH" | cut -f1)), signed with the Expo template debug keystore"
            echo "- sha256: \`$(sha256sum "$APK_PATH" | cut -d' ' -f1)\`"
            echo "- API URL baked in: \`$EMULATOR_HOST_API_URL\` (emulator lane only — not a store build)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.mobile == 'true'
        with:
          name: levapp-android-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

  maestro:
    name: Maestro on an Android emulator (${{ matrix.shard }})
    needs: apk
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.apk.outputs.built == 'true'
    runs-on: ubuntu-latest
    # PAD-710 (delivery.android-nightly-lane rules 2 and 4): the whole suite (~131 flows, ~200 min
    # of emulator time) outgrew one 100-min job and was cancelled every night from 2026-10-08. Each
    # shard is its own job with its own emulator and freshly seeded database; the watchdog in
    # ci-android-maestro.sh stops a shard at 75 min (or a flow at 12), naming the flow, before
    # this cap could turn the run into "cancelled".
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.apk.outputs.shards) }}
    services:
      postgres:
        # PAD-653 (delivery.ci-images rule 4): our own GHCR copy of postgres:15, refreshed weekly by
        # mirror-ci-images.yaml. Anonymous ECR Public (PAD-598) hit its per-IP data limit on the
        # shared runners ("toomanyrequests: Data limit exceeded" at Initialize containers).
        image: ghcr.io/padellevelup/ci-postgres:15
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: padel_app_user
          POSTGRES_PASSWORD: padel_app_test
          POSTGRES_DB: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U padel_app_user -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Isolation (PAD-218 rules): this lane owns its own database name.
      E2E_DB_NAME: levelup_ci_android
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: padel_app_user
      POSTGRES_PW: padel_app_test
      FLASK_APP: padel_app
      FLASK_ENV: development
      JWT_SECRET_KEY: e2e-test-secret
      # dispatch input → `.` on the nightly schedule → the PR smoke list.
      # (the `env` context is not available in a job-level env block, so the smoke list is spelled out here too)
      MAESTRO_FLOWS: ${{ github.event.inputs.flows || (github.event_name == 'schedule' && '.') || 'flows/01-login.yaml flows/31-week-view.yaml flows/32-month-view.yaml flows/36-android-evidence.yaml' }}
      # A shard number runs that shard of the whole suite (scripts/maestro-shards.mjs); "all" runs MAESTRO_FLOWS.
      MAESTRO_SHARD: ${{ matrix.shard }}
      # Rule 1b: the "changed" job runs these flow names (scripts/maestro-shards.mjs config changed).
      MAESTRO_CHANGED_FLOWS: ${{ needs.apk.outputs.changed_flows }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # reset-test-db.sh activates backend/.venv, so give it one.
      - name: Backend venv
        run: |
          python -m venv backend/.venv
          # PAD-671: the hashed lock export, then the package with --no-deps.
          # pip pinned: a fresh venv's 23.0.1 refuses hashed requirements with extras.
          backend/.venv/bin/python -m pip install --quiet pip==25.1.1
          backend/.venv/bin/pip install --quiet --require-hashes -r backend/requirements.txt
          backend/.venv/bin/pip install --quiet --no-deps ./backend

      - name: Migrate + seed the isolated database
        env:
          POSTGRES_DB: ${{ env.E2E_DB_NAME }}
        run: bash frontend/apps/web/e2e/scripts/reset-test-db.sh

      - name: Start Flask on :5001 (reachable from the emulator as 10.0.2.2)
        env:
          POSTGRES_DB: ${{ env.E2E_DB_NAME }}
          # The E2E backend contract the flows rely on (see .maestro/README.md and the
          # web Playwright config): the debug code/link endpoints behind
          # E2E_DEBUG_ENDPOINTS are what 22-signup, 28-password-recovery and
          # 29-coach-rejection read; without them the
          # signup flow strands the app on the verify-email screen and every
          # later flow times out at login (full run 34642499349, PAD-298).
          E2E_DEBUG_ENDPOINTS: "true"
          TEST_MODE: "true"
          # The register throttle (5/600 per IP, PAD-269) 429s the 6th signup, so a flow
          # that walks signup repeatedly (51 x10, then 44) could never pass here.
          # Playwright's backend turns it off the same way (playwright.config.ts).
          AUTH_RATE_LIMIT_ENABLED: "0"
        run: |
          set -euo pipefail
          cd backend
          nohup .venv/bin/flask run --host 0.0.0.0 --port 5001 --no-reload > "$RUNNER_TEMP/flask.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5001/api/app/healthz >/dev/null; then echo "flask up"; exit 0; fi
            sleep 1
          done
          echo "::error::Flask did not answer on :5001"; cat "$RUNNER_TEMP/flask.log"; exit 1

      - uses: actions/download-artifact@v4
        with:
          name: levapp-android-apk
          path: ${{ runner.temp }}/apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # PAD-345: pinned, so a lane result on one commit cannot change with the
      # Maestro release of the day. Local runs match it: see the Maestro
      # README's "Maestro version" section. Bump both together.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.6.1"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version | grep -qx "$MAESTRO_VERSION" || { echo "Maestro is not $MAESTRO_VERSION"; exit 1; }
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-default-x86_64-v1

      - name: Create the AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated for the cache"

      - name: Install the APK and run Maestro
        # Rule 7: an experimental lane's red is reported by `lane-result`, not by failing the run.
        continue-on-error: ${{ env.ANDROID_LANE_EXPERIMENTAL == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # PAD-757: the dispatch input force_setup_failure asks for API 99, which has no system image.
          api-level: ${{ inputs.force_setup_failure && 99 || 34 }}
          arch: x86_64
          target: default
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The action runs `script:` with /bin/sh (dash): keep the bash in a file.
          script: bash frontend/apps/mobile/scripts/ci-android-maestro.sh

      - name: Collect Maestro output
        if: always()
        run: |
          mkdir -p maestro-results
          cp -r ~/.maestro/tests maestro-results/ 2>/dev/null || true
          cp maestro-report.xml maestro-results/ 2>/dev/null || true
          cp "$RUNNER_TEMP/flask.log" maestro-results/ 2>/dev/null || true
          ls -R maestro-results | head -50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-results-${{ matrix.shard }}
          path: maestro-results
          if-no-files-found: warn
          retention-days: 14

  # PAD-720 (delivery.android-nightly-lane rule 7): one "Android lane" check for the whole matrix,
  # read from every shard's artifact: success when every flow passed; neutral while the lane is
  # experimental and something is red (the summary names each red flow); failure once strict, and
  # then this job fails the run.
  lane-result:
    name: Android lane result
    needs: [apk, maestro]
    if: always() && needs.apk.result == 'success' && needs.maestro.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      # A shard with no artifact is reported as "reported nothing", so a missing download is not fatal.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: maestro-results-*
          path: ${{ runner.temp }}/lane

      # PAD-757 (rule 7): a shard whose artifact has no junit report may never have reached Maestro
      # (#847: the emulator's SDK install failed). Its job log's first error line is written next to
      # the artifact as setup-error.txt, so the check names the setup error instead of "0 flows red".
      - name: Name each shard's setup error
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_SHARDS: ${{ needs.apk.outputs.shards }}
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | "\(.id)\t\(.name)"')
          for shard in $(node -p 'JSON.parse(process.env.LANE_SHARDS).join(" ")'); do
            d="$RUNNER_TEMP/lane/maestro-results-$shard"
            [ -f "$d/maestro-report.xml" ] && continue
            mkdir -p "$d"
            id=$(printf '%s\n' "$jobs" | awk -F'\t' -v n="Maestro on an Android emulator ($shard)" '$2 == n { print $1 }')
            # curl, not `gh api`: the runner's gh refuses a response with terminal escape sequences,
            # which every job log has (run 40029953880). The retry covers a log not yet archived.
            for attempt in 1 2 3; do
              [ -n "$id" ] || break
              if curl -sfL -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/job-$shard.log" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" && [ -s "$RUNNER_TEMP/job-$shard.log" ]; then
                node frontend/apps/mobile/scripts/maestro-shards.mjs setup-error < "$RUNNER_TEMP/job-$shard.log" > "$d/setup-error.txt"
                break
              fi
              echo "job $id's log not readable yet (attempt $attempt)"
              sleep 10
            done
            echo "shard $shard has no junit report; setup error: $(cat "$d/setup-error.txt" 2>/dev/null || echo none)"
          done

      # Strict after two consecutive scheduled greens on main: read the Android lane check that the
      # two previous scheduled runs posted. Pull requests and dispatches stay neutral while flagged.
      - name: Count the recent scheduled greens on main
        id: greens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=0
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            for sha in $(gh run list -R "$GITHUB_REPOSITORY" --workflow android-build.yaml --event schedule --branch main \
                --status completed -L 3 --json headSha,databaseId --jq ".[] | select(.databaseId != $GITHUB_RUN_ID) | .headSha" | head -2); do
              c=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=Android%20lane" --jq '.check_runs[0].conclusion // ""')
              [ "$c" = success ] && n=$((n + 1))
            done
          fi
          echo "greens=$n" >> "$GITHUB_OUTPUT"
          echo "recent scheduled greens on main: $n/2"

      - name: Post the Android lane check
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_SHARDS: ${{ needs.apk.outputs.shards }}
          LANE_EXPERIMENTAL: ${{ env.ANDROID_LANE_EXPERIMENTAL }}
          LANE_RECENT_GREENS: ${{ steps.greens.outputs.greens }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          verdict=$(node frontend/apps/mobile/scripts/maestro-shards.mjs report "$RUNNER_TEMP/lane")
          conclusion=$(node -p 'JSON.parse(process.argv[1]).conclusion' "$verdict")
          # PAD-757: each setup failure is also an annotation, on the check (at the emulator step) and on the run.
          step_line=$(grep -n -m1 'name: Install the APK and run Maestro' .github/workflows/android-build.yaml | cut -d: -f1)
          node -e '
            const v = JSON.parse(process.argv[1]);
            const line = Number(process.argv[2]);
            const annotations = v.setupFailures.map((f) => ({ path: ".github/workflows/android-build.yaml", start_line: line,
              end_line: line, annotation_level: "warning", title: `Android lane setup failed (shard ${f.shard})`, message: f.error }));
            process.stdout.write(JSON.stringify({ name: "Android lane", head_sha: process.env.HEAD_SHA, status: "completed",
              conclusion: v.conclusion, output: { title: v.title, summary: v.summary, annotations } }));
          ' "$verdict" "$step_line" > "$RUNNER_TEMP/check.json"
          node -e '
            for (const f of JSON.parse(process.argv[1]).setupFailures)
              console.log(`::warning title=Android lane setup failed (shard ${f.shard})::${f.error.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A")}`);
          ' "$verdict"
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input "$RUNNER_TEMP/check.json" --jq '.html_url'
          node -p 'JSON.parse(process.argv[1]).summary' "$verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "Android lane: $conclusion"
          [ "$conclusion" != failure ]
