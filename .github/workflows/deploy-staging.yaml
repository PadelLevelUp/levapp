name: Deploy staging

# One workflow, two ordered jobs. In a monorepo a single push can change both
# sides, and the two-repo setup's "merge backend first, then frontend" ordering
# no longer exists — so the ordering lives here: `frontend` waits for `backend`.
# The common case (additive backend work) is therefore safe by default. For the
# rare release where the FRONTEND must go first (a backend contract change the
# deployed frontend violates), dispatch this workflow twice by hand with
# target=frontend and then target=backend.
#
# Path filtering happens INSIDE the jobs (dorny/paths-filter), never at the
# workflow level: a workflow-level `paths:` filter that skips a required check
# blocks the PR forever, because "skipped" is not "success".
# Staging shares the production VM: its own containers, ports and database
# (padel_app_staging), memory-capped so it can never starve production. No
# VAPID and OpenRouter credentials are passed on purpose, so staging cannot push
# or spend credit.
#
# Two deliberate exceptions, each isolated by something other than absence:
#
# GCS — staging gets its OWN bucket (padel-levelup-2026-storage-staging, public
# access prevention ENFORCED), never the production one, so it can exercise the
# signed-URL path without being able to write a byte into prod uploads. The
# bucket name is not a credential (access comes from the VM service account), so
# it lives in .env.staging where sync-staging-db.sh can read it too; that script
# seeds a placeholder object for every key the copied database references, so
# images resolve without a production byte leaving its bucket.
#
# Mail (PAD-234) — staging does get the mail password, the same secret as prod,
# so sign-up codes and coach-approval mail can be tried end to end. Its database
# is a copy of prod's, so MAIL_ALLOWED_RECIPIENTS in backend/.env.staging is what
# stops it ever reaching a real coach: anyone outside the list is dropped and
# logged.

on:
  push:
    branches: [ staging ]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        default: both
        options: [ both, backend, frontend ]
      # PAD-588 (delivery.zero-downtime-deploy rule 7): `stop-first` for a migration the previous
      # release cannot run against (a dropped or renamed column it still reads).
      rollout:
        description: "API rollout"
        type: choice
        default: rolling
        options: [ rolling, stop-first ]
      # PAD-589 (delivery.staging-data-sync): how the sync-db job refreshes staging's
      # database. auto = the newest nightly dump, only if not restored yet (every push);
      # reload = that dump again (e.g. after a rebased migration); live = pg_dump of prod.
      sync_db:
        description: "Staging database refresh"
        type: choice
        default: auto
        options: [ auto, reload, live ]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-staging.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy-staging.yaml'

  # PAD-220: the migration drift gate. Every migration runs from empty against a
  # throwaway Postgres 15, there must be exactly one head, and `flask db check`
  # must find nothing the models disagree with. A red gate stops the backend job
  # (it `needs` this one) before any image is built or any container touched.
  drift-gate:
    needs: changes
    if: >-
      (github.event_name == 'push' && (needs.changes.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'backend'))
    runs-on: ubuntu-latest
    services:
      postgres:
        # PAD-653 (delivery.ci-images rule 4): our own GHCR copy of postgres:15, refreshed weekly by
        # mirror-ci-images.yaml. Anonymous ECR Public (PAD-598) hit its per-IP data limit on the
        # shared runners ("toomanyrequests: Data limit exceeded" at Initialize containers).
        image: ghcr.io/padellevelup/ci-postgres:15
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: padel_app_user
          POSTGRES_PASSWORD: drift-gate
          POSTGRES_DB: drift_gate
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U padel_app_user -d drift_gate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLASK_APP: padel_app
      FLASK_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: padel_app_user
      POSTGRES_PW: drift-gate
      POSTGRES_DB: drift_gate
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"  # the backend image is python:3.10-slim
    - name: Install Poetry
      run: pipx install poetry
    - name: Install backend
      run: poetry install --no-root --no-interaction
      working-directory: backend
    - name: Migrate an empty database
      run: poetry run flask db upgrade
      working-directory: backend
    - name: Exactly one head
      run: |
        heads=$(poetry run flask db heads 2>/dev/null | grep -c '(head)')
        echo "alembic heads: $heads"
        test "$heads" -eq 1
      working-directory: backend
    - name: Models match the migrations (flask db check)
      run: poetry run flask db check
      working-directory: backend

  backend:
    needs: [ changes, drift-gate ]
    # A push that CREATES the branch has no base commit for paths-filter to diff
    # against (event.before is all zeros), so treat it as "everything changed".
    if: >-
      (github.event_name == 'push' && (needs.changes.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'backend'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    - name: Install Poetry
      run: pipx install poetry
    - name: Check lockfile is up-to-date
      run: poetry check --lock
      working-directory: backend
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/levelup_backend:staging
        platforms: linux/amd64
        # PAD-534 (admin.engine-health rule 4): the image knows its commit.
        build-args: |
          GIT_SHA=${{ github.sha }}
    - name: Copy .env.staging to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        source: "backend/.env.staging"
        target: "/home/${{ secrets.GCE_USER }}/"
        strip_components: 1
        overwrite: true
    # PAD-588: start-before-stop lives in a script so it has tests (test_pad588_rollout.py).
    - name: Copy rollout script to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        source: "backend/scripts/rollout.sh"
        target: "/home/${{ secrets.GCE_USER }}/"
        strip_components: 2
        overwrite: true
    - name: Deploy on GCE
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        # PAD-691 (delivery.zero-downtime-deploy rule 7): the migrate step runs inside this ssh
        # session while the old API serves; the action's 10-min default would fail a long migration.
        command_timeout: 30m
        script: |
          set -euo pipefail
          docker network create levelup_net || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/levelup_backend:staging
          # PAD-229: published on 127.0.0.1 only; the host nginx is the only way in.
          # PAD-588 (delivery.zero-downtime-deploy rules 4-7): rollout.sh starts padelapp_staging_next on the idle
          # loopback port of 5100,5102, waits for /api/app/healthz (readiness: DB reachable, schema not behind head;
          # PAD-696), stops the old container, and renames the new one padelapp_staging. Without
          # the `levapp_api_staging` upstream on the host (owner's nginx step) it falls back to stop-then-start.
          # PAD-691 (rules 4, 7, 9): --migrate runs /app/scripts/migrate.sh in a one-shot container of
          # the same image first, while the old container serves; the container no longer migrates
          # itself and refuses to start against a schema behind its head (rule 10). On rollback_to the
          # migrate step finds the database ahead of the image and does nothing.
          ROLLOUT_MODE=""
          if [ "${{ inputs.rollout }}" = "stop-first" ]; then ROLLOUT_MODE="--stop-first"; fi
          # PAD-695 (delivery.worker-role): with WORKER_SPLIT on in the env file the jobs run in a
          # <name>_worker container that rollout.sh swaps after the API; off, it removes any leftover one.
          WORKER_OPT=""
          if grep -qiE '^WORKER_SPLIT=(on|1|true|yes)[[:space:]]*$' /home/${{ secrets.GCE_USER }}/.env.staging; then WORKER_OPT="--worker"; fi
          # B-666: a rollback (deploy-prod's rollback_to) checks out an older rollout.sh, which exits 2
          # on an option it does not know (--probe-host came with #769, --migrate with #753). Pass an
          # option only when the checked-out script accepts it, and say so when one is dropped.
          RO=/home/${{ secrets.GCE_USER }}/rollout.sh
          # PAD-704 (rule 14): API_COPIES=2 in the env file runs a second API copy, padelapp_staging_b, on the
          # port the swap freed. An older checked-out rollout.sh (a rollback) has no --copies and cannot
          # free that port itself, so a leftover second copy goes here first.
          API_COPIES=1
          if grep -qE '^API_COPIES=2[[:space:]]*$' /home/${{ secrets.GCE_USER }}/.env.staging; then API_COPIES=2; fi
          if ! grep -qF -- "    --copies)" "$RO" && docker inspect padelapp_staging_b >/dev/null 2>&1; then
            echo "[deploy] this rollout.sh predates --copies: removing padelapp_staging_b before it runs"
            docker stop -t 10 padelapp_staging_b >/dev/null 2>&1 || true
            docker rm padelapp_staging_b >/dev/null 2>&1 || true
          fi
          opt() { if grep -qF -- "    $1)" "$RO"; then printf '%s ' "$@"; else echo "[deploy] this rollout.sh has no $1: not passing it" >&2; fi; }
          bash "$RO" --name padelapp_staging --ports 5100,5102 --upstream levapp_api_staging $(opt --probe-host staging.levapp.app) $(opt --migrate) $([ -z "$WORKER_OPT" ] || opt --worker) $([ "$API_COPIES" != 2 ] || opt --copies 2) $ROLLOUT_MODE -- \
            --log-opt max-size=10m --log-opt max-file=3 \
            --restart unless-stopped \
            --network levelup_net \
            --memory 400m \
            --env-file /home/${{ secrets.GCE_USER }}/.env.staging \
            -e POSTGRES_PW="${{ secrets.POSTGRES_PW }}" \
            -e FLASK_SECRET_KEY="${{ secrets.STAGING_FLASK_SECRET_KEY }}" \
            -e JWT_SECRET_KEY="${{ secrets.STAGING_JWT_SECRET_KEY }}" \
            -e STAGING_TEST_PASSWORD="${{ secrets.STAGING_TEST_PASSWORD }}" \
            -e MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            -e HUBSPOT_PRIVATE_APP_TOKEN="${{ secrets.STAGING_HUBSPOT_PRIVATE_APP_TOKEN }}" \
            -e GOOGLE_WEB_CLIENT_ID="${{ vars.GOOGLE_WEB_CLIENT_ID_STAGING }}" \
            -e GOOGLE_IOS_CLIENT_ID="${{ vars.GOOGLE_IOS_CLIENT_ID }}" \
            -e APPLE_CLIENT_IDS="${{ vars.APPLE_CLIENT_IDS }}" \
            -e HUBSPOT_DEMO_FORM_ID="${{ vars.HUBSPOT_DEMO_FORM_ID_STAGING }}" \
            -e HUBSPOT_MARKETING_SUBSCRIPTION_ID="${{ vars.HUBSPOT_MARKETING_SUBSCRIPTION_ID_STAGING }}" \
            -e LINEAR_API_KEY="${{ secrets.LINEAR_API_KEY }}" \
            -e WORK_GITHUB_REPO="${{ github.repository }}" \
            -e WORK_GITHUB_TOKEN="${{ secrets.WORK_GITHUB_TOKEN }}" \
            -e ASC_KEY_ID="${{ vars.ASC_KEY_ID }}" \
            -e ASC_ISSUER_ID="${{ vars.ASC_ISSUER_ID }}" \
            -e ASC_PRIVATE_KEY="${{ secrets.ASC_PRIVATE_KEY }}" \
            -e ASC_APP_ID="${{ vars.ASC_APP_ID }}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/levelup_backend:staging
          # PAD-695: no worker outlives a deploy that did not pass --worker: WORKER_SPLIT is off, or a
          # rollback checked out a rollout.sh from before the worker role (it can neither swap nor remove
          # one). The API then competes for the scheduler lock again; jobs never run twice either way.
          if [ -z "$WORKER_OPT" ] || ! grep -qF -- "    --worker)" /home/${{ secrets.GCE_USER }}/rollout.sh; then
            if docker inspect padelapp_staging_worker >/dev/null 2>&1; then
              echo "[deploy] removing padelapp_staging_worker (no worker in this deploy)"
              docker stop -t 60 padelapp_staging_worker >/dev/null 2>&1 || true
              docker rm padelapp_staging_worker >/dev/null 2>&1 || true
            fi
          fi
          # Reclaim disk: the previous image is dangling after the pull; the
          # 9.7G VM disk has filled up twice.
          docker image prune -f || true

  # PAD-200 / PAD-589: refresh staging's database. On a push the script restores the
  # newest NIGHTLY DUMP from GCS, and only when that dump has not been restored yet
  # (otherwise it exits before stopping staging), so prod's Postgres is no longer
  # dumped on every push; `reload` and `live` are workflow_dispatch only. Best-effort by contract:
  # `continue-on-error` keeps a failed copy from failing the deploy, the script
  # itself exits 0 on every guard, and it always restarts the staging app.
  # Runs after `backend` (which may be skipped on a frontend-only push — the
  # copy still happens) and in parallel with `frontend`. Before the restart the
  # script runs the migrate step (PAD-691: scripts/migrate.sh in a one-shot container of the
  # staging image), so the copied prod schema is brought up to whatever migrations staging carries.
  sync-db:
    needs: [ changes, backend ]
    if: >-
      always() && needs.backend.result != 'failure' && needs.backend.result != 'cancelled'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Copy sync script to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        source: "backend/scripts/sync-staging-db.sh,backend/scripts/staging-scrub.sql"
        target: "/home/${{ secrets.GCE_USER }}/"
        strip_components: 2
        overwrite: true
    # PAD-606 rule 9: the script exits 0 when it skipped or copied and scrubbed, 3 when a restore's
    # scrub failed (staging wiped, empty) and 4 when the wipe failed too (staging left stopped). The
    # remote command always ends 0 and prints SYNC_EXIT=<code>, so the log is captured either way;
    # the next step puts the scrub's lines in the summary and fails this job on a non-zero code.
    # The job stays continue-on-error, so the deploy itself never fails (rule 6).
    - name: Sync staging DB from prod
      id: sync
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        capture_stdout: true
        script: |
          bash /home/${{ secrets.GCE_USER }}/sync-staging-db.sh /home/${{ secrets.GCE_USER }}/.env.staging "${{ inputs.sync_db || 'auto' }}"
          echo "SYNC_EXIT=$?"
    - name: Scrub verdict
      if: always()
      env:
        SYNC_LOG: ${{ steps.sync.outputs.stdout }}
      run: |
        code=$(printf '%s\n' "$SYNC_LOG" | sed -n 's/.*SYNC_EXIT=\([0-9]*\).*/\1/p' | tail -1)
        {
          echo "### Staging DB sync: exit ${code:-unknown}"
          echo '```'
          printf '%s\n' "$SYNC_LOG" | grep -E 'SKIPPED|restor|scrub|wip|NOT starting|ERROR' || echo "(no sync lines captured)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        case "$code" in
          0) echo "sync ok (skipped, or restored and scrubbed)" ;;
          3) echo "::error::the scrub failed after a restore; staging was wiped and comes up empty"; exit 3 ;;
          4) echo "::error::the scrub and the wipe failed; staging may hold unscrubbed data and was left stopped"; exit 4 ;;
          *) echo "::error::no SYNC_EXIT line from the sync (ssh or script failure); check the log"; exit 1 ;;
        esac

  frontend:
    needs: [ changes, backend ]
    # always() lets this run when backend was SKIPPED (frontend-only push); it
    # still refuses to run when backend actually FAILED.
    if: >-
      always() && needs.backend.result != 'failure' && needs.backend.result != 'cancelled' && (
        (github.event_name == 'push' && (needs.changes.outputs.frontend == 'true' || github.event.before == '0000000000000000000000000000000000000000')) ||
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'frontend'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/levelup_frontend:staging
          platforms: linux/amd64
          # PAD-469: the HubSpot demo form on the landing page. A repository
          # *variable* (the ID is public). Its own name, so staging can stay on
          # the mailto (unset) and keep test submissions out of the CRM.
          build-args: |
            VITE_HUBSPOT_DEMO_FORM_ID=${{ vars.HUBSPOT_DEMO_FORM_ID_STAGING }}
            VITE_HUBSPOT_MARKETING_SUBSCRIPTION_ID=${{ vars.HUBSPOT_MARKETING_SUBSCRIPTION_ID_STAGING }}
            VITE_GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID_STAGING }}
            VITE_API_BASE_URL=${{ vars.API_BASE_URL_STAGING }}
      - name: Deploy on GCE
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: |
            docker network create levelup_net || true
            docker network connect levelup_net padelapp_staging || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/levelup_frontend:staging
            docker stop levelup_frontend_staging || true && docker rm levelup_frontend_staging || true
            docker run -d --name levelup_frontend_staging \
              --log-opt max-size=10m --log-opt max-file=3 \
              --restart unless-stopped \
              --network levelup_net \
              --memory 100m \
              -p 127.0.0.1:3100:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/levelup_frontend:staging
            docker image prune -f || true

  # PAD-531 (admin.foundation rule 12): the staff console image, one more container
  # on the loopback interface. It needs `backend` only for ordering (the console
  # calls /admin/api, which the backend serves); nothing depends on THIS job, so a
  # failed console build can never hold the product back (the B-090 shape). The
  # host nginx fronts it at the admin host (infra/nginx/sites-available/levapp-admin*,
  # hand-applied); until those blocks are applied the container simply has no
  # visitors. No secrets: the console reads the public Google client id from the
  # backend at run time.
  admin:
    needs: [ changes, backend ]
    if: >-
      always() && needs.backend.result != 'failure' && needs.backend.result != 'cancelled' && (
        (github.event_name == 'push' && (needs.changes.outputs.frontend == 'true' || github.event.before == '0000000000000000000000000000000000000000')) ||
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'frontend'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.admin
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/levelup_admin:staging
          platforms: linux/amd64
      - name: Deploy on GCE
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            TAG="staging"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/levelup_admin:$TAG
            docker stop levelup_admin_staging || true && docker rm levelup_admin_staging || true
            # PAD-229: published on 127.0.0.1 only; the host nginx is the only way in.
            docker run -d --name levelup_admin_staging \
              --log-opt max-size=10m --log-opt max-file=3 \
              --restart unless-stopped \
              --memory 100m \
              -p 127.0.0.1:3300:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/levelup_admin:$TAG
            docker image prune -f || true
