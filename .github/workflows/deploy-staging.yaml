name: Deploy staging

# One workflow, two ordered jobs. In a monorepo a single push can change both
# sides, and the two-repo setup's "merge backend first, then frontend" ordering
# no longer exists — so the ordering lives here: `frontend` waits for `backend`.
# The common case (additive backend work) is therefore safe by default. For the
# rare release where the FRONTEND must go first (a backend contract change the
# deployed frontend violates), dispatch this workflow twice by hand with
# target=frontend and then target=backend.
#
# Path filtering happens INSIDE the jobs (dorny/paths-filter), never at the
# workflow level: a workflow-level `paths:` filter that skips a required check
# blocks the PR forever, because "skipped" is not "success".
# Staging shares the production VM: its own containers, ports and database
# (padel_app_staging), memory-capped so it can never starve production. No
# VAPID and OpenRouter credentials are passed on purpose, so staging cannot push
# or spend credit.
#
# Two deliberate exceptions, each isolated by something other than absence:
#
# GCS — staging gets its OWN bucket (padel-levelup-2026-storage-staging, public
# access prevention ENFORCED), never the production one, so it can exercise the
# signed-URL path without being able to write a byte into prod uploads. The
# bucket name is not a credential (access comes from the VM service account), so
# it lives in .env.staging where sync-staging-db.sh can read it too; that script
# seeds a placeholder object for every key the copied database references, so
# images resolve without a production byte leaving its bucket.
#
# Mail (PAD-234) — staging does get the mail password, the same secret as prod,
# so sign-up codes and coach-approval mail can be tried end to end. Its database
# is a copy of prod's, so MAIL_ALLOWED_RECIPIENTS in backend/.env.staging is what
# stops it ever reaching a real coach: anyone outside the list is dropped and
# logged.

on:
  push:
    branches: [ staging ]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        default: both
        options: [ both, backend, frontend ]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-staging.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy-staging.yaml'

  # PAD-220: the migration drift gate. Every migration runs from empty against a
  # throwaway Postgres 15, there must be exactly one head, and `flask db check`
  # must find nothing the models disagree with. A red gate stops the backend job
  # (it `needs` this one) before any image is built or any container touched.
  drift-gate:
    needs: changes
    if: >-
      (github.event_name == 'push' && (needs.changes.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'backend'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: padel_app_user
          POSTGRES_PASSWORD: drift-gate
          POSTGRES_DB: drift_gate
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U padel_app_user -d drift_gate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLASK_APP: padel_app
      FLASK_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: padel_app_user
      POSTGRES_PW: drift-gate
      POSTGRES_DB: drift_gate
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"  # the backend image is python:3.10-slim
    - name: Install Poetry
      run: pipx install poetry
    - name: Install backend
      run: poetry install --no-root --no-interaction
      working-directory: backend
    - name: Migrate an empty database
      run: poetry run flask db upgrade
      working-directory: backend
    - name: Exactly one head
      run: |
        heads=$(poetry run flask db heads 2>/dev/null | grep -c '(head)')
        echo "alembic heads: $heads"
        test "$heads" -eq 1
      working-directory: backend
    - name: Models match the migrations (flask db check)
      run: poetry run flask db check
      working-directory: backend

  backend:
    needs: [ changes, drift-gate ]
    # A push that CREATES the branch has no base commit for paths-filter to diff
    # against (event.before is all zeros), so treat it as "everything changed".
    if: >-
      (github.event_name == 'push' && (needs.changes.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'backend'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    - name: Install Poetry
      run: pipx install poetry
    - name: Check lockfile is up-to-date
      run: poetry check --lock
      working-directory: backend
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/levelup_backend:staging
        platforms: linux/amd64
    - name: Copy .env.staging to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        source: "backend/.env.staging"
        target: "/home/${{ secrets.GCE_USER }}/"
        strip_components: 1
        overwrite: true
    - name: Deploy on GCE
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          docker network create levelup_net || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/levelup_backend:staging
          docker stop padelapp_staging || true && docker rm padelapp_staging || true
          # PAD-229: published on 127.0.0.1 only; the host nginx is the only way in.
          docker run -d --name padelapp_staging -p 127.0.0.1:5100:80 \
            --restart unless-stopped \
            --network levelup_net \
            --memory 400m \
            --env-file /home/${{ secrets.GCE_USER }}/.env.staging \
            -e POSTGRES_PW="${{ secrets.POSTGRES_PW }}" \
            -e FLASK_SECRET_KEY="${{ secrets.STAGING_FLASK_SECRET_KEY }}" \
            -e JWT_SECRET_KEY="${{ secrets.STAGING_JWT_SECRET_KEY }}" \
            -e MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/levelup_backend:staging
          # PAD-220: `docker run` succeeding proves nothing about migrations — the
          # entrypoint runs them, and a failed one crash-loops the container
          # while this job reports green. Wait for the entrypoint to reach
          # "Starting app..." and fail the deploy, with the log, if it does not.
          for i in $(seq 1 45); do
            if docker logs padelapp_staging 2>&1 | grep -q "Starting app..."; then echo "migrations applied"; break; fi
            restarts=$(docker inspect -f '{{.RestartCount}}' padelapp_staging)
            if [ "$restarts" -gt 0 ] || [ "$i" -eq 45 ]; then
              echo "::error::padelapp_staging did not finish its migrations (restarts=$restarts)"
              docker logs --tail 60 padelapp_staging
              exit 1
            fi
            sleep 2
          done
          # Reclaim disk: the previous image is dangling after the pull; the
          # 9.7G VM disk has filled up twice.
          docker image prune -f || true

  # PAD-200: refresh staging's database from prod on EVERY staging deploy, so
  # staging tests against current, realistic data. Best-effort by contract:
  # `continue-on-error` keeps a failed copy from failing the deploy, the script
  # itself exits 0 on every guard, and it always restarts the staging app.
  # Runs after `backend` (which may be skipped on a frontend-only push — the
  # copy still happens) and in parallel with `frontend`. The restart the script
  # performs re-runs the entrypoint's `flask db upgrade`, so the copied prod
  # schema is brought up to whatever migrations staging carries.
  sync-db:
    needs: [ changes, backend ]
    if: >-
      always() && needs.backend.result != 'failure' && needs.backend.result != 'cancelled'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Copy sync script to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        source: "backend/scripts/sync-staging-db.sh"
        target: "/home/${{ secrets.GCE_USER }}/"
        strip_components: 2
        overwrite: true
    - name: Sync staging DB from prod
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        script: |
          bash /home/${{ secrets.GCE_USER }}/sync-staging-db.sh /home/${{ secrets.GCE_USER }}/.env.staging || true

  frontend:
    needs: [ changes, backend ]
    # always() lets this run when backend was SKIPPED (frontend-only push); it
    # still refuses to run when backend actually FAILED.
    if: >-
      always() && needs.backend.result != 'failure' && needs.backend.result != 'cancelled' && (
        (github.event_name == 'push' && (needs.changes.outputs.frontend == 'true' || github.event.before == '0000000000000000000000000000000000000000')) ||
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'frontend'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/levelup_frontend:staging
          platforms: linux/amd64
      - name: Deploy on GCE
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: |
            docker network create levelup_net || true
            docker network connect levelup_net padelapp_staging || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/levelup_frontend:staging
            docker stop levelup_frontend_staging || true && docker rm levelup_frontend_staging || true
            docker run -d --name levelup_frontend_staging \
              --restart unless-stopped \
              --network levelup_net \
              --memory 100m \
              -p 127.0.0.1:3100:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/levelup_frontend:staging
            docker image prune -f || true
