name: Admin console E2E

# PAD-572 (admin.phone-console rule 7): the staff console's Playwright phone specs
# (frontend/apps/admin/e2e, project "iPhone 13") run on every pull request into staging that
# touches the console or the backend it talks to, so the evidence comes from a run nobody has to
# remember. Advisory, like E2E subset: it is not a required check.
#
# Path filtering happens INSIDE the job (dorny/paths-filter), never at the workflow level: a
# workflow-level `paths:` filter that skips a required check blocks the PR forever, because
# "skipped" is not "success" (same rule as deploy-prod.yaml).

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: admin-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: padel_app_user
          POSTGRES_PASSWORD: padel_app_test
          POSTGRES_DB: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U padel_app_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Isolation (PAD-218): all three set, so both webServers and the reset script agree.
      E2E_DB_NAME: levelup_ci_admin_e2e
      E2E_BACKEND_PORT: "5001"
      E2E_WEB_PORT: "8080"
      E2E_ADMIN_PORT: "8090"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: padel_app_user
      POSTGRES_PW: padel_app_test
      NODE_VERSION: "24.15.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            console:
              - 'frontend/apps/admin/**'
              - 'frontend/packages/**'
              - 'backend/padel_app/modules/admin_api.py'
              - 'backend/padel_app/services/admin/**'
              - '.github/workflows/admin-e2e.yaml'

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.console == 'true'
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # playwright.config.ts starts Flask from backend/.venv, and reset-test-db.sh activates it.
      - name: Backend venv
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.console == 'true'
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --quiet ./backend

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.console == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.console == 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - uses: actions/cache@v4
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.console == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Chromium
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.console == 'true'
        working-directory: frontend/apps/admin
        run: npx playwright install --with-deps chromium

      # Playwright starts its webServers BEFORE globalSetup resets the database, so Flask would
      # boot against a database that does not exist yet and exit. Migrate and seed first, as
      # E2E subset does; globalSetup then resets it again for the run.
      - name: Migrate + seed the isolated database
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.console == 'true'
        env:
          POSTGRES_DB: ${{ env.E2E_DB_NAME }}
        run: bash frontend/apps/web/e2e/scripts/reset-test-db.sh

      - name: Run the phone specs
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.console == 'true'
        working-directory: frontend/apps/admin
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-e2e-report
          retention-days: 14
          path: |
            frontend/apps/admin/playwright-report
            frontend/apps/admin/test-results

      - name: Skipped
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.console != 'true'
        run: echo "no console or admin-backend change in this pull request; nothing to run"
