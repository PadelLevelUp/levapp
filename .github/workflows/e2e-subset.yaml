name: E2E subset

# PAD-511: run the web Playwright specs a change drives, bounded, so a broken locator is seen
# before the release gate (B-282 was first seen there and cost a promotion an hour).
# Design: docs/plans/2026-10-03-pad-511-pr-e2e-subset.md (accepted 2026-10-03).
#
# PHASE 0 ONLY. No pull_request trigger yet: whether it runs on PRs into staging, and whether as
# an advisory or a required check, is the owner's call after these numbers.
#   workflow_dispatch  one run: `head` diffed against `base` (dispatchable once on main).
#   push to this branch  the five phase-0 replays below, past PR heads from staging's history.
# Each run reports its setup time, per-spec time and whether setup + subset fits the 20-minute
# cap, then re-runs every red spec file alone on a freshly reset database: red in the subset and
# green alone is an order dependency (specs share one seeded database, B-101).
#
# The selector (frontend/apps/web/e2e/scripts/select_pr_specs.py) and its lists come from THIS
# commit (`tool/`); the app, specs and seed come from the commit under test (`app/`). The full
# suite is never run here: it stays the release gate's.

on:
  workflow_dispatch:
    inputs:
      head:
        description: "Commit to test (full or short SHA)"
        required: true
      base:
        description: "Merge base to diff it against"
        required: true
      label:
        description: "Label for the summary, e.g. #497"
        required: false
        default: "dispatch"
  push:
    branches: [feature/pad-511]

concurrency:
  group: e2e-subset-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      runs: ${{ steps.m.outputs.runs }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          IN_HEAD: ${{ inputs.head }}
          IN_BASE: ${{ inputs.base }}
          IN_LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [[ "$IN_HEAD" =~ ^[0-9a-f]{7,40}$ && "$IN_BASE" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::head and base must be SHAs"; exit 1; }
            label=$(printf '%s' "$IN_LABEL" | tr -cd '#A-Za-z0-9 ._-' | cut -c1-40)
            key=$(printf '%s' "$label" | tr -cd 'A-Za-z0-9_-'); key=${key:-dispatch}
            printf 'runs=[{"label":"%s","key":"%s","head":"%s","base":"%s"}]\n' "$label" "$key" "$IN_HEAD" "$IN_BASE" >> "$GITHUB_OUTPUT"
          else
            # Phase 0: past PR heads (staging merge ^2) and their merge bases, chosen from the
            # design's replay table for spread: 25 (truncated), 25 (truncated), 21, 19 and 1 spec.
            echo '[
              {"label":"#497","key":"pr497","head":"7ba256d43587646bf37c79ee9699c460d664e226","base":"882e78def8a524db0a25a154190573eaa0ee7c93"},
              {"label":"#528","key":"pr528","head":"47a008834161349b65a20b8aafbb298b63649613","base":"de0a25482b315ef6a21c6c6215ed2595d7e7daa7"},
              {"label":"#463","key":"pr463","head":"2582151a4783a08b70725f52ea2fab91b6c4d87f","base":"0e40e3a6835ace954d84d55791bc193399b48898"},
              {"label":"#508","key":"pr508","head":"898307d30da71eedcfb17efb07412b523b9a3b20","base":"460b33abeeb05a76cf566837beb690c6725f3ac3"},
              {"label":"#510","key":"pr510","head":"a0121d09aa1026afb4dcfdc1bf16240307fee8b5","base":"4a77b1134cddc5d9088a28e8ec8be6a0c783cf26"}
            ]' | tr -d '\n ' | sed 's/^/runs=/' >> "$GITHUB_OUTPUT"
          fi

  subset:
    needs: plan
    name: subset ${{ matrix.run.label }}
    runs-on: ubuntu-latest
    # Phase 0 measures, so the job leaves room for the isolation re-runs; the design's 20-minute
    # cap (setup + subset) is checked and reported in the summary, not enforced here yet.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: padel_app_user
          POSTGRES_PASSWORD: padel_app_test
          POSTGRES_DB: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U padel_app_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Isolation (PAD-218): all three set, so helpers/api.ts and both webServers agree.
      E2E_DB_NAME: levelup_ci_e2e
      E2E_BACKEND_PORT: "5001"
      E2E_WEB_PORT: "8080"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: padel_app_user
      POSTGRES_PW: padel_app_test
      NODE_VERSION: "24.15.0"
      CAP_SECONDS: "1200"
      # Per-test timeout for this job only (the shared playwright.config.ts keeps 3 min). Phase 0
      # measured green tests at about 20 s each; a red test burned its 3 min twice under
      # retries 1, which took a 25-spec red run (#497) to 19.7 of the 20 minutes. At 60 s a red
      # test costs about 2 min. A spec that sets its own `test.setTimeout` keeps it.
      TEST_TIMEOUT_MS: "60000"
    steps:
      - name: Clock in
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          path: tool

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.run.head }}
          path: app
          fetch-depth: 0  # the selector diffs base...head

      - name: Select the specs this change drives
        id: select
        env:
          BASE: ${{ matrix.run.base }}
          HEAD_SHA: ${{ matrix.run.head }}
          LABEL: ${{ matrix.run.label }}
        run: |
          set -euo pipefail
          python3 tool/frontend/apps/web/e2e/scripts/select_pr_specs.py \
            --repo app --base "$BASE" --head "$HEAD_SHA" --label "$LABEL" \
            --conf tool/frontend/apps/web/e2e/pr-subset \
            --json "$RUNNER_TEMP/selection.json" --files "$RUNNER_TEMP/specs.txt" \
            --summary "$GITHUB_STEP_SUMMARY"
          echo "count=$(grep -c . "$RUNNER_TEMP/specs.txt" || true)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.select.outputs.count != '0'
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml

      # playwright.config.ts starts Flask from backend/.venv, and reset-test-db.sh activates it.
      - name: Backend venv
        if: steps.select.outputs.count != '0'
        run: |
          python -m venv app/backend/.venv
          app/backend/.venv/bin/pip install --quiet ./app/backend

      - uses: actions/setup-node@v4
        if: steps.select.outputs.count != '0'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: npm ci
        if: steps.select.outputs.count != '0'
        working-directory: app/frontend
        run: npm ci --no-audit --no-fund

      - uses: actions/cache@v4
        if: steps.select.outputs.count != '0'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/frontend/package-lock.json') }}

      - name: Chromium
        if: steps.select.outputs.count != '0'
        working-directory: app/frontend/apps/web
        run: npx playwright install --with-deps chromium

      # Playwright starts its webServers BEFORE globalSetup resets the database, so Flask would
      # boot against a database that does not exist yet and exit (first phase-0 run). Migrate and
      # seed first, as the maestro lane does; globalSetup then resets it again for the run.
      - name: Migrate + seed the isolated database
        if: steps.select.outputs.count != '0'
        env:
          POSTGRES_DB: ${{ env.E2E_DB_NAME }}
        run: bash app/frontend/apps/web/e2e/scripts/reset-test-db.sh

      - name: Clock setup
        if: steps.select.outputs.count != '0'
        run: echo "T_SETUP=$(date +%s)" >> "$GITHUB_ENV"

      # workers 1 and file order come from the config and the selector (B-101); CI=true gives
      # retries 1, so a spec that fails then passes is reported flaky, not red.
      - name: Run the subset
        id: run
        if: steps.select.outputs.count != '0'
        continue-on-error: true
        working-directory: app/frontend/apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/results.json
        run: |
          set -euo pipefail
          mapfile -t SPECS < "$RUNNER_TEMP/specs.txt"
          npx playwright test "${SPECS[@]}" --timeout="$TEST_TIMEOUT_MS" --reporter=list,json,html

      - name: Clock run
        if: always() && steps.select.outputs.count != '0'
        run: echo "T_RUN=$(date +%s)" >> "$GITHUB_ENV"

      - name: Timing and results
        if: always() && steps.select.outputs.count != '0'
        run: |
          python3 - <<'EOF'
          import json, os
          t0, ts, tr = (int(os.environ[k]) for k in ("T0", "T_SETUP", "T_RUN"))
          cap = int(os.environ["CAP_SECONDS"])
          specs = [l for l in open(os.path.join(os.environ["RUNNER_TEMP"], "specs.txt")) if l.strip()]
          path = os.path.join(os.environ["RUNNER_TEMP"], "results.json")
          per_file, failed, flaky = {}, set(), set()
          def walk(suite, file=None):
              file = suite.get("file") or file
              for spec in suite.get("specs", []):
                  for test in spec.get("tests", []):
                      per_file[file] = per_file.get(file, 0) + sum(r.get("duration", 0) for r in test.get("results", []))
                      if test.get("status") == "unexpected": failed.add(file)
                      if test.get("status") == "flaky": flaky.add(file)
              for child in suite.get("suites", []):
                  walk(child, file)
          stats = {}
          if os.path.exists(path):
              data = json.load(open(path))
              for s in data.get("suites", []):
                  walk(s)
              stats = data.get("stats", {})
          setup, run = ts - t0, tr - ts
          lines = [
              "", "#### Phase 0 timing",
              f"- setup (checkout to browsers ready): **{setup} s**",
              f"- subset run: **{run} s** for {len(specs)} spec files, **{run / max(len(specs), 1):.0f} s per spec** on average",
              f"- setup + subset: {setup + run} s; within the {cap // 60}-minute cap: **{'yes' if setup + run <= cap else 'NO'}**",
              f"- tests: {stats.get('expected', '?')} passed, {stats.get('unexpected', '?')} failed, {stats.get('flaky', '?')} flaky, {stats.get('skipped', '?')} skipped",
          ]
          if per_file:
              lines += ["", "| spec | seconds |", "|---|---|"]
              lines += [f"| `{f}` | {ms / 1000:.0f} |" for f, ms in sorted(per_file.items(), key=lambda x: -x[1])]
          if flaky:
              lines += ["", "**Flaky (failed, then passed on retry):** " + ", ".join(f"`{f}`" for f in sorted(flaky))]
          if not os.path.exists(path):
              lines += ["", "**No results file: the run did not finish (cap hit or setup failure).**"]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          open(os.path.join(os.environ["RUNNER_TEMP"], "failed.txt"), "w").write("".join(f"e2e/{f}\n" for f in sorted(failed)))
          EOF

      # Diagnostics for phase 0: each red file alone, after its own database reset (global-setup).
      - name: Re-run red files alone
        if: always() && steps.run.outcome == 'failure'
        working-directory: app/frontend/apps/web
        timeout-minutes: 15
        run: |
          set -uo pipefail
          { echo; echo "#### Red files re-run alone"; } >> "$GITHUB_STEP_SUMMARY"
          [ -s "$RUNNER_TEMP/failed.txt" ] || { echo "- none recorded (see the run log)" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          while read -r f; do
            if npx playwright test "$f" --timeout="$TEST_TIMEOUT_MS" --reporter=list --retries=0 > "$RUNNER_TEMP/alone-$(basename "$f").log" 2>&1; then
              echo "- \`$f\`: green alone, so **order dependency (or flake)**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$f\`: red alone too, so a real failure at this commit" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$RUNNER_TEMP/failed.txt"

      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.count != '0'
        with:
          name: e2e-subset-${{ matrix.run.key }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/selection.json
            ${{ runner.temp }}/results.json
            ${{ runner.temp }}/alone-*.log
            app/frontend/apps/web/playwright-report
            app/frontend/apps/web/test-results

      - name: Verdict
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          if [ "$RUN_OUTCOME" = "failure" ]; then echo "::error::the subset has red specs (see the summary)"; exit 1; fi
          echo "subset green (or empty)"
