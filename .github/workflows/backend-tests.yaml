name: Backend tests

# PAD-278 (audit M20): the backend suite runs on both database backends.
#
# `sqlite` is the fast path developers run locally (foreign keys enforced since
# PAD-278). `postgres` is what production runs: the scratch database is built by
# the real Alembic migrations, so a model column with no migration, a second
# head, or a migration that does not apply cleanly fails here — before the
# image is built (audit H13/M20). Both jobs must pass.
#
# No workflow-level `paths:` filter, on purpose: a required check that is
# skipped blocks the PR forever (see deploy-staging.yaml). The suite takes about
# ten minutes on a quiet runner and up to ~30 under load (2026-09-16: 27m30s on
# sqlite while ten runs were in flight), so it simply runs on every pull request
# with a 45-minute budget — headroom above the slowest run seen, not a hang
# detector. A job cancelled at the budget is progress, not a stall, unless its
# last dot-line is old (B-099).

on:
  pull_request:
    branches: [ staging, main ]
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  sqlite:
    name: pytest (sqlite, FK on)
    runs-on: ubuntu-latest
    # Raised 45 -> 60 (2026-10-08): the suite grows; the Postgres lane already ran into its cap.
    # test_backend_ci_timeouts.py pins both values.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install . pytest
      # B-091: the VM-side scripts are shell; shellcheck had flagged the
      # restore-check bug (SC2318) and nothing ran it. The runner image ships
      # shellcheck, so this costs a second. startup.sh is a Terraform template
      # (${var.…} interpolations), not a shell script, so it is left out.
      - run: |
          files=()
          for f in scripts/*.sh; do [ "$f" = scripts/startup.sh ] || files+=("$f"); done
          shellcheck -S warning "${files[@]}"
      # B-127: the second path is the E2E seed's own pytest file (PAD-223). It lives
      # beside the seed it tests, outside padel_app/tests, and until 2026-09-21 no lane
      # collected it. test_every_test_file_is_collected.py reads THIS line.
      - run: python -m pytest padel_app/tests ../frontend/apps/web/e2e/scripts -q -p no:warnings

  postgres:
    name: pytest (postgres, real migrations, group ${{ matrix.group }}/2)
    runs-on: ubuntu-latest
    # Raised 45 -> 75 (2026-10-08): the lane took 44-45 min. PAD-654 (2026-10-13): it then ran 46-73
    # min against 75 (14 green runs, median 54), so it is two pytest-split shards, each with its own
    # database and a 60-minute cap. test_backend_ci_timeouts.py pins it; the `shards` job below checks
    # that the two groups together run every test exactly once.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [ 1, 2 ]
    services:
      postgres:
        # PAD-653 (delivery.ci-images rule 4): our own GHCR copy of postgres:15, refreshed weekly by
        # mirror-ci-images.yaml. Anonymous ECR Public (PAD-598) hit its per-IP data limit on the
        # shared runners ("toomanyrequests: Data limit exceeded" at Initialize containers).
        image: ghcr.io/padellevelup/ci-postgres:15
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: padel_app_user
          POSTGRES_PASSWORD: padel_app_test
          POSTGRES_DB: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U padel_app_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEVAPP_TEST_DB: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: padel_app_user
      POSTGRES_PW: padel_app_test
      FLASK_ENV: development
      SHARD: ${{ matrix.group }}
      LEVAPP_SHARD_IDS: ${{ github.workspace }}/shard-ids.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install . pytest pytest-split==0.10.0
      # B-127: the second path is the E2E seed's own pytest file (PAD-223). It lives
      # beside the seed it tests, outside padel_app/tests, and until 2026-09-21 no lane
      # collected it. test_every_test_file_is_collected.py reads THIS line.
      # PAD-654: pytest-split runs group $SHARD of 2 (by count until a durations file is committed).
      - run: python -m pytest padel_app/tests ../frontend/apps/web/e2e/scripts -q -p no:warnings --splits 2 --group "$SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-ids-${{ matrix.group }}
          path: shard-ids.txt
          if-no-files-found: error
      # PAD-299: the same drift gate deploy-staging runs (PAD-220), on every PR.
      # The pytest run above builds its own throwaway schema and drops it, so
      # migrate a fresh database to head and ask flask db check whether the
      # models describe it. B-062: an index a migration created but no model
      # declared passed both pytest jobs and only failed at the deploy.
      - name: Models match the migrations (flask db check)
        if: matrix.group == 1
        env:
          FLASK_APP: padel_app
          POSTGRES_DB: drift_check
        run: |
          PGPASSWORD="$POSTGRES_PW" psql -h localhost -U padel_app_user -d postgres -c 'CREATE DATABASE drift_check'
          python -m flask db upgrade
          python -m flask db check

  # PAD-654: the two Postgres shards together run every test exactly once. Each shard wrote the ids
  # it selected; a full collection (no database needed) must equal their union, with no overlap.
  shards:
    name: postgres shards cover the suite
    needs: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEVAPP_TEST_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install . pytest
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-ids-*
          path: ${{ github.workspace }}/shards
      - name: Compare the shards with a full collection
        run: |
          python -m pytest padel_app/tests ../frontend/apps/web/e2e/scripts --collect-only -q -p no:warnings \
            | grep '::' | sort > "$RUNNER_TEMP/all.txt"
          python scripts/check_shards_cover_suite.py "$RUNNER_TEMP/all.txt" "${{ github.workspace }}"/shards/*/shard-ids.txt
